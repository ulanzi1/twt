      description: "Lets the operator surface recover the built export across a page reload. ⛔ Returns only exports built through this off-portal route — a member's own self-service portal export is never surfaced here. Requires an admin session, the `member.data_rights` permission (pariwar dimension) and a fresh `member_data_rights` step-up elevation. `Idempotency-Key` is REQUIRED: a replay of the same key is refused with a typed 409 rather than silently re-executed."

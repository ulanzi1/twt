                clause_id:
                  type: string
                  pattern: ^niy\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*(?:\.[a-z0-9]+(?:-[a-z0-9]+)*)?$
                subclause:
                  type: string
                  minLength: 1
              required:
                - kind
                - clause_id
                - subclause
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - named_cohort
                definition:
                  type: string
                  minLength: 1
              required:
                - kind
                - definition
              additionalProperties: false
            - type: "null"
        status:
          type: string
          enum: &a7
            - draft
            - in_review
            - signed_off
            - published
            - discarded
        authoredByActor:
          type: string
          format: uuid
        toneReviewedBy:
          type:
            - string
            - "null"
          format: uuid
        toneReviewedAt:
          type:
            - string
            - "null"
          format: date-time
        toneReviewContentHash:
          type:
            - string
            - "null"
        publishedClauseVersionId:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        auditId:
          type:
            - string
            - "null"
          format: uuid
      required:
        - draftId
        - pariwarId
        - clauseId
        - operation
        - payload
        - effectiveDate
        - benefitMechanism
        - affectedMemberScope
        - status
        - authoredByActor
        - toneReviewedBy
        - toneReviewedAt
        - toneReviewContentHash
        - publishedClauseVersionId
        - createdAt
        - updatedAt
        - auditId
      additionalProperties: false
    CreateDraftBody:
      oneOf:
        - type: object
          properties:
            operation:
              type: string
              enum:
                - create
            clauseId:
              type: string
              pattern: ^niy\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*(?:\.[a-z0-9]+(?:-[a-z0-9]+)*)?$
            payload:
              type: object
              additionalProperties: {}
            effectiveDate:
              type: string
              format: date-time
            benefitMechanism:
              type: string
              enum: *a5
          required:
            - operation
            - clauseId
            - payload
            - effectiveDate
            - benefitMechanism
          additionalProperties: false
        - type: object
          properties:
            operation:
              type: string
              enum:
                - amend
            clauseId:
              type: string
              pattern: ^niy\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*(?:\.[a-z0-9]+(?:-[a-z0-9]+)*)?$
            payload:
              type: object
              additionalProperties: {}
            effectiveDate:
              type: string
              format: date-time
            affectedMemberScope:
              oneOf:
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - all_members
                  required:
                    - kind
                  additionalProperties: false
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - past_lockin
                  required:
                    - kind
                  additionalProperties: false
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - rule_subclause
                    clause_id:
                      type: string
                      pattern: ^niy\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*(?:\.[a-z0-9]+(?:-[a-z0-9]+)*)?$
                    subclause:
                      type: string
                      minLength: 1
                  required:
                    - kind
                    - clause_id
                    - subclause
                  additionalProperties: false
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - named_cohort
                    definition:
                      type: string
                      minLength: 1
                  required:
                    - kind
                    - definition
                  additionalProperties: false
            benefitMechanism:
              type: string
              enum: *a5
          required:
            - operation
            - clauseId
            - payload
            - effectiveDate
            - affectedMemberScope
          additionalProperties: false
    UpdateClauseDraftRequest:
      type: object
      properties:
        payload:
          type: object
          additionalProperties: {}
        effectiveDate:
          type: string
          format: date-time
        benefitMechanism:
          type: string
          enum: *a5
        affectedMemberScope:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - all_members
              required:
                - kind
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - past_lockin
              required:
                - kind
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - rule_subclause
                clause_id:
                  type: string
                  pattern: ^niy\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*(?:\.[a-z0-9]+(?:-[a-z0-9]+)*)?$
                subclause:
                  type: string
                  minLength: 1
              required:
                - kind
                - clause_id
                - subclause
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - named_cohort
                definition:
                  type: string
                  minLength: 1
              required:
                - kind
                - definition
              additionalProperties: false
            - type: "null"
      additionalProperties: false
    ToneReviewSignoffRequest:
      type: object
      properties:
        confirm:
          type: boolean
          enum:
            - true
      required:
        - confirm
      additionalProperties: false
    DiffPreviewResponse:
      type: object
      properties:
        structuredDiff:
          type: object
          properties:
            added:
              type: object
              additionalProperties: {}
            removed:
              type: object
              additionalProperties: {}
            changed:
              type: object
              additionalProperties:
                type: object
                properties:
                  from: {}
                  to: {}
          required:
            - added
            - removed
            - changed
          additionalProperties: false
        renderedDiff:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              before:
                type:
                  - string
                  - "null"
              after:
                type:
                  - string
                  - "null"
              changed:
                type: boolean
            required:
              - field
              - before
              - after
              - changed
            additionalProperties: false
      required:
        - structuredDiff
        - renderedDiff
      additionalProperties: false
    PublishClauseResponse:
      type: object
      properties:
        clauseVersionId:
          type: string
          format: uuid
        clauseId:
          type: string
          pattern: ^niy\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*(?:\.[a-z0-9]+(?:-[a-z0-9]+)*)?$
        version:
          type: integer
          exclusiveMinimum: 0
        auditId:
          type: string
          format: uuid
      required:
        - clauseVersionId
        - clauseId
        - version
        - auditId
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 512
        turnstileToken:
          type: string
      required:
        - email
        - password
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - mfa_required
        methods:
          type: array
          items:
            type: string
            enum:
              - webauthn
              - recovery_code
      required:
        - status
        - methods
      additionalProperties: false
    PasskeyRegisterOptionsRequest:
      type: object
      properties:
        enrollmentToken:
          type: string
        deviceLabel:
          type: string
          maxLength: 64
      additionalProperties: false
    PasskeyRegisterVerifyRequest:
      type: object
      properties:
        response:
          type: object
          additionalProperties: {}
        enrollmentToken:
          type: string
        deviceLabel:
          type: string
          maxLength: 64
      required:
        - response
      additionalProperties: false
    PasskeyRegisterVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
        recoveryCodes:
          type: array
          items:
            type: string
            minLength: 1
      required:
        - verified
      additionalProperties: false
    PasskeyAuthOptionsRequest:
      type: object
      properties: {}
      additionalProperties: false
    PasskeyAuthVerifyRequest:
      type: object
      properties:
        response:
          type: object
          additionalProperties: {}
      required:
        - response
      additionalProperties: false
    PasskeyAuthVerifyResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          enum:
            - true
      required:
        - authenticated
      additionalProperties: false
    RecoveryConsumeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - code
      additionalProperties: false
    RecoveryConsumeResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          enum:
            - true
      required:
        - authenticated
      additionalProperties: false
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        turnstileToken:
          type: string
      required:
        - email
      additionalProperties: false
    PasswordResetRequestResponse:
      type: object
      properties:
        sent:
          type: boolean
          enum:
            - true
      required:
        - sent
      additionalProperties: false
    PasswordResetConsumeRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 32
        newPassword:
          type: string
          minLength: 12
          maxLength: 512
      required:
        - token
        - newPassword
      additionalProperties: false
    PasswordResetConsumeResponse:
      type: object
      properties:
        reset:
          type: boolean
          enum:
            - true
        webauthnReenrollmentRequired:
          type: boolean
          enum:
            - true
      required:
        - reset
        - webauthnReenrollmentRequired
      additionalProperties: false
    StepUpRequestRequest:
      type: object
      properties:
        actionContext:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - actionContext
      additionalProperties: false
    StepUpRequestResponse:
      type: object
      properties:
        sent:
          type: boolean
          enum:
            - true
        expiresInSeconds:
          type: integer
          exclusiveMinimum: 0
      required:
        - sent
        - expiresInSeconds
      additionalProperties: false
    StepUpVerifyRequest:
      type: object
      properties:
        otp:
          type: string
          minLength: 6
          maxLength: 8
      required:
        - otp
      additionalProperties: false
    StepUpVerifyResponse:
      type: object
      properties:
        elevated:
          type: boolean
          enum:
            - true
        elevatedUntil:
          type: string
          format: date-time
      required:
        - elevated
        - elevatedUntil
      additionalProperties: false
    SessionResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        nationalGrants:
          type: array
          items:
            type: string
      required:
        - userId
        - nationalGrants
      additionalProperties: false
  parameters: {}
paths:
  /api/v1/_meta/health:
    get:
      summary: Service health probe
      description: Substrate-proof endpoint authored at Story 1.4. Production /_meta/health lives at apps/api/ per Story 1.9+.
      tags:
        - _meta
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      summary: Admin login — first factor (email + password)
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/passkey/register/options:
    post:
      summary: WebAuthn enrollment — generate registration options
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterOptionsRequest"
      responses:
        "200":
          description: WebAuthn PublicKeyCredentialCreationOptionsJSON (provider-controlled)
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Enrollment not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Device cap reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/passkey/register/verify:
    post:
      summary: WebAuthn enrollment — verify + persist the credential
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegisterVerifyResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Enrollment denied/failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Device cap reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/passkey/authenticate/options:
    post:
      summary: WebAuthn second factor — generate authentication options
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthOptionsRequest"
      responses:
        "200":
          description: WebAuthn PublicKeyCredentialRequestOptionsJSON (provider-controlled)
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No login in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No passkey enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/passkey/authenticate/verify:
    post:
      summary: WebAuthn second factor — verify the assertion
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyAuthVerifyResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/recovery/consume:
    post:
      summary: Recovery code second factor — consume + burn
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryConsumeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryConsumeResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid recovery code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password-reset/request:
    post:
      summary: Request a password-reset link (anti-enumeration)
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password-reset/consume:
    post:
      summary: Consume a password-reset link (forces WebAuthn re-enrollment)
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConsumeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetConsumeResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid or expired link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/step-up/request:
    post:
      summary: Request a step-up OTP for a gated action
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpRequestRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepUpRequestResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/step-up/verify:
    post:
      summary: Verify a step-up OTP — elevate the session
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepUpVerifyResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Step-up verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      summary: Logout — destroy the session and emit a login.logout audit event
      tags:
        - admin-auth
      responses:
        "204":
          description: Session destroyed
        "401":
          description: No authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: CSRF token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/audit/verify-integrity:
    post:
      summary: On-demand audit-log integrity verification (walk the global hash chain)
      description: Walks the entire global audit hash chain, records a verdict to audit_integrity_checks, and returns it. Requires an authenticated admin session.
      tags:
        - audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditIntegrityCheckRequest"
      responses:
        "200":
          description: Integrity-check verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIntegrityCheckResult"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/session:
    get:
      summary: Session introspection — the authenticated admin id + global-scope grants
      description: Returns the current admin session id + the permission keys held at the global ("national") scope ceiling. The admin SPA gates nav + routes on these grants (advisory; requireAdminSession is the real boundary on every endpoint).
      tags:
        - admin-auth
      responses:
        "200":
          description: Current admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/audit/integrity-checks:
    get:
      summary: Audit-integrity check history (last automated + recent checks)
      description: Returns recent integrity-check verdicts (default 30, most-recent first), each with its most-recent acknowledgement (null if never acknowledged). Optionally filtered to one trigger source. Requires an authenticated admin session.
      tags:
        - audit
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 200
          required: false
          name: limit
          in: query
        - schema:
            type: string
            minLength: 1
          required: false
          name: triggerSource
          in: query
      responses:
        "200":
          description: Integrity-check history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIntegrityCheckList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/audit/integrity-checks/{checkId}/acknowledge:
    post:
      summary: Acknowledge a (failed) integrity check with an investigation-ticket reference
      description: Records an append-only acknowledgement (separate audit_integrity_acknowledgements table — the verdict ledger stays immutable) capturing the external ticket reference. Requires an authenticated admin session.
      tags:
        - audit
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: checkId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditIntegrityAcknowledgeRequest"
      responses:
        "200":
          description: Acknowledgement recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditIntegrityAcknowledgement"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Integrity check not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/provisioning/pariwars:
    post:
      summary: Provision a new Pariwar (mint id + persist passport)
      description: Mints a fresh pariwar_id (UUID v4), persists the Pariwar-Passport via a self-scoped write, emits a pariwar.provisioned audit event, and returns the created passport + its derived /p/<id>/ path-scope. GLOBAL surface; requires an authenticated admin holding pariwar.provision at global scope.
      tags:
        - provisioning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPariwarRequest"
      responses:
        "200":
          description: Pariwar provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionedPariwar"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — pariwar.provision at global scope required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Provisioning-status view (provisioned Pariwars + latest deploy status)
      description: Lists provisioned Pariwars (cross-readable passport rows) with their derived /p/<id>/ path-scope + latest deploy status. Forced-paginated (bounded limit, Story 1.14) + under the named read rate ceiling. Requires pariwar.provision at global scope.
      tags:
        - provisioning
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: Provisioning-status list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningStatusList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — pariwar.provision at global scope required

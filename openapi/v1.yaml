        - fromClauseVersionId
        - toClauseVersionId
        - diffDocument
        - affectedMemberScope
        - createdAt
        - auditId
      additionalProperties: false
    ClauseDraftResponse:
      type: object
      properties:
        draftId:
          type: string
          format: uuid
        pariwarId:
          type: string
          format: uuid
        clauseId:
          type: string
          pattern: ^niy\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*(?:\.[a-z0-9]+(?:-[a-z0-9]+)*)?$

  /api/v1/p/{pariwarId}/moderation/appeals/{appealId}/decide:
    post:
      summary: Determine a moderation appeal (Trustee Panel)
      description: 'Records the §8.8 determination: `upheld` or `allowed`, and NOTHING ELSE — there is deliberately no third "varied" outcome, because a lesser sanction is a FRESH moderation act with its own ground, its own record and its own right of appeal. A REASONED OUTCOME is mandatory (stored Tier-1; never on an event payload or an audit line). Gated on `member.decide_moderation_appeal` — a SEPARATE key from `member.moderate`, because `member.moderate` is held by both pariwar_admin and the Trustee Panel and so cannot distinguish the appellate authority from the deciding one. Step-up required (`member_moderation_appeal`). ⭐ HOLDING THE KEY IS NOT SUFFICIENT: §8.8 requires the appeal be heard by a Panel member who did not take part in the act appealed against, and that exclusion is enforced server-side before any write as a 409. ⛔ AN `allowed` OUTCOME DOES NOT RESTORE THE MEMBER. It DIRECTS a restore; the restore is a subsequent, separately-attributed act through the moderation write path with its own Decision Note and the Panel-exclusive `member.restore_terminated` check. `directs_restore` on the response is a signal, not a report.'
      tags: *a73
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: appealId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideModerationAppealRequest"
      responses:
        "200":
          description: The determination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAppealDecided"
        "400":
          description: Request validation failed (e.g. a missing or too-short reasoned outcome)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (member.decide_moderation_appeal) for this Pariwar; OR step-up required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such appeal in this Pariwar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The appeal is already determined (`member_moderation.appeal_already_decided`); OR ⭐ the adjudicator TOOK PART in the act under appeal (`member_moderation.appeal_adjudicator_excluded`) — a 409 and NEVER a 403, because the actor holds the key and may determine other appeals; OR the acting admin has no display name on record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/p/{pariwarId}/admin/trustee-lite:
    get:
      summary: "The trustee worklist: every trustee-attention item across six sources, in one shape"
      description: "Aggregates cycle-freeze (6.13), R9 voting (6.14), concealment (6.15), appeals (6.16), reconciliation (9.8) and moderation (10.10) into ONE normalized row shape, plus the R7 violator arm. Read-only: nothing is written, no step-up is required, and NOTHING is decrypted (rows carry identifiers, machine codes and controlled non-PII display snapshots only — each row cross-links to a canonical surface that authorizes and decrypts on its own). AUTHORIZATION IS PER SECTION over six EXISTING keys (cycle.freeze · claim.r9_vote · claim.verify · claim.appeal_review OR claim.appeal_vote · reconciliation.review · member.moderate); a section the caller cannot act on is ABSENT from the response, never present-and-empty. ORDERING within a section is two-tier: rows with a deadline first (ascending), then undated rows by age descending — four of the six sources define no deadline at all, and none is fabricated to make the sort look uniform. SEVERITY is present only on the two dated categories and is structurally null on moderation and violator rows (a severity score on a moderation row would itself be a recommendation). The `violator_flags` section is a DISCRIMINATED union, never a bare list: it renders `detection_unavailable` (naming the missing producer) until the contribution-fact producer lands, because an empty violator list on a governance surface reads as a false all-clear."
      tags:
        - trustee-lite
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
      responses:
        "200":

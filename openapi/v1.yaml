              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/p/{pariwarId}/member/surveys:
    get:
      summary: The member's open, in-audience surveys
      description: "Returns every survey that is open at the server's clock and whose audience contains this member, each carrying an `answered` flag. Surveys the member has ALREADY answered are returned with `answered: true` rather than filtered out — a member who answered yesterday must see that they did, not an empty list. Member-session-gated (no RBAC key); a `pariwarId` that does not match the member's own JWT is a 404, not a 403."

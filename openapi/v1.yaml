              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required (member session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The pariwarId does not match the member session, or no such survey in this Pariwar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This member has already responded; OR the survey is not open for responses at this time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An answer is missing, unknown, or violates a declared bound (the error names the offending question_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

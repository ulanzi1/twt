name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  push:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [install, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

  db-check:
    name: db-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    # Pure static analysis over packages/domain/src/schema/*.ts +
    # packages/domain/migrations/meta/*.json. No DB connection required.
    # `db:check` is `drizzle-kit check` — a canned migration-consistency command;
    # it CANNOT host custom forbidden-pattern asserts. The substantive FR-100
    # v1-baseline non-add asserts (no payout_destinations table / column /
    # endpoint / Zod schema) therefore land in the separate repo-global
    # `schema-diff` job below (Story 1.16c), NOT here — disjoint ownership
    # (deferred-work D9-1.2). Story 1.2 commits this lightweight drift primitive.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run db:check

  contracts-check:
    name: contracts-check (OpenAPI generator determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    # Pure static analysis: re-emit openapi/v1.yaml from packages/contracts/
    # Zod schemas and assert byte-identical to the committed file. Architecture
    # §3.2 line 1862-1865 generator-determinism CI gate. No DB / network.
    # Story 1.4 commits the integrity primitive on a substrate-proof toy
    # endpoint; substantive endpoints land at apps/api/ Stories 1.9+. The
    # OpenAPI breaking-change semantic-diff CI gate (architecture §3.2 line
    # 1856-1860) is deferred to Story 1.9+ when route surfaces substantively
    # populate (deferred-work D1-1.4).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run contracts:check-openapi-determinism

  crypto-check:
    name: crypto-check (encryption substrate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    # Encryption substrate unit tests for @twt/domain/src/encryption: Tier-1
    # envelope round-trip + AAD binding; Tier-2 blind-index determinism +
    # cross-Pariwar separation; fake-KMS provider correctness. No DB; no live
    # KMS; KMS_TEST_MODE=fake. Architecture §2.7 + AR-12 + AR-13. Story 1.5
    # commits the substrate; live Cloud KMS provisioning + integration-test
    # live-DB substrate deferred per D1-1.5 + D2-1.3 (Story 1.6).
    env:
      KMS_TEST_MODE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run crypto:check

  tokens-theme-check:
    name: tokens-theme-check (FM-4 @theme sync determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    # FM-4 token-sync gate (Story 1.17, AC2): re-render packages/tokens/src/theme.css
    # from the canonical TS token source (packages/tokens/src/tokens.ts) and assert
    # byte-identical to the committed artifact. UX spec §6 FM-4 (source canonical,
    # compiled output tracked) — the "regenerate and assert identical" shape of the
    # contracts-check OpenAPI-determinism gate above. A packages/tokens turbo task
    # (the token source is a single-workspace artifact, NO git-diff) — NOT a repo-root
    # script and NO fetch-depth: 0. The token-module unit tests ride the `test` job
    # (@twt/tokens is a workspace). Green by construction on the introducing PR; bites
    # the moment src/tokens.ts changes without regenerating src/theme.css.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run tokens:check-theme-determinism

  i18n-parity:
    name: i18n-parity (bilingual surface contract — Hindi parity gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    # Bilingual surface contract gate (Story 2.1, AC3/AC5): assert every member-facing
    # en/ translation key has a non-empty hi/ parity entry (architectural-freeze row 10).
    # The pure core (packages/i18n/scripts/lib.ts) is unit-tested on the `test` job
    # (@twt/i18n is a workspace); this job runs the impure check over locales/. A
    # packages/i18n turbo task (the locale catalog is a single-workspace artifact, NO
    # git-diff) — NOT a repo-root script and NO fetch-depth: 0. Green-with-teeth on the
    # introducing PR: `common` defaults member-facing and is parity-enforced now; teeth
    # grow domain-by-domain as Epic 2+ surfaces add locale strings (data-driven, no gate
    # code change). admin-facing namespaces may ship English-only.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run i18n:check-parity

  pii-scrape:
    name: pii-scrape (FR-74 Public-vs-Private matrix gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    # FR-74 PII scrape gate (Story 1.16b): consumes the Public-vs-Private
    # visibility matrix (packages/contracts/public-pages/public-vs-private-matrix.yaml)
    # and runs the 4 tier-leak rules + naked-PII detector against available render
    # snapshots. Architecture §2.7 L1522-1524 + Principle #7 + the planned ci.yml
    # "scrape-test" step (architecture L4159); deferred-work D8-1.5 routes the gate
    # here. A packages/contracts/ turbo task (config is a contracts artifact, NO
    # git-diff) — NOT a repo-root script, and NO fetch-depth: 0 (unlike
    # friction-budget, this gate validates the current matrix + current renders; it
    # does not diff against a PR base ref). Green by construction at v1: the matrix
    # is an empty scaffold and no public render exists yet (apps/public is a tsc stub
    # until Story 2.5; apps/api/src/modules/public-pages empty until Epic 11b), so
    # every surface is a no-op; teeth grow surface-by-surface as Epic 11a populates
    # the matrix and Story 2.5/11a.2 render public surfaces (data-driven, no code
    # change). The engine's unit tests ride the `test` job (contracts is a workspace).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run contracts:check-pii-scrape

  friction-budget:
    name: friction-budget (UX-DR3 friction-as-budget gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    # Repo-global friction-budget gate (Story 1.16a): friction-budget.yaml metric
    # ceilings (bundle bytes + page-weight, baseline-of-record) + friction-budget.md
    # named-payer declaration ledger. Architecture Principle #8 (line 294) + §4.11.1
    # (lines 2785-2799) + UX Stance #2 / AR-60 / UX-DR3. Repo-global (root config +
    # cross-app build scan + PR git-diff) → a repo-root tsx script, not a per-package
    # turbo task. fetch-depth: 0 because the declaration facet diffs against the PR
    # base ref (GITHUB_BASE_REF) — every other job uses the default shallow clone;
    # this one can't. Green by construction at v1 (seed ledger + no-op-on-absent-
    # build-output); grows teeth surface-by-surface as member build outputs land
    # (Epic 2 public Astro, later member web/native bundles). Live critical-render-
    # path timing on the canonical 3GB-Android device is explicitly deferred (AC-6).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm friction:test
      - run: pnpm friction:check

  schema-diff:
    name: schema-diff (FR-100 non-add guard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    # Repo-global FR-100 non-add gate (Story 1.16c): asserts the v1 codebase ships
    # ZERO payout-destination surface (architecture §1.13 Hook 2 L1149-1163 + PRD
    # §4.15 FR-100 L1253) so the v2/v3 Durghatana Sahayata activation is a
    # GREENFIELD addition, never a column/index add to a v1 table. Four
    # precision-scoped scanners read fr-100-non-add.yaml + scan the latest drizzle
    # snapshot + migrations/*.sql (tables/columns), apps/api/src/**/*.ts route
    # literals (endpoints), and packages/contracts/src/**/*.ts exports (Zod). It is
    # repo-global (spans packages/domain + apps/api + packages/contracts) → a
    # repo-root tsx script, NOT a per-package turbo task, and NOT a `db:check` fold-in
    # (db:check = canned drizzle-kit check, can't host custom asserts — see db-check
    # job above; disjoint ownership, deferred-work D9-1.2). INVARIANT SCAN of current
    # state, NOT a git-diff → like `pii-scrape` and UNLIKE `friction-budget`, this
    # job does NOT set fetch-depth: 0 (no base-ref diff; a whole-state scan can
    # neither miss an artifact added earlier on the branch nor wrongly pass one
    # already merged). Green by construction on the introducing PR — the four real
    # scan roots are clean and the dozens of documentary keyword mentions
    # (docs/_bmad-output/*.md/sprint-status.yaml/this gate's fixtures/the config) are
    # precision-scoped OUT. Runs continuously across Epics 1-13; Story 14.4 records
    # the final-state proof + permanent post-v1 governance (v2 allowlist extension =
    # trustee-attested ADR per Story 14.7). `scripts/` is not a workspace → the job
    # runs `pnpm schema:test` explicitly (mirror friction-budget's friction:test).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm schema:test
      - run: pnpm schema:check

  benefit-mechanism:
    name: benefit-mechanism (FR-100 / FR-7 Hook 1 enum-tag guard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    # Repo-global FR-100 Hook 1 enum-tag gate (Story 1.16d): asserts every
    # Niyamavali rule record carries a benefit_mechanism ∈ {pool, reserve}, and
    # that v1 rules only ever use `pool` (architecture §1.13 Hook 1 L1133-1147 +
    # FR-7 + PRD §4.15 FR-100) — so the Durghatana Sahayata v2/v3 `reserve`
    # activation is forward-compatible (rules ADD without re-tagging existing v1
    # rules). The SIBLING of 1.16c's schema-diff (Hook 2, non-add): epics L566
    # pairs them as the FR-100 forward-compat-hooks CI. Three pure checks read
    # benefit-mechanism.yaml + run: (a) rule-record tag scan over migration SQL /
    # seed / fixture rule_sources; (b) enum-definition cross-check (dynamic-imports
    # the shipped BenefitMechanism z.enum, asserts .options == config.mechanisms);
    # (c) rule-table schema-column check over the latest drizzle snapshot. It is
    # repo-global (rule artifacts span packages/domain + apps/api/src/modules/rules)
    # → a repo-root tsx script, NOT a per-package turbo task; the forward-compat
    # enum lives in packages/contracts (importable by Epic 2). INVARIANT SCAN of
    # current state, NOT a git-diff → like `schema-diff`/`pii-scrape` and UNLIKE
    # `friction-budget`, this job does NOT set fetch-depth: 0. NO-OP UNTIL EPIC 2:
    # the rule registry (clause_versions + seed + apps/api/src/modules/rules) is
    # Story 2.3 — at v1 checks (a)/(c) find nothing (no rule records / no rule
    # table) and check (b) has TEETH (enum == config), so the gate is green by
    # construction WITH teeth on the introducing PR; teeth grow surface-by-surface
    # as Epic 2 populates rule_sources (data-driven, no code change). Story 14.5
    # records the final-state closure (every v1 rule `pool`, reserve tags zero v1
    # rules) + flips v1_only at v2 (trustee-attested ADR per Story 14.7). `scripts/`
    # is not a workspace → the job runs `pnpm benefit:test` explicitly (mirror
    # schema:test); no turbo.json entry (a repo-root tsx script is not a turbo task).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm benefit:test
      - run: pnpm benefit:check

  microcopy:
    name: microcopy (UX-DR71 vocabulary + UX-DR73 numeral + FM-14 token-governance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: install
    # Repo-global forensic-microcopy / vocabulary / numeral-discipline gate (Story 1.17,
    # AC3): enforces the UX-DR71 vocabulary register (prohibited member-visible terms →
    # canonical terminology + scarcity/panic/Pool-Reality-comparison tone prohibitions),
    # UX-DR73 + amendment-A2 numeral discipline (Devanagari digits operational-vs-ceremonial;
    # packages/i18n is the sanctioned home for locale/numeral formatting (Story 2.1 landed), and the
    # FM-14 #2 token-governance subset (no magic-number color literals in component code).
    # Every finding names file + line + the canonical replacement (the benefit-mechanism
    # "name the offender" contract). Repo-global (a microcopy.yaml root config + a
    # cross-app copy/component scan) → a repo-root tsx script, NOT a per-package turbo task;
    # scripts/ is not a workspace so the job runs `pnpm microcopy:test` explicitly before
    # `pnpm microcopy:check` (the schema-diff / benefit-mechanism precedent). INVARIANT SCAN
    # of the declared scope, NOT a git-diff → NO fetch-depth: 0 (mirror schema-diff /
    # benefit-mechanism, not friction-budget). v1 footprint [Decision 2]: the FM-14
    # magic-number check + active vocabulary/tone checks have teeth NOW over a bounded
    # allow-listed apps/admin slice; the broad member-surface vocabulary/numeral register
    # stays forward-compat (scope.copy_globs empty) until Epic 2+ member surfaces land —
    # data-driven, no gate code change. Green-with-teeth on the introducing PR.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm microcopy:test
      - run: pnpm microcopy:check

  domain-invariants:
    name: domain-invariants (domain-accessor-invariants gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    # Family (a) forced-pagination clamp: every dynamic `.limit(...)` in
    # packages/domain/src must route through clampLimit() (or be an integer literal) —
    # an unbounded limit drains a connection, a negative limit is a Postgres `LIMIT -1`
    # bypass (2.7 P2). Static TS-AST scan, no DB / network. See
    # scripts/domain-accessor-invariants/ + docs/domain-accessor-invariants.md.
    # INVARIANT SCAN of the declared scope → NO fetch-depth: 0 (mirror microcopy).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm domain-invariants:test
      - run: pnpm domain-invariants:check

  member-state-invariant:
    name: member-state-invariant (members.state is projector-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    # Story 3.1 AC2: members.state is a replay-derived cache writable ONLY by the
    # event-replay projector (packages/domain/src/member/project.ts). Static TS-AST
    # scan of packages/domain/src — flags any .update(members).set({ state }),
    # .insert(members)…onConflictDoUpdate({ set: { state } }), or members.state = …
    # outside the projector allowlist. The independent runtime guard is the BEFORE
    # UPDATE trigger in migration 0018. No DB / network. See
    # scripts/member-state-invariant/. INVARIANT SCAN → NO fetch-depth: 0 (mirror
    # domain-invariants).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm member-state:test
      - run: pnpm member-state:check

  claim-state-invariant:
    name: claim-state-invariant (claims.current_state is projector-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    # Story 6.1 AC3: claims.current_state is a replay-derived cache writable ONLY by the
    # event-replay projector (packages/domain/src/claim/project.ts). Static TS-AST scan
    # of packages/domain/src — flags any .update(claims).set({ currentState }),
    # .insert(claims)…onConflictDoUpdate({ set: { currentState } }), or
    # claims.currentState = … outside the projector allowlist. The independent runtime
    # guard is the BEFORE UPDATE trigger in migration 0051. No DB / network. See
    # scripts/claim-state-invariant/. INVARIANT SCAN → NO fetch-depth: 0 (mirror
    # member-state-invariant). Twin of Story 3.1's members.state gate.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm claim-state:test
      - run: pnpm claim-state:check

  claim-canonical-id-invariant:
    name: claim-canonical-id-invariant (downstream flows key on claim_case_id only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    # Story 6.4 AC6/AC8: after ICP convergence the ONLY canonical id is claim_case_id; the
    # temporary intake_attempt_id is discarded downstream (AC7). Static TS-AST scan of the
    # downstream-flow roots (notification today; verification/appeal/publication as they land) —
    # flags any reference to intakeAttemptId / 'intake_attempt_id'. The ICP's own files are
    # outside the scanned roots (self-green); the teeth are proven by a known-bad fixture in
    # lib.test.ts. No DB / network. INVARIANT SCAN → NO fetch-depth: 0 (mirror claim-state-
    # invariant). See scripts/claim-canonical-id-invariant/.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm claim-canonical-id:test
      - run: pnpm claim-canonical-id:check

  claim-adjudication-human-actor-invariant:
    name: claim-adjudication-human-actor-invariant (adjudication routes require a human actor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    # Story 6.10 AC4/AC5 (D5): every claim-adjudication route composes the HUMAN-actor guard chain
    # [requireAdminSession, scopeResolutionHook, requirePermissionHook(...)] and carries NO machine/
    # service/system/null-actor path. Structured TS-AST scan of the explicit coverage set (the verifier
    # console today; Story 6.11 MUST add its approve/deny/escalate routes) — the runtime chain is the
    # real control, this gate is defense-in-depth. Teeth proven by inline known-bad fixtures in
    # lib.test.ts. No DB / network. INVARIANT SCAN → NO fetch-depth: 0 (mirror claim-canonical-id-
    # invariant). See scripts/claim-adjudication-human-actor-invariant/.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm claim-adjudication-human-actor:test
      - run: pnpm claim-adjudication-human-actor:check

  kyc-provider-boundary:
    name: kyc-provider-boundary (DigiLocker transport is provider-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    # Story 3.3a AC3 / AR-43 (architectural-freeze row 13): the DigiLocker SDK/transport
    # (xml-crypto + @xmldom/xmldom / xpath / @xmldom/is-dom-node) may be imported ONLY from
    # apps/api/src/modules/kyc/providers/digilocker/**. Static TS-AST scan of apps/api/src +
    # packages/*/src — flags any import/export/dynamic-import/require of the transport
    # outside that allowlisted directory. No DB / network. INVARIANT SCAN → NO fetch-depth: 0
    # (mirror member-state-invariant). See scripts/kyc-provider-boundary/.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm kyc-provider:test
      - run: pnpm kyc-provider:check

  access-wrapper-invariants:
    name: access-wrapper-invariants (validity fail-closed + constant-time secret compare + compensating-audit mechanization; channel + claim surface)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    # The I-3 "access wrapper is the new TOCTOU" family — ONE gate, THREE mechanized
    # invariants, each scanned over the code its commitment is about:
    #  (1) AI-4-3 — every validity ACCESS ENTRYPOINT (exported async fn returning
    #      Promise<…MemberValidityPayload>) in packages/validity-service/src must declare an
    #      explicit caller-XOR-internal marker and fail CLOSED when neither is supplied (the
    #      Story 4.6 omitted-caller default-open defect).
    #  (2) AI-5-1 / AI-6-1 — within any VERIFICATION CONTEXT on the channel access surface
    #      (packages/channels/src + the apps/api channel entrypoints: channel-webhooks,
    #      wa-opt-in, telegram-opt-in, channel-config, degraded-mode, device-token) AND the
    #      Epic-6 claim surface (apps/api/src/modules/{claims,nominee}, packages/domain/src/claim),
    #      a compare of two runtime values must use an approved constant-time comparator, never
    #      ===/!==/.includes/.startsWith/.localeCompare (the Story 5.4 hub.verify_token timing
    #      side-channel). Closes the AI-4-3 → AI-5-1 → AI-6-1 scope chain (Epic-4/5/6 retro I-1).
    #  (3) AI-5-3 (ADR-0030) / AI-6-1 — on the SAME channel + claim access surface, a direct
    #      audit.writeAuditEntry call is non-conformant unless the file is a named AI-4-3(d)
    #      isolated-best-effort exemption; packages/domain/src/audit/compensating.ts
    #      (withCompensatingAudit / writeRolledBackAudit) is the sole sanctioned caller
    #      otherwise (the H-4 audit-write-ordering gap from the Epic-5 retro).
    # Per the standing per-epic scope-extension convention (docs/access-wrapper-invariants.md),
    # (2)+(3) grow to cover each epic's new access surface. The rest of the checklist
    # (independent caller-auth, HMAC audit hashes, permission-key scope match, claim route
    # ownership/IDOR) stays reviewer-checklist convention.
    # Static TS-AST scan, no DB / network. See scripts/access-wrapper-invariants/ +
    # docs/access-wrapper-invariants.md. INVARIANT SCAN → NO fetch-depth: 0 (mirror
    # member-state-invariant).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm access-wrapper:test
      - run: pnpm access-wrapper:check

  determinism-replay:
    name: determinism-replay (FR-12A validity payload — P0 order invariant)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    # Story 4.6 AC2 (the load-bearing P0 commitment; AR-57). Runs the SAME pinned-instant Member
    # Validity composition 100× across REAL OS worker threads and asserts exactly ONE distinct
    # validity_payload_hash. ANY variance FAILS as a P0 architectural violation. This surfaces
    # hash-map / async-completion-order nondeterminism at the service composition layer that a
    # single-threaded loop cannot (confirmed D4-A). DB-free (the composition is pure). Any future
    # parallel/async rule-execution optimization MUST keep this green or be rejected at code review.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @twt/validity-service test:determinism

  channels-determinism:
    name: channels-determinism (Story 5.1 alert render — P0 byte-identical replay)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: install
    # Story 5.1 AC5 (the load-bearing commitment). Renders the SAME fixed alert_id payload 100× across REAL
    # OS worker threads and asserts exactly ONE distinct rendered hash PER CHANNEL. ANY variance FAILS as a
    # P0 architectural violation. Epic 4's determinism muscle in the channel domain. RENDER phase only —
    # provider `send`/delivery is non-deterministic and outside the guarantee. DB-free (renderers are pure).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @twt/channels test:determinism

  integration-tests:
    name: integration-tests (RLS + multi-tenant + events_log)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: install
    # Live-DB integration tests: events_log RLS policy regression +
    # cross-Pariwar adversarial leak test (Story 1.6) + events_log
    # append/replay/append-only (Story 1.3). Story 1.6 commits this Postgres 16
    # service-container substrate; deferred-work D2-1.3 cross-reference. Runs in
    # parallel with test / db-check / contracts-check / crypto-check (no
    # downstream job depends on it). The unit `test` job stays DB-free; this job
    # adds the live-DB surface without coupling.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twt_dev_app
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: twt_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U twt_dev_app -d twt_dev"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://twt_dev_app:devpass@127.0.0.1:5432/twt_dev?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Run integration tests
        # Filter to the workspaces with live-DB tests. @twt/jobs joined at Story
        # 1.11a (the audit-integrity walk's synthetic-tamper suite); @twt/api
        # joined at Story 1.11b (the trustee-UI endpoint suite: session
        # introspection + integrity-check history + acknowledge, plus the
        # pre-existing admin-auth / scope-tx / step-up live-DB specs); @twt/queue
        # joined at Story 1.12 (the pg-boss queue-client smoke suite). The Story
        # 1.12 keyed-store concurrency + RLS specs ride @twt/domain.
        # @twt/niyamavali-engine joined at Story 4.1 (the rule-evaluation engine's
        # clause-resolution / snapshot / idempotency-memo / audit-on-compute live-DB
        # specs). Downstream Stories (7.x Pool Engine, 9.x reconciliation) extend this
        # filter when their integration suites land. With DATABASE_URL set the
        # `describe.skipIf(!hasDatabase)` guards run instead of skipping.
        # @twt/validity-service joined at Story 4.6 (the FR-12A Member Validity
        # Service live-DB spec: canonical payload assembly + real tenure/retirement
        # producer + audit-on-admin-call + idempotent replay + the p95 benchmark
        # harness). @twt/channels joined at Story 5.1 (the dispatch audit-lines spec:
        # real writeAuditEntry dispatch + per-channel HMAC-not-raw-PII hash).
        run: pnpm turbo run test --filter=@twt/domain --filter=@twt/events --filter=@twt/jobs --filter=@twt/api --filter=@twt/queue --filter=@twt/niyamavali-engine --filter=@twt/validity-service --filter=@twt/channels

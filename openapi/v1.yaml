    post:
      summary: Record the member pool-onboarding tutorial outcome (completed | skipped)
      description: Records the authenticated member’s onboarding-tutorial outcome as a member-level audit line for analytics (completed and skipped are distinct). The app calls this best-effort / fire-and-forget — the client’s local (MMKV) flag is the authoritative first-entry suppressor, so a failed call never blocks the tutorial’s dismissal nor re-shows it. Returns 204 (no body).
      tags:
        - pool-onboarding
      requestBody:

        - helpdesk
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:
            type: string
            enum:
              - open
              - in_progress
              - awaiting_member
              - resolved
              - closed
              - reopened
            description: Filter by lifecycle state
          required: false
          name: state
          in: query
        - schema:
            type: string
            description: '"My queue" — filter by the routed-to role'
          required: false
          name: routed_to_role
          in: query
        - schema:
            type: integer
            exclusiveMinimum: 0
            description: Page size (clamped to [1,200], default 50)
          required: false
          name: limit
          in: query
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
            description: Page offset (default 0)
          required: false
          name: offset
          in: query
      responses:
        "200":
          description: The paginated responder queue

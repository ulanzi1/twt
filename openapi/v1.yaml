    post:
      summary: Flip a feature flag for this Pariwar (creates a new immutable version)
      description: "Publishes the next version row for this flag in this tenant's scope. Prior rows are NEVER mutated (only their superseded_by_version forward-pointer), so historical flag states stay queryable for replay. `rationale` is REQUIRED and non-empty — FR-58C requires every flag change be audit-logged with actor + rationale, and a §1.5 hash-chain audit line is written on every flip. A concurrent double-flip loses the unique-constraint race and gets 409. Requires feature_flag.flip (narrower than feature_flag.view by design). Send an optional `Idempotency-Key` header to make a retried flip safe: a replay with the same key returns the original response instead of creating a second identical version. NOTE: `effective_from` may not be in the future — a flip takes effect immediately and scheduled flips are not supported."

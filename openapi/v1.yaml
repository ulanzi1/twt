      additionalProperties: false
    PasswordResetConsumeResponse:
      type: object
      properties:
        reset:
          type: boolean
          enum:
            - true
        webauthnReenrollmentRequired:
          type: boolean
          enum:
            - true
      required:
        - reset
        - webauthnReenrollmentRequired
      additionalProperties: false
    StepUpRequestRequest:
      type: object
      properties:
        actionContext:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - actionContext
      additionalProperties: false
    StepUpRequestResponse:
      type: object
      properties:
        sent:
          type: boolean
          enum:
            - true
        expiresInSeconds:
          type: integer
          exclusiveMinimum: 0
      required:
        - sent
        - expiresInSeconds
      additionalProperties: false
    StepUpVerifyRequest:
      type: object
      properties:
        otp:
          type: string
          minLength: 6
          maxLength: 8
      required:
        - otp
      additionalProperties: false
    StepUpVerifyResponse:
      type: object
      properties:
        elevated:
          type: boolean
          enum:
            - true
        elevatedUntil:
          type: string
          format: date-time
      required:
        - elevated
        - elevatedUntil
      additionalProperties: false
    SessionResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        nationalGrants:
          type: array
          items:
            type: string
      required:
        - userId
        - nationalGrants
      additionalProperties: false
  parameters: {}
paths:
  /api/v1/_meta/health:
    get:
      summary: Service health probe
      description: Substrate-proof endpoint authored at Story 1.4. Production /_meta/health lives at apps/api/ per Story 1.9+.
      tags:
        - _meta
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      summary: Admin login — first factor (email + password)
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/passkey/register/options:
    post:
      summary: WebAuthn enrollment — generate registration options
      tags:
        - admin-auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterOptionsRequest"
      responses:
        "200":
          description: WebAuthn PublicKeyCredentialCreationOptionsJSON (provider-controlled)
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Enrollment not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Device cap reached
          content:

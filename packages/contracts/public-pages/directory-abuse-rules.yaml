# ═══════════════════════════════════════════════════════════════════════════════════════════════
# directory-abuse-rules.yaml — anti-enumeration rules for the public Member Directory
# Story 11a.3 · Decision `2026-08-20-143` clause 4 (D4(a)) · FR-91 / FR-92 / epics.md C1
# ═══════════════════════════════════════════════════════════════════════════════════════════════
#
# ⭐ THIS FILE IS READ BY THE ROUTE. It is not documentation. `apps/api/src/modules/public-pages/`
# parses it at wiring time and evaluates every `active` rule on every directory request. A
# committed governance artifact that nothing reads is the vacuous-green defect Story 11a.1 existed
# to remove, and rejecting that shape is why D4(c) ("rules file only") was NOT chosen.
#
# ⛔ A MALFORMED FILE THROWS. It never degrades to "no rules" — the `parseCapabilityBar` doctrine.
# Unknown keys are a parse error, not a warning. If you are here to add a rule, the schema in
# `packages/contracts/src/public-pages/abuse-rules.ts` is the authority.
#
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# ⚠ WHAT THESE RULES DO **NOT** PROVE — READ THIS FIRST
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# (The `scripts/custom-field-governance/README.md` posture, copied deliberately: a detection
# surface that overstates its own reach is worse than one that admits its gaps, because the
# overstatement is what stops anyone from closing them.)
#
# 1. ⛔ THE AUDIT LINE IS A **COUNTER**, NOT A FORENSIC RECORD. `audit_log_entries` has NO context
#    or payload column — `authEventToAuditInput` HASHES `event.context` into `request_payload_hash`
#    (a SHA-256 digest) and hard-codes `resource_locator` to `user:<actorId|anonymous>`, which for
#    an unauthenticated visitor is the CONSTANT `user:anonymous`. ⇒ a fired rule proves THAT a rule
#    fired and WHEN. It does ⛔ NOT prove what was walked, by whom, or from where.
#    That is why the rule id and a coarse, non-PII query shape are pushed into `action` and
#    `resource_locator` — those two fields are the only triage signal that survives.
#    ⚠ D4(a)'s "the signal is real and reachable today" is TRUE. "Triageable today" is ⛔ FALSE.
#    (`2026-08-20-143` clause 10.)
#
# 2. ⛔ A WARM EDGE HIDES SCRAPER TRAFFIC FROM THIS ENTIRELY. `/members` is declared
#    `cache_policy: edge_cacheable` and D5(a) KEPT that. A cached hit never reaches the origin, so
#    both the rate limit and every rule below see only cache MISSES. A scraper walking pages 1..N
#    through a warm edge is invisible to the detection on this page.
#    ⚠ Inert TODAY — there is no Cloudflare in this repo and edge selection is contingent on DPDPA
#    legal review (`architecture.md` §5.8a). ⛔ But it is a NAMED DEPENDENCY, not a footnote:
#    re-examine this file the moment an edge/CDN is actually configured. (`-143` clause 11.)
#
#    ⭐⛔ AND THE SAME MECHANISM DEFEATS THE KILL SWITCH — `2026-08-21-145` cl.5(e). This cost was
#    recorded ONLY against detection; it applies identically to the per-Pariwar publication switch,
#    whose whole justification is "pull one Pariwar without redeploying". A Pariwar disabled for a
#    DPDPA or legal reason at time T keeps being served REAL MEMBER NAMES from every warm PoP for up
#    to `s-maxage` (300s), longer with stale-while-revalidate, and PER PAGE NUMBER — so a walker's
#    cached deep pages persist independently of page 1. ⇒ the kill switch has a multi-minute floor,
#    ⛔ it is not immediate, and anyone reaching for it under time pressure must be told that.
#
# 3. ⚠ THE KEY IS TRUSTWORTHY ONLY BEHIND THE SSR HOP. `apps/api` runs `trustProxy: true`, so
#    `request.ip` reads the `X-Forwarded-For` chain — which is what makes per-visitor keying
#    possible AT ALL through the SSR proxy, and simultaneously means a caller reaching `apps/api`
#    DIRECTLY can spoof it. The route is defended only behind the trusted hop; restricting direct
#    access is an INFRA control (network ACL / mTLS), ⛔ not a code control, and it is deferred.
#    ⛔ `trustProxy` is NOT re-tuned here: it would alter `request.ip` and origin checks for every
#    route in the app. (`-143` clause 9.)
#
#    ⭐ CORRECTED AT `2026-08-21-145` cl.2 — the note above USED TO BE WRONG IN A LOAD-BEARING WAY.
#    It said the key was "caller-supplied" and implied the only exposure was a caller who SKIPS the
#    SSR hop. In fact `apps/public` was APPENDING the visitor address to the browser-supplied
#    inbound chain, and `trustProxy: true` reads the LEFTMOST entry — so a scraper going THROUGH
#    the legitimate hop chose its own key with one request header, getting a fresh bucket and a
#    fresh counter window per request. ⛔ No infra control at the boundary could have seen it.
#    `apps/public` now forwards ONLY `Astro.clientAddress` and discards the inbound chain.
#    ⚠ The accepted cost: behind a real CDN the true client address is lost and the key becomes the
#    CDN's address — coarse, but ⛔ not forgeable. Re-examine when an edge is configured (note 2).
#
# 4. ⚠ THE COUNTERS ARE IN-MEMORY AND PER-INSTANCE. §1.4 records no Redis, so the same is true of
#    the rate-limit store: the EFFECTIVE ceiling is `max × instanceCount`, not a global limit.
#    ⛔ Do not describe any threshold below as a global one.
#
# 5. ⛔ THERE IS NO CONSOLE VIEW YET. D4(a) shipped the rules AND the enforcement and DEFERRED the
#    operator surface with a named trigger. Signals land as §1.5 audit lines and are reachable
#    through the Story 1.10 audit surface — ⛔ there is no purpose-built place to triage them, and
#    per (1) the line would not carry much to triage if there were.
#
# 6. ⛔ TWO CLAUSES OF THE EPIC AC HAVE NO SUBJECT ON THIS SURFACE, and neither is implemented
#    because neither CAN be. *"An authenticated session does not bypass rate limits"* — there is no
#    authenticated session on the Member Directory (`-143` clause 7: members are token-bearer, there
#    is no `apps/member-web`, and `apps/mobile` has no directory screen). *"Abuse-detected accounts
#    trigger temporary suspension + trustee review"* — there are no ACCOUNTS here; every visitor is
#    unauthenticated, so there is no account to suspend and no actor to route. The enforceable
#    residue is the **429** and the **audit line**. Both clauses become live at Epic 11b ONLY IF an
#    authenticated directory tier is ever built. (`-143` clause 12.)
#
# 7. ⛔ `epics.md` CITES "Story 10.6 query throttling" AS A PROTECTION LAYER. Story 10.6 is the
#    BULK OPERATIONS FRAMEWORK. That cross-reference is VERIFIED FALSE — ⛔ do not cite it as
#    coverage for this surface. This file plus the route's `limits.search` ceiling IS the coverage.
#
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# ⭐ THE INVARIANT THIS SURFACE EXISTS UNDER: A LEGITIMACY SURFACE, NOT A SOCIAL GRAPH
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# The Member Directory exists to support INSTITUTIONAL LEGITIMACY and TRUST VERIFICATION — so a
# prospective member can see the trust is real, and an existing member can verify a peer. ⛔ It is
# NOT a social network, NOT a discovery tool, and NOT a growth surface.
#
# ⛔ EXPLICITLY PROHIBITED DIRECTIONS — reject these at DESIGN time, not at review time:
#   (a) friend-finder or connection suggestions
#   (b) social graphing or member-relationship visualisation
#   (c) engagement gamification — badges, streaks, leaderboards, profile completeness scores
#   (d) "members you might know" style recommendation engines
#   (e) any feature that incentivises repeated member-discovery sessions
#
# ✅ ACCEPTABLE DIRECTIONS:
#   · tier-respecting search / filter for legitimate trust verification
#   · accessibility and performance improvements
#   · additional fields — ONLY with a trustee-attested matrix update
#
# ⭐ THE TEST A PROPOSAL MUST PASS: *"Does this serve institutional legitimacy or trust
# verification?"* If the honest answer is ENGAGEMENT or SOCIAL DISCOVERY, the proposal is
# REJECTED — at design time, before it is built and argued about.
# ═══════════════════════════════════════════════════════════════════════════════════════════════
#
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# ⭐ THE INVARIANT THE **SAHYOG DRIVE** EXISTS UNDER: REMEMBRANCE, NOT ANALYTICS
# (Story 11b.1 AC5 — the THIRD of the three places this block is recorded, alongside
#  `apps/public/src/lib/sahyog-render.ts` and `apps/public/src/pages/sahyog.astro`)
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# ⚠ THIS FILE NOW GOVERNS TWO SURFACES. Story 11b.1's `/sahyog` route reuses these rules unchanged
# (`loadDirectoryAbuseRules`), which is deliberate: the rules describe "an unauthenticated,
# paginated public collection", ⛔ not the Member Directory specifically. ⛔ But the two surfaces'
# INVARIANTS are ⛔ NOT the same, and collapsing them would lose both — the directory's failure mode
# is a SOCIAL GRAPH, this one's is a LEADERBOARD.
#
# The Sahyog Drive exists so anyone — a member's family, a prospective member, a stranger — can
# verify for themselves that this trust actually moves money, and so a drive run in someone's
# memory stays on the public record. ⛔ It is NOT a leaderboard, NOT a scoreboard, and NOT a way to
# harvest who gave what.
#
# ⛔ EXPLICITLY PROHIBITED DIRECTIONS — reject these at DESIGN time, ⛔ not at review time:
#   (a) contributor LEADERBOARDS of any kind
#   (b) RANKINGS — "top contributors", "supporter of the month", "most generous district"
#   (c) GAMIFICATION — badges, streaks, achievements, contribution milestones
#   (d) SOCIAL-PERFORMANCE METRICS — most-supportive district, public scoreboards, comparisons
#       between Pariwars, districts or people
#   (e) POPULARITY METRICS — most-viewed memorial, trending pools, view counts
#
# ✅ ACCEPTABLE DIRECTIONS:
#   · legitimate trust verification
#   · district / date historical research
#   · accessibility and performance improvements
#
# ⭐ THE TEST A PROPOSAL MUST PASS: *"Does this serve remembrance, transparency or claim
# discoverability?"* If the honest answer is ENGAGEMENT, RANKING or SOCIAL PERFORMANCE, the
# proposal is REJECTED — at design time, before it is built and argued about.
#
# ⛔⛔ AND THE SORT ORDER IS NOT A RANKING. The index orders by the drive's close/settle instant
# DESCENDING with a deterministic tie-break — ⛔ never by contribution count, ⛔ never by amount, and
# ⛔ no "most-supported" ordering is offered at any tier. ⭐ THIS IS THE PROHIBITION MOST LIKELY TO
# BE BREACHED BY ACCIDENT, because "sort by contributions" reads like a harmless table affordance
# rather than the leaderboard it builds. There is deliberately NO sortable column header on that
# page, and `visibleSahyogColumns` carries no comparator for one to hang off.
#
# ⚠ AND A SECOND THING THIS SURFACE CARRIES THAT THE DIRECTORY DOES NOT — a PUBLICATION-BASIS gate
# on the deceased member's name: the MEMBER'S OWN accepted T&C version must PIN the post-death
# publication clause. ⭐ It gates the NAME, ⛔ never the ROW: an unnamed drive renders in full, so the
# index degrades PER-POOL, ⛔ never per-page, and an absent basis removes a NAME, ⛔ never a DRIVE
# from the public record. ⛔ Do not add a rule, a metric or a log line that counts withheld names — a
# per-row "name withheld" tally is exactly the enumeration signal the render is built to avoid
# emitting.
# ⚠⛔ ⛔ NOT a per-subject consent gate, and it was until Story 11b.9: the family tick-box
# (`sahyog_drive_publication`) was DE-AUTHORISED by `2026-08-28-160` cl.3-5 and the box retired by
# `-162`. The family has ⛔ no veto over the member's own name (cl.6). ⭐ Every abuse property above
# is unchanged by that — only the BASIS moved.
#
# ⚠ THE EDGE-CACHE BLINDNESS AT NOTE 2 ABOVE APPLIES HERE UNCHANGED, and on this surface it is
# WORSE in one specific way: `/sahyog` is `edge_cacheable` at `s-maxage=300` AND it shared-caches
# Tier-1 PII behind a REVOCABLE consent. ⇒ a family's revocation keeps being served from every warm
# PoP, PER PAGE NUMBER, for up to five minutes after the switch flips. ⛔ Direct SQL is NOT the
# operational fallback. Re-examine the moment an edge/CDN is actually configured.
#
# ⛔⛔ BUILT IS ⛔ NOT PUBLISHED. Counsel's DPDPA review of THIS subject is HELD (`2026-08-24-157`
# cl.3(a), returning 2026-09-07) and this surface has ⛔ no Row-17 publication ratification of its
# own. ⚠ Counsel HAS NOT REVIEWED this subject — ⛔ never write that counsel is not engaged, which
# has been false since 2026-06-21 (`2026-08-24-158`).
# ═══════════════════════════════════════════════════════════════════════════════════════════════

# ⚠ BUMPED 1 → 2 at `2026-08-21-145` cl.4: `rapid_pagination` was split into a position rule
# (`deep_page_access`) and a real rate rule (`rapid_pagination`), and `page_transitions` was added
# to the `detects` vocabulary. ⛔ A rule-set change without a version bump is a silent change to a
# committed governance artifact.
version: 2

# The audit action every fired rule emits under. ⛔ Deliberately NOT `abuse.honeypot`: reusing that
# type would corrupt the honeypot signal AND break `security-headers.spec.ts`'s exact-count
# assertion. This is a NEWLY MINTED member of the closed `AuthAuditEventType` union.
audit_action: directory.abuse_suspected

rules:
  - id: high_volume_lookups
    status: active
    description: >-
      A single visitor key issuing an implausible number of directory requests in a short window —
      the coarsest harvesting signal, and the one that fires when a scraper ignores pagination
      entirely and simply hammers the route.
    detects: request_volume
    window_seconds: 60
    threshold: 60

  - id: deep_crawl
    status: active
    description: >-
      A single visitor key touching many DISTINCT pages in one window — the signature of a
      systematic walk of the directory rather than a person reading it. Distinct-page counting is
      what separates this from high_volume_lookups: a reader refreshing page 1 forty times is noisy,
      not enumerating.
    detects: distinct_pages
    window_seconds: 300
    threshold: 25

  # ⚠ RENAMED FROM `rapid_pagination` AT `2026-08-21-145` cl.4. The old id promised a RATE and
  # measured a POSITION: `observed` was the deepest page seen, set from the very first request, so
  # following a shared link or a bookmark to `?page=45` fired it on request #1 with ZERO velocity
  # measured — and in a 10k-member Pariwar (horizon page 200) the entire second half of the
  # legitimate page range was permanently flagged. ⛔ The description said "faster than a human
  # reads"; nothing in the implementation computed a rate. The rule is kept — deep access IS a real
  # signal — but it now says what it measures, and the RATE it used to promise is `rapid_pagination`
  # below, which actually measures one.
  - id: deep_page_access
    status: active
    description: >-
      A single visitor key reaching a page number deep in the range within the window. ⚠ This is a
      POSITION signal, not a rate: it fires on a single request to a deep page, which is exactly
      what a resumed bookmark or a shared link looks like. Treat a lone hit as weak evidence — it
      is corroborating, and it is the rule most likely to produce a false positive.
    detects: page_depth
    window_seconds: 300
    threshold: 40

  - id: rapid_pagination
    status: active
    description: >-
      A single visitor key ADVANCING through pages faster than a human reads — the count of
      page-to-page TRANSITIONS within the window. ⛔ Unlike deep_page_access this cannot be tripped
      by one request, however deep: reaching page 200 directly is one transition, while walking
      1→2→…→30 is twenty-nine. This is the rule that means what the phrase "rapid pagination" says.
    detects: page_transitions
    window_seconds: 300
    threshold: 20

  - id: repeated_district_queries
    # ⛔ NO SUBJECT ON THIS SURFACE — declared, NOT silently omitted, and NOT faked into an
    # always-false "active" rule that would report green forever.
    status: no_subject_yet
    description: >-
      Repeated district-wide queries — a visitor enumerating the directory one district at a time
      to reconstruct the full roster while staying under the volume thresholds.
    detects: district_query_volume
    no_subject_reason: >-
      ⛔ THE DIRECTORY HAS NO DISTRICT FILTER TO QUERY BY. Search and filter are explicitly OUT OF
      SCOPE at Story 11a.3 (the epic AC lists "better search/filter" under acceptable directions for
      EVOLUTION, not as scope), so the route accepts only `page` and `limit` — there is no
      district-scoped request for this rule to count. ⛔ Declaring it `active` with an unreachable
      predicate would be a rule that reports green forever while detecting nothing, which is the
      exact vacuous-green defect this epic exists to remove.
    activation_trigger: >-
      The first story that ships a district (or any other) FILTER parameter on the public Member
      Directory. That story must flip this rule to `active`, choose a threshold against the real
      filter shape, and add its own planted negative control.
      ⚠⚠ ANNOTATED 2026-08-24 (Story 11b.1) — ⛔ THE REASON ABOVE IS NO LONGER TRUE OF THIS FILE'S
      WHOLE SCOPE, AND THE RULE IS DELIBERATELY LEFT `no_subject_yet` ANYWAY. Read both halves.
      ⭐ WHAT CHANGED: this file now governs TWO surfaces. Story 11b.1's `/sahyog` reuses these
      rules unchanged, and it DOES ship a district filter (plus date-range and pool-code — D2(a)).
      ⇒ the district-by-district enumeration vector this rule was reserved for is REAL NOW, on that
      surface. ⛔ The `no_subject_reason` above was written when the only consumer was `/members`,
      and it reads as a claim about the FILE while being a claim about ONE surface.
      ⭐ WHY IT IS STILL `no_subject_yet`, VERIFIED RATHER THAN ASSUMED: `evaluateDirectoryAbuse` is
      handed `{key, pariwarId, traceId, page, limit, at}` and ⛔ NOTHING ELSE — the Sahyog Drive
      handler passes no district, and `district_query_volume` yields `null` by construction
      (`abuse-rules.ts:218`). ⇒ the rule has no subject IN THE DATA IT RECEIVES, and flipping it to
      `active` today would produce exactly the always-false rule reporting green forever that this
      whole file exists to refuse. ⛔ Activating it is a REAL change — a new evaluator input, a
      threshold chosen against real filter shapes, and its own planted control — ⛔ not a status flip.
      ⚠ RECORDED OBSERVATIONALLY, ⛔ NOT FIXED HERE, and routed in `deferred-work.md` with the
      re-trigger below. ⛔ Story 11b.1 does NOT claim to have discharged it.
      ⭐ THE CORRECTED TRIGGER: a story that (i) threads the filter dimensions into
      `evaluateDirectoryAbuse`'s input and (ii) chooses a threshold per surface — ⚠ per SURFACE,
      because `/members` and `/sahyog` have different legitimate query shapes and one shared
      threshold would either miss a crawl on the busier one or flag ordinary use on the quieter.

      description: Registers the current device's FCM (Android) / APNs (iOS) push token for the authenticated admin (the Story 1.9 admin-auth consumer). Admin identity is global — the token keys on the admin-global namespace. Same idempotent upsert + app-open rebuild as the member endpoint. Requires an admin session. The token is NEVER echoed back (Tier-1 discipline).

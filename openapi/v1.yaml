  /api/v1/p/{pariwarId}/surveys:
    get:
      summary: List the Pariwar's surveys (newest-first, paginated, derived-display-state filterable)
      description: The `display_state` filter is a DERIVED state (draft | scheduled | open | expired | closed) computed from the stored status plus the valid_from/valid_until window against the server's clock — it is never a stored column. `valid_from` is inclusive and `valid_until` exclusive.

        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/telegram-opt-in/revoke:
    post:
      summary: Revoke the member’s active Telegram opt-in (independently revocable)
      description: Member-initiated revocation of an ACTIVE opt-in — disables Telegram delivery immediately, touching ONLY the telegram_opt_in consent. 409 when there is no ACTIVE opt-in. Re-opt-in requires a new bot `/start` interaction (no inferred re-consent).
      tags: *a24
      responses:
        "200":
          description: Opt-in revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeTelegramOptInResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No active opt-in to revoke
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/wa-opt-in:
    post:
      summary: Mint (or re-use) a PENDING WhatsApp opt-in → Send-Hello deep-link + verification phrase
      description: Mints a PENDING opt-in for the authenticated member with a unique verification phrase, and returns the Pariwar’s WA Business number + a wa.me Send-Hello deep-link pre-filled with that phrase. A re-tap re-uses the outstanding PENDING. 409 when the Pariwar has WA disabled / no number. The member sends the message; the inbound-webhook worker advances the opt-in to ACTIVE.
      tags: &a23
        - wa-opt-in
      responses:
        "200":
          description: PENDING opt-in minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWaOptInResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: WhatsApp unavailable for this Pariwar, or already opted in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Read the member’s current WhatsApp opt-in status
      description: Returns the member’s current opt-in state (null when never opted in) + whether the toggle is available (WA enabled + number) + the deep-link/phrase (PENDING) or window expiry (ACTIVE).
      tags: *a23
      responses:
        "200":
          description: Opt-in status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaOptInStatusResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Revoke the member’s active WhatsApp opt-in (independently revocable)
      description: Member-initiated revocation of an ACTIVE opt-in — disables WA delivery immediately, touching ONLY the whatsapp_opt_in consent. 409 when there is no ACTIVE opt-in. Re-opt-in requires a new WhatsApp message (no inferred re-consent).
      tags: *a23
      responses:
        "200":
          description: Opt-in revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeWaOptInResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No active opt-in to revoke
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/p/{pariwarId}/admin/members/{memberId}/wa-opt-out:
    post:
      summary: Trustee force opt-out of a member’s WhatsApp opt-in (admin_action)
      description: Scoped-admin force opt-out of a member’s ACTIVE WhatsApp opt-in (trustee defensibility). Gated by the existing member.moderate permission [requireAdminSession, scopeResolutionHook, requirePermissionHook(member.moderate)] — 401 no session, 403 no permission. 409 when the member has no ACTIVE opt-in.
      tags: *a23
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: memberId
          in: path
      responses:
        "200":
          description: Opt-in revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeWaOptInResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing member.moderate permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No active opt-in to revoke
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/telegram-opt-in:
    post:
      summary: Mint (or re-use) a PENDING Telegram opt-in → t.me `/start` deep-link
      description: Mints a PENDING opt-in for the authenticated member with a unique verification code, and returns a https://t.me/<bot>?start=<code> deep-link. Tapping it opens the bot and sends `/start <code>`. A re-tap re-uses the outstanding PENDING. 409 when the Pariwar has Telegram disabled / no bot. The bot `/start` is matched by the tg-webhook-processor worker, which advances the opt-in to ACTIVE.
      tags: &a24

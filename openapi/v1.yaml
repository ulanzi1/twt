openapi: 3.1.0
info:
  title: TWT API v1
  version: 0.0.0-substrate
  description: TWT API contract surface — generated from Zod schemas in packages/contracts/. Story 1.4 substrate; substantive routes land at apps/api/ Stories 1.9+.
servers:
  - url: https://twt.local/api/v1
    description: placeholder
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - timestamp
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
              pattern: \S
            message:
              type: string
            details: {}
            request_id:
              type: string
              format: uuid
          required:
            - code
            - message
            - request_id
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    BrandingBundle:
      type: object
      properties:
        logo_url:
          type: string
          format: uri
        logo_url_dark:
          type: string
          format: uri
        primary_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        secondary_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        accent_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
      required:
        - logo_url
        - primary_color
        - secondary_color
      additionalProperties: false
    PariwarPassportResponse:
      type: object
      properties:
        pariwarId:
          type: string
          format: uuid
        displayNameEn:
          type: string
          minLength: 1
        displayNameHi:
          type: string
          minLength: 1
        legalName:
          type: string
          minLength: 1
        trustRegistrationId:
          type:
            - string
            - "null"
        brandingBundle:
          type: object
          properties:
            logo_url:
              type: string
              format: uri
            logo_url_dark:
              type: string
              format: uri
            primary_color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
            secondary_color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
            accent_color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
          required:
            - logo_url
            - primary_color
            - secondary_color
          additionalProperties: false
        localeDefault:
          type: string
          enum: &a3
            - hi
            - en
        createdAt:
          type: string
          format: date-time
        createdBy:
          type:
            - string
            - "null"
          format: uuid
        updatedAt:
          type: string
          format: date-time
      required:
        - pariwarId
        - displayNameEn
        - displayNameHi
        - legalName
        - trustRegistrationId
        - brandingBundle
        - localeDefault
        - createdAt
        - createdBy
        - updatedAt
      additionalProperties: false
    ScopeDimension:
      type: string
      enum: &a1
        - global
        - pariwar
        - state
        - district
        - block
        - self
    PermissionKey:
      type: string
      pattern: ^[a-z_]+\.[a-z_]+$
    PermissionCatalog:
      type: object
      properties:
        catalogVersion:
          type: integer
          exclusiveMinimum: 0
        keys:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+\.[a-z_]+$
      required:
        - catalogVersion
        - keys
      additionalProperties: false
    RoleBundle:
      type: object
      properties:
        role:
          type: string
          enum: &a2
            - super_admin
            - pariwar_admin
            - state_trustee
            - district_admin
            - block_admin
            - finance_officer
            - it_cell
            - media_comms
            - field_worker
            - verifier
            - auditor
            - helpline_operator
        permissions:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+\.[a-z_]+$
        scopeCeiling:
          type: string
          enum: *a1
      required:
        - role
        - permissions
        - scopeCeiling
      additionalProperties: false
    RoleGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        pariwarId:
          type: string
          format: uuid
        role:
          type: string
          enum: *a2
        scopeDimension:
          type: string
          enum: *a1
        scopeValue:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type:
            - string
            - "null"
          format: uuid
      required:
        - id
        - userId
        - pariwarId
        - role
        - scopeDimension
        - scopeValue
        - createdAt
        - createdBy
      additionalProperties: false
    AuditLogEntry:
      type: object
      properties:
        auditId:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 1
        pariwarId:
          type: string
          format: uuid
        actorId:
          type:
            - string
            - "null"
          format: uuid
        actorRole:
          type:
            - string
            - "null"
          minLength: 1
        action:
          type: string
          minLength: 1
        resourceLocator:
          type: string
          minLength: 1
        requestPayloadHash:
          type: string
          minLength: 1
        responseStatus:
          type: integer
          minimum: 100
          maximum: 599
        prevAuditHash:
          type:
            - string
            - "null"
          minLength: 1
        auditHash:
          type: string
          minLength: 1
        recordedAt:
          type: string
          format: date-time
        traceId:
          type:
            - string
            - "null"
          minLength: 1
      required:
        - auditId
        - seq
        - pariwarId
        - actorId
        - actorRole
        - action
        - resourceLocator
        - requestPayloadHash
        - responseStatus
        - prevAuditHash
        - auditHash
        - recordedAt
        - traceId
      additionalProperties: false
    AuditIntegrityCheckRequest:
      type: object
      properties: {}
      additionalProperties: false
    AuditIntegrityCheckResult:
      type: object
      properties:
        checkId:
          type: string
          format: uuid
        verifiedAt:
          type: string
          format: date-time
        chainValid:
          type: boolean
        startSeq:
          type:
            - integer
            - "null"
          minimum: 1
        startAuditId:
          type:
            - string
            - "null"
          format: uuid
        endSeq:
          type:
            - integer
            - "null"
          minimum: 1
        endAuditId:
          type:
            - string
            - "null"
          format: uuid
        firstBrokenSeq:
          type:
            - integer
            - "null"
          minimum: 1
        firstBrokenAuditId:
          type:
            - string
            - "null"
          format: uuid
        rowsVerified:
          type: integer
          minimum: 0
        verifierActor:
          type: string
          minLength: 1
        triggerSource:
          type: string
          minLength: 1
      required:
        - checkId
        - verifiedAt
        - chainValid
        - startSeq
        - startAuditId
        - endSeq
        - endAuditId
        - firstBrokenSeq
        - firstBrokenAuditId
        - rowsVerified
        - verifierActor
        - triggerSource
      additionalProperties: false
    AuditIntegrityCheckListItem:
      type: object
      properties:
        checkId:
          type: string
          format: uuid
        verifiedAt:
          type: string
          format: date-time
        chainValid:

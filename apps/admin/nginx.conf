# Static-serve config for the @twt/admin SPA (Story 1.11b).
#
# SPA history-fallback: client-side routes (/login, /audit/integrity) must serve
# index.html on a hard refresh — try_files falls back to it for any unmatched path.
# The /api surface is routed to apps/api at the deployment ingress (Dokploy reverse
# proxy) so the SPA + API share an origin and the SameSite=Lax session cookie rides
# every request (see apps/admin/README.md).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the fingerprinted assets; never cache the HTML shell.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

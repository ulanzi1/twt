  /api/v1/p/{pariwarId}/member/surveys/{surveyId}/responses:
    post:
      summary: Submit the member's response (ONE per member, final)
      description: "An idempotent INSERT, not an upsert: a second submission by the same member is a 409, and submission is FINAL. A member who submitted by mistake raises a helpdesk ticket — a human path that already exists and leaves a record. A replay carrying the SAME Idempotency-Key returns the original 201. Requires a Turnstile token and is rate-limited per member. Answering a survey that is not open at the server's clock is a 409: expiry is enforced on the write path, not merely hidden from the read. Every answer is validated against the survey's own questions, and a rejection names the offending question_id."
      tags: *a72
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: surveyId
          in: path
      requestBody:
        required: true

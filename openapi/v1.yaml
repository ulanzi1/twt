      description: "Returns the authenticated member’s OWN attested contributions, newest-first, each fully resolved server-side: date, the deceased family’s first-name + last-initial (PII-shielded — the family the pool supports, NOT the nominee), pool letter code + curated name + canonical identifier, the cycle reference, the snapshotted amount, the honestly-derived four-state status (yellow attested / green confirmed / red mismatch / grey on-record; green + red are Epic 9’s producers, legitimately empty today), and whether a Contribution Note PDF is generatable yet (Story 8.7 — false today). Plus the running-tally totalInr. Member-scoped + PII-shielded — the client resolves nothing; a member who has attested nothing gets an empty passbook. Requires a member session."
      tags:

# ─────────────────────────────────────────────────────────────────────────────
# public-vs-private-matrix.yaml — the FR-74 Public-vs-Private visibility matrix
# ─────────────────────────────────────────────────────────────────────────────
#
# THE CONSUMED CONTRACT for the PII scrape CI gate. Story 1.16b shipped the gate,
# the engine, and an empty scaffold of this file; STORY 11a.1 POPULATED it.
#
# ⚠ THE HEADER THIS REPLACES SAID: "Do NOT pre-populate real surfaces here — that
# is Epic 11a's job." That job is this story. The scaffold's job is done.
#
# ── ⛔ THIS IS NOT A SCHEMA. Read this before adding anything. ────────────────
# It is tempting to read the `fields:` lists below as a data model and to "fill
# in" the member attributes a directory might show. ⛔ DO NOT. Decision
# `2026-08-19-132` R7 governs: *"the attribute set is extensible and
# Pariwar-selected, NOT a fixed global list. There is no canonical directory
# schema."* Enumerating member attributes here re-commits Significant Discovery
# SD-1, where three attribute rows had no substrate at all and no story owned
# them — unnoticed for seven epics.
#
# What this file classifies is RENDERS: each surface lists the fields it actually
# puts on a page, and what tier each may be seen at. Per-Pariwar directory
# attributes carry a RULE (`per_pariwar_attribute_rule` below), never a row.
#
# ── What populating it turned on ─────────────────────────────────────────────
# Before Story 11a.1 the gate reported `0 surface(s)` and `Render snapshots: 0`
# while SEVEN public routes shipped, and `loadSnapshots()` was literally
# `return []` — so the tier-leak leg evaluated nothing and the green check
# certified an invariant nobody was enforcing. Populating this file plus arming
# the snapshots is what gives the leg teeth. `2026-08-19-136` clause 4 makes that
# LAUNCH-BLOCKING: the leg must be operative before the Member Directory ships.
#
# ── GOVERNANCE: escalating a field's visibility ──────────────────────────────
# Raising any field toward `public` requires trustee attestation. `.github/
# CODEOWNERS` is a single solo-builder handle and trustees ratify in
# `.decision-log.md`, not on GitHub — so "multiple trustee sign-offs" is not
# mechanizable as a branch-protection rule here. The repo's own precedent
# (`scripts/governance-boundary/`) is used instead: a `.decision-log.md` entry,
# an `escalations:` entry carrying `{rationale, decision}`, and an
# `escalation_count` bump — ALL IN THE SAME COMMIT. The gate cross-checks entries
# ⇄ count in both directions, so neither half can move alone.
#
# Authority: architecture §2.7 (the matrix is the canonical tier-classification
# authority; the ruled Tier-1 exception) · §2.13 (attribute model, authority
# layering, presentation policy) · PRD FR-74 / FR-75 / FR-93 · Decisions
# `2026-08-19-132` `-133` `-135` `-136` `-137`, `2026-08-20-140`.
# Schema + parser: packages/contracts/src/public-pages/matrix.ts.
#
# ── Schema ───────────────────────────────────────────────────────────────────
#   version: <positive integer>
#   surfaces:
#     - id: <surface-slug>
#       route: /<path>                         # where it renders; joined against apps/public/src/pages/**
#       renders: true | false                  # false = declared but not yet built (exempt from route coverage)
#       search_indexing_policy: index | noindex | conditional
#       cache_policy: edge_cacheable | private_no_store | redirect   # REQUIRED (11a.2 D4)
#       paginated: true | false                # true ⇒ the page MUST call parsePageParams() (FR-91)
#       fields:
#         - id: <snake_case field id>          # must match the render model's derived id
#           tier: public | authenticated_member | operator_restricted | never_exposed
#           pii_tier: 1 | 2 | 3                # a FACT about the data; ⛔ never changed to permit a render
#           tier1_public_exception: {...}      # required iff pii_tier 1 AND tier public
#           presentation_policy_ref: <ref>     # the policy governing the rendered FORM
#   escalations: [ { surface, field, from, to, decision, rationale } ]
#   escalation_count: <int>                    # must equal len(escalations)
#   per_pariwar_attribute_rule: { default_tier, ceiling_tier, declaration_site, note }
#
# ── The 4 visibility tiers ───────────────────────────────────────────────────
#   public               — Internet-visible without auth.
#   authenticated_member — logged-in members only (Story 1.9 admin / 3.2 member auth).
#   operator_restricted  — staff/trustees/admins with RBAC scope (Story 1.8).
#   never_exposed        — never rendered on any surface (Aadhaar, bank details;
#                          Tier-1 PII per Story 1.5).
#
# ── The 4 tier-leak rules the gate enforces ──────────────────────────────────
#   never_exposed        → appears on NO surface.
#   operator_restricted  → not on member-authenticated or public renders.
#   authenticated_member → not on public renders.
#   public               → renderable everywhere.
#   (plus fail-closed: a rendered field this file does not declare is a leak.)
#
# ── ⛔ Epic 11b surfaces are DELIBERATELY NOT DECLARED ───────────────────────
# Sahyog Drive, Sahyog Vivran and In Memoriam do not render and their field sets
# do not exist. Declaring them would mean INVENTING field lists — the same defect
# as enumerating attributes, by another route. The bidirectional route-coverage
# leg is what makes the omission safe: when 11b ships a route, the gate FAILS
# until it is declared here. That is a stronger guarantee than a guessed entry.
#
# ⭐ AMENDED 2026-08-24 (Story 11b.1) — FOR SAHYOG DRIVE ONLY, AND THE NOTE ABOVE
# STAYS TRUE FOR THE OTHER TWO. Sahyog Drive shipped its route (`/sahyog`), so the
# clause that made the omission safe has now done exactly what it promised: the
# gate demanded a declaration, and the `sahyog-drive` surface below is it. Its
# field set is no longer invented — it is read off a route that exists.
# ⛔ SAHYOG VIVRAN (11b.3) AND IN MEMORIAM (11b.6) REMAIN UNDECLARED, deliberately
# and on the same reasoning: they do not render, their field sets still do not
# exist, and when they ship a route this gate will FAIL until they are declared
# too. ⛔ Do not read the Sahyog Drive entry as licensing a guessed entry for
# either of them, and ⛔ do not read it as reaching their name forms — 11b.1's
# ruling (2026-08-24-159 cl.2 / D1(b)) is scoped to this surface, and each of the
# other two must seek its own.
#
# ⭐⭐ AMENDED AGAIN 2026-09-02 (Story 11b.3) — ⛔ THE SAHYOG VIVRAN HALF OF THE NOTE
# ABOVE IS NOW FALSE, AND THE IN MEMORIAM HALF STAYS STANDING. ⛔ Annotation, ⛔ not a
# rewrite: the block above is the record of WHY the omission was safe, and the clause
# has now done exactly what it promised for a SECOND surface — 11b.3 shipped
# `/sahyog-vivran/[poolCanonicalIdentifier]`, the gate demanded a declaration, and the
# `sahyog-vivran` surface below is it. Its field set is read off a route that exists.
# ⛔ IN MEMORIAM (11b.6) REMAINS UNDECLARED on the unchanged reasoning: it does not
# render, its field set still does not exist, and the gate will FAIL until it is
# declared too.
#
# ⭐ AND THE NAME-FORM SENTENCE ABOVE IS UNCHANGED AND STILL BINDS: 11b.1's ruling is
# scoped to `sahyog-drive`. ⚠ The `sahyog-vivran` surface below declares ⛔ ZERO
# `pii_tier: 1` fields at `tier: public` — it renders ⛔ NO person's name at all — so it
# neither needs nor claims a name-form ruling. ⛔ Do ⛔ not read its presence as reaching
# a name form; **11b.3b** carries the deceased member's and the contributor's names, on
# `2026-09-02-173` / `-174`, and adds its own allowlist entries THEN.

version: 2

surfaces:
  # ── Story 2.5 — the public root ────────────────────────────────────────────
  - id: root-redirect
    route: /
    description: >-
      A 302 to /niyamavali (preserving ?lang=). Renders NO body and NO fields, so
      it has nothing to classify. ⚠ It emits no robots meta at all — it does not
      use PublicShell — so `index` here records "indexing is NOT suppressed",
      not "this page is indexed"; the redirect target's policy is what governs.
    search_indexing_policy: index
    # ⛔ NOT edge_cacheable: there is no body to cache. `/` issues a 302 to
    # /niyamavali (preserving ?lang=) and sets no Cache-Control — which is why an
    # INFERRED policy (D4(b)) would have been wrong here: every field it declares
    # is public, yet nothing about it is cacheable content.
    cache_policy: redirect
    fields: []

  # ── Story 2.5 — the Niyamavali (the institutional rulebook) ───────────────
  - id: niyamavali
    route: /niyamavali
    description: >-
      The published rulebook. Institutional content by definition — this is the
      transparency the tier model exists to SERVE: published rules, readable by
      anyone, with no member identities on the page.
    search_indexing_policy: index
    cache_policy: edge_cacheable   # public, max-age=60, s-maxage=300
    fields:
      - id: clause_id
        tier: public
        description: The stable human-readable clause handle (rendered visibly, AC2 of Story 2.5).
      - id: clause_title
        tier: public
        description: Localised clause title (Hindi-primary on this member surface).
      - id: rule_code
        tier: public
        description: The payload's rule_code display field (e.g. R7(A)).
      - id: clause_version
        tier: public
      - id: effective_date
        tier: public
      - id: benefit_mechanism
        tier: public
        description: pool | reserve — the FR-7 / FR-100 discriminator.
      - id: clause_payload_display_fields
        tier: public
        description: >-
          The generic key→value payload display block. ⚠ ONE field id for a
          DYNAMIC key set: clause payloads differ per clause and per Pariwar, so
          no committed file can enumerate them.

          Two things protect the contents, and they run in DIFFERENT PLACES.
          (1) The renderer's opaqueness — freeze row 14, display rendering and
          never rule interpretation. Unchanged and real.
          (2) Payload content is scanned for naked PII AT PUBLISH, on the
          niyamavali.amend path, before the audit line is written: a match
          rejects the publish with a typed 4xx naming the matched pattern TYPE
          only, never the value (Story 11a.4, Decision 2026-08-22-149 cl.4).

          ⛔ THE RENDER-TIME naked-PII LEG DOES NOT PROTECT THIS BLOCK, and this
          description used to imply it did. That leg runs in exactly one place —
          apps/public/tests/integration/public-pages/scrape-test.spec.ts — over
          render HTML built from IN-FILE FIXTURES, on every PR. It has never
          scanned a byte of tenant data and ⛔ does not scan what a Pariwar
          actually publishes. It proves the ENGINE works; it proves ⛔ nothing
          about the live surface.

          ⚠ And the publish scan is a BACKSTOP, ⛔ not the primary control. The
          primary control is the non-author human sign-off (reviewedBy !==
          authoredBy, content-bound by hash, audit-or-throw).

  # ── Story 2.6 — Terms & Conditions ────────────────────────────────────────
  - id: terms
    route: /terms
    description: The published T&C. Institutional content; no member data renders.
    search_indexing_policy: index
    cache_policy: edge_cacheable   # public, max-age=60, s-maxage=300
    fields:
      - id: tc_body_html
        tier: public
        description: body_html_rendered — sanitized at WRITE time, emitted raw.
      - id: tc_version
        tier: public
      - id: tc_effective_from
        tier: public
      - id: tc_pinned_clause_count
        tier: public
        description: >-
          The COUNT of pinned clause versions, ⛔ not the ids. The render model
          carries the UUIDs (a later story's handle); the public HTML emits only
          the count — a public reader gains nothing from internal UUIDs, and a
          UUID's digit runs false-positive the PII scanner.
      - id: tc_provisional_banner
        tier: public
        description: Whether the legal-review-pending banner shows (a boolean, not content).

  # ── Story 10.5 — News/Blog list ───────────────────────────────────────────
  - id: blog
    route: /blog
    description: >-
      Published, `public`-audience posts. ⛔ NO authoring metadata reaches this
      surface — Story 11a.1 narrowed the read to six explicit columns, so author
      and reviewer actor ids, the tone-signoff hash, channels and workflow status
      are not merely unrendered, they are not fetched.
    search_indexing_policy: index
    # ⚠ ADDED BY STORY 11a.2 TOGETHER WITH THE HEADER ITSELF. Until this story,
    # /blog set NO Cache-Control at all and ⛔ nothing checked — it shipped
    # uncached-and-unnoticed for a whole epic because absence read as "the default
    # is fine". The new reconciliation leg is fail-closed precisely so that
    # cannot recur.
    cache_policy: edge_cacheable   # public, max-age=60, s-maxage=300
    fields:
      - id: post_id
        tier: public
        description: Rendered as the card href (/blog/{postId}) — a rendered field, not an internal id.
      - id: title
        tier: public
      - id: title_hi
        tier: public
      - id: published_at
        tier: public

  # ── Story 10.5 — News/Blog detail ─────────────────────────────────────────
  - id: blog-post
    route: /blog/[postId]
    description: >-
      One published public post. The body renders as ESCAPED pre-wrapped text
      (Astro auto-escapes `{...}`), so authored copy can never inject markup.
      A malformed / non-public / unpublished id → a plain 404, no enumeration oracle.
    search_indexing_policy: index
    cache_policy: edge_cacheable   # public, max-age=60, s-maxage=300 (added by 11a.2)
    fields:
      - id: title
        tier: public
      - id: title_hi
        tier: public
      - id: published_at
        tier: public
      - id: body_markdown
        tier: public
      - id: body_markdown_hi
        tier: public

  # ── Story 2.5 — error surfaces (DB-independent by design, Story 0.4) ──────
  - id: not-found
    route: /404
    description: >-
      Renders NO passport and NO clauses (graceful degradation — it must render
      even when the data layer is down). Only fixed i18n strings, so no data
      fields exist to classify.
    search_indexing_policy: noindex
    cache_policy: edge_cacheable   # public, max-age=60 — a static 404 body
    fields: []

  - id: server-error
    route: /500
    description: >-
      The SSR error fallback. DB-independent (the data layer may be the very thing
      that failed) and never cached. Only fixed i18n strings.
    search_indexing_policy: noindex
    # ⛔ NEVER cached. The data layer may be the very thing that failed, so a
    # stored error page would outlive the failure it describes. ⭐ This is the
    # second surface an INFERRED policy would misclassify: all-public fields,
    # and no-store is still correct.
    cache_policy: private_no_store  # no-store
    fields: []

  # ── The Member Directory — ⭐ ROUTE SHIPPED BY STORY 11a.2, FIELDS BY 11a.3 ──
  - id: member-directory
    route: /members
    renders: true
    description: >-
      ⭐ THE TIER-LEAK LEG ON THIS SURFACE IS NOW **OPERATIVE**, AND THAT IS WHAT
      STORY 11a.3 CHANGED. ⚠ This text SUPERSEDES the 11a.2 wording that declared the
      leg "ARMED BUT EMPTY" — that statement was TRUE THEN and is ⛔ FALSE NOW, and
      leaving it would have left this file certifying the opposite of the truth about
      the flagship public surface.
      `membersSurfaceFieldIds(model)` now returns a NON-EMPTY set — `district`,
      `member_name`, `member_status` — so `evaluateSnapshot` actually evaluates the
      leak rules here, and a planted `authenticated_member`-tier or UNDECLARED field
      at `public` FAILS a run that previously passed. ⭐ That is the discharge of
      `2026-08-19-136` cl.4, which made an operative leg LAUNCH-BLOCKING for the
      Member Directory (Decision `2026-08-20-143`).
      ⭐⛔ WHAT THE PAGE RENDERS: real member rows — the presentation-resolved name,
      the raw latest-posting district, and a two-label status pill — one page at a
      time, behind the anti-enumeration safeguards `epics.md` C1 rules "load-bearing,
      not defensive". Every value goes through `<MatrixField>`, so `getVisibility()`
      is the ONLY thing deciding what appears.
      ⚠⛔ HALF THE AC'S TABLE IS NOT BUILT, AND IT IS SAID HERE RATHER THAN INFERRED:
      the `authenticated_member` column has ⛔ **NO VIEWER** and is structurally
      unbuildable (`2026-08-20-143` cl.7 — members are TOKEN-BEARER so a browser sends
      no `Authorization` header, there is no `apps/member-web/`, and `apps/mobile` has
      no directory screen). Minting one would mean a browser member session at the page
      layer, which `architecture.md:515-517` forbids. It is routed onto 11a.2's
      fragment-mechanism deferral (trigger: Epic 11b FR-77, or an `apps/member-web`
      split). ⇒ this surface implements the `public` tier, FOR REAL, and ⛔ not the
      authenticated one.
      `noindex` per FR-75 — ⛔ UNCHANGED by the full-name supersession:
      `2026-08-19-135` cl.7(c) supersedes THE NAME FORM ONLY. Forced pagination
      and noindex stand.
      ⛔ NO `school` / `designation` / `block` rows. `school` and `designation`
      are PERMANENTLY INELIGIBLE as RBAC dimensions (`-133` cl.1, `-132` cl.3 /
      `-133` cl.3) — not a deferral, the question is not available. `block` is
      gated on `2026-08-19-137` cl.7(a)+(b) (a member-aware publish path and a
      member choice surface, ⛔ neither of which exists). ⛔ And NO
      `pool_participation` / `registration_date` rows: those would be rows no
      substrate and no render backs, which is SD-1 by another route.
    search_indexing_policy: noindex
    # ⭐ RE-DECIDED AT STORY 11a.3 AND KEPT — Decision `2026-08-20-143` cl.5 (D5(a)).
    # ⚠ This replaces the standing "STORY 11a.3 MUST RE-DECIDE THIS" instruction that
    # stood here: the re-decision HAS been made, and leaving the instruction would be a
    # record asking for the same work twice.
    # THE REASON: the content is `public` tier by Panel ruling, so it is cacheable by
    # construction, and the cache absorbs scraper load on the flagship public surface.
    # ⛔ AND THE COST, RECORDED RATHER THAN DISCOVERED LATER: a cached hit NEVER REACHES
    # THE ORIGIN, so the origin-side rate limit and every `directory-abuse-rules.yaml`
    # signal see only cache MISSES. A scraper walking pages 1..N through a warm edge is
    # invisible to the detection this story ships. ⚠ Inert TODAY (no Cloudflare in this
    # repo; edge selection is contingent on DPDPA legal review, `architecture.md` §5.8a)
    # — ⛔ but it is a NAMED DEPENDENCY, written into the abuse-rules README and
    # `deferred-work.md` with an edge-configuration re-trigger. ⛔ Do not paper over it
    # by claiming the origin sees everything.
    # ⛔ REJECTED (b) `private_no_store` — discards the edge for the flagship public
    # surface. ⛔ REJECTED (c) cache page 1 only — needs a per-branch header, which
    # `detectCacheSignal`'s whole-file textual scan is structurally blind to.
    cache_policy: edge_cacheable   # public, max-age=60, s-maxage=300
    # FR-91: the page binds apps/public/src/lib/pagination.ts. The gate's
    # pagination-binding leg FAILS if this is true and the page does not call
    # parsePageParams() — ⛔ the only mechanized FR-91 enforcement on apps/public.
    paginated: true
    fields:
      - id: member_name
        tier: public
        pii_tier: 1
        tier1_public_exception:
          decision: '2026-08-19-136'
          rationale: >-
            The Trustee Panel ruled (2026-08-19-135 cl.7(c), affirmed by -136;
            mirrored at architecture §2.7) that a member's name may be DECRYPTED
            from Tier-1 (`member_kyc_profiles.name_ciphertext`) and rendered on
            the public Member Directory. ⛔ This is a decrypt at a named surface,
            NOT a reclassification: the field remains Tier-1 ciphertext plus a
            Tier-2 blind index everywhere, and no PII tier changes (-136 cl.6).
            ⛔ It is not a general relaxation of the "authenticated_member never
            renders on public" rule — that rule is untouched. The parser enforces
            the boundary.
            ⚠ ANNOTATED 2026-08-24 (Story 11b.1 / D1(b) / `2026-08-24-159` cl.2):
            that last sentence used to read "a SECOND Tier-1 `public` exception
            anywhere in this file is REJECTED". A second one is now RULED and sits
            below. ⛔ The boundary did not disappear — it CHANGED SHAPE, and in the
            stricter direction: the parser no longer counts exceptions, it NAMES
            them. Exactly two (surface, field) pairs are admitted, each citing the
            decision that authorised it; an exception on any OTHER field FAILS even
            while the count is still two. ⛔ Adding to that list is a RULING, never a
            code change — and ⛔ never the way to make a failing gate pass.
          scope: >-
            Exactly this field on exactly this surface class. ⛔ It does NOT reach
            In Memoriam or Sahyog Vivran, which keep first-name + last-initial and
            are consent-governed in a way the directory is not (epics.md C5);
            changing those requires its own Panel ruling.
            ⚠ ANNOTATED 2026-08-24 (Story 11b.1 / D10), ⛔ NOT REWRITTEN — the two
            sentences above are LEFT STANDING because they remain true of the two
            surfaces they name. What is now incomplete is the implied generalisation:
            SAHYOG DRIVE — a surface this text never named, and which sits FURTHER
            outside this fence, not nearer — renders the DECEASED member's FULL NAME
            under its own exception below, gated on the MEMBER'S OWN accepted T&C
            version pinning the post-death publication clause, in a way this
            directory field is ⛔ NOT. ⚠ ⛔ It is ⛔ NOT a per-subject consent gate:
            the family tick-box (`sahyog_drive_publication`) was DE-AUTHORISED by
            `2026-08-28-160` cl.3-5 and the box retired by `-162` (Story 11b.9).
            ⛔ IN MEMORIAM AND SAHYOG VIVRAN STILL KEEP FIRST-NAME + LAST-INITIAL and
            still need their own Panel ruling. ⛔ D10 moved ONE surface's name form
            and reached ⛔ nothing else — do not cite it for a third.
        presentation_policy_ref: pariwar_public_name_presentation.mode
        description: >-
          The FORM this renders in is CONFIGURABLE per Pariwar (`full_name` |
          `shielded_name`), resolved by `resolvePublicMemberName`. `full_name` is
          the launch posture and the default — ⛔ but it is the DEFAULT, not a
          constant: `-136` cl.1 states that a build in which the public name form
          cannot be changed without a code change FAILS that clause.
      - id: district
        tier: public
        pii_tier: 3
        description: >-
          Platform-common, derived from `member_postings` — ⛔ not a per-Pariwar
          selected attribute and not a new column. Declared here because it is
          platform-common; every OTHER directory attribute is registry data and
          carries the rule below, not a row.
      - id: member_status
        tier: public
        pii_tier: 3
        description: >-
          ⭐ FIRST CLASSIFIED AT STORY 11a.3, under Decision `2026-08-20-143` cl.3
          (D3(a)) and cl.13. The two-label public status pill — EXACTLY `active` and
          `waiting-period`, and ⛔ nothing else. `active-in-grace` PRESENTS AS `active`:
          a grace period is an internal billing state, and ⛔ publishing it would tell a
          stranger that a member is late on a payment.
          ⭐ THE WIRE TOKEN IS THE PUBLIC VOCABULARY, ⛔ NEVER THE INTERNAL ONE.
          `2026-08-21-144` cl.4 rules the internal lifecycle value `lock-in` ⛔ NON-PUBLIC
          while the label *"Waiting period"* IS public; `144` cl.8 records that this
          surface PREVIOUSLY emitted the internal word on the public JSON route, and that
          it is fixed here. ⛔ Do not reintroduce `lock-in` as a wire value.
          Derived, ⛔ never a column: it is a projection of `members.state` (already
          filtered to the ruled roster) — no `member_status` column exists, and ⛔ do
          not create one.
          ⚠ THIS ROW IS ATTESTED BY `2026-08-20-143`, ⛔ NOT BY AN ESCALATION ENTRY —
          and that is deliberate, not an omission. A FIRST-TIME classification is ⛔ NOT
          an escalation: `MatrixEscalationSchema` requires a real `from` tier and
          `superRefine` rejects one that does not outrank `to`, and there is no honest
          `from` for a field that was never classified. Inventing one to make the ledger
          accept it would be a fabrication. (The ledger's own header settles the
          principle: "Declaring a surface for the first time is NOT an escalation".)
          ⚠ ITS OPEN FINDING IS NOW RULED, ⛔ BUT THE RULEBOOK HAS NOT CAUGHT UP.
          `2026-08-20-143` cl.8 raised that publishing the waiting status, and de-listing
          a SUSPENDED member, are ⛔ described by NO Niyamavali clause. The Trustee Panel
          RULED both at `2026-08-21-144`: the waiting status is PUBLIC as a label (cl.4),
          the de-listing stands and the directory ⛔ discloses NO REASON for an omission
          (cl.5), and the Niyamavali IS AMENDED to say so (cl.1, cl.2).
          ⛔ THE AMENDMENT IS AUTHORISED, NOT YET MADE — the text is drafted and awaits
          ratification (`144` cl.7(c)), and `2026-08-20-140` cl.7 stays OPEN until the
          amended rulebook actually renders (`144` cl.7(a)). ⛔ Not a reason to drop the
          pill the epic's own disposition left unchanged.

  # ── Story 11b.1 — the public Sahyog Drive pool index (FR-77) ───────────────
  # ⭐ THE FIRST EPIC 11b SURFACE TO BE DECLARED HERE, and it is declared because it
  # SHIPPED A ROUTE — the header note's promise ("when 11b ships a route, the gate
  # FAILS until it is declared here") doing exactly what it was written to do.
  # ⛔ 11b.3 and 11b.6 stay undeclared; see that note.
  - id: sahyog-drive
    route: /sahyog
    # ⭐ DECLARED EXPLICITLY, ⛔ not left to the schema default (Review finding, 2026-08-27). AC7 and
    # Task 4 both name `renders: true` in the required key list, and the story's own test fixture
    # writes it — so the shipped YAML and the fixture disagreed on this surface's shape while
    # `matrix.ts`'s `z.boolean().default(true)` made the omission behaviourally invisible.
    # ⛔ A key an AC names is not optional just because a default happens to supply it.
    renders: true
    description: >-
      The public transparency index over POOLS — Active (`pools.current_state` =
      `closed`: the collection window has shut, the family is not yet paid) and
      Archive (`settled`: disbursed, terminal). One bounded page at a time,
      filterable by district + date range + pool code.
      ⭐ THE GRAIN IS THE POOL, ⛔ NOT THE CONTRIBUTION. The UX spec's 10-column
      contribution-level "Sahyog List" is a DIFFERENT table: 11b.2's components on
      11b.3's per-claim host (D5(a)). Three of its columns have no substrate at all
      (`Donation ID`, `HRMS`, `Member ID` — the last being an enumeration primitive
      11a.3's handler refuses in terms) and two of its labels are microcopy-
      prohibited. ⛔ Do not build it here.
      ⛔ REMEMBRANCE, NOT ANALYTICS: no contributor leaderboards, no rankings, no
      gamification, no social-performance metrics, no popularity metrics — and the
      SORT ORDER IS NOT A RANKING (close/settle instant descending with a
      deterministic tie-break; ⛔ never by contribution count, ⛔ never by amount).
    search_indexing_policy: noindex
    # Mirrors /members under FR-75, and re-decided on ITS OWN ground at D8(a).
    # ⚠ THE GROUND CHANGED AND IS RESTATED, ⛔ NOT QUIETLY PATCHED. D8(a) was first
    # argued as "the content is non-PII by construction, so it is cacheable by
    # construction". D1(b) + D10 DESTROYED that: this page shared-caches Tier-1 PII —
    # a deceased member's full legal name — behind a REVOCABLE consent. The ruling now
    # rests on the /members PRECEDENT (same class of field, same policy, re-decided at
    # 11a.3 and kept, `2026-08-20-143`).
    # ⛔ AND THE COST IS LARGER THAN THAT ORIGINAL ARGUMENT SUPPOSED: a family's
    # REVOCATION keeps being served from every warm PoP, per page number, for up to
    # FIVE MINUTES. ⛔ Direct SQL is NOT the operational fallback. Same edge-blindness
    # of the abuse counter as /members applies here unchanged.
    cache_policy: edge_cacheable   # public, max-age=60, s-maxage=300
    # FR-91: binds apps/public/src/lib/pagination.ts — parsePageParams() reused
    # UNCHANGED (page-size cap 50, deep-page horizon 200, ⛔ no silent clamp).
    paginated: true
    fields:
      - id: deceased_member_name
        tier: public
        pii_tier: 1
        tier1_public_exception:
          decision: '2026-08-24-159'
          rationale: >-
            Story 11b.1 D1(b), ruled AGAINST the authoring recommendation on a stated
            institutional-legitimacy ground: an UNNAMED beneficiary on a public
            transparency index reads as the trust diverting funds to its own account.
            Publication of the beneficiary is therefore treated as CONSTITUTIVE of the
            mutual-aid model, ⛔ not as a courtesy.
            ⭐ THE FORM IS D10's: the deceased member's FULL NAME, ⛔ not first-name +
            last-initial. Three independent grounds, and (1) and (3) each suffice alone:
            (1) a shielded name defeats D1(b)'s own verification purpose — the UX spec's
            Real Data Test shows duplicate FULL names already need a second identifier to
            disambiguate, so first-name + last-initial is useless for verification;
            (2) it is strictly MORE protective than /members, which publishes LIVING
            members' full names by default with no opt-out — ⚠ but see the scope note,
            this ground is flagged and must ⛔ not be cited for a third surface;
            (3) `shielded_name` returns '' — omit — for EVERY single-token stored name,
            and mononyms are common in India, so the shield would leave an entire class
            of deceased members unnamed with no signal.
            ⛔ THIS IS A DECRYPT AT A NAMED SURFACE, ⛔ NOT A RECLASSIFICATION: the field
            stays Tier-1 ciphertext everywhere and ⛔ no PII tier changes.
            ⚠ TAKEN WITH COUNSEL'S REVIEW OF THIS EXACT SUBJECT *HELD* (`2026-08-24-157`
            cl.3(a), returning 2026-09-07), deliberately and on the record. ⛔ BUILT IS
            ⛔ NOT PUBLISHED — Row 17's posture and the per-Pariwar switch both stand.
            ⚠ PANEL RATIFICATION OF THE NAME FORM IS *OWED* and is routed: recorded
            AUTHORISED, ⛔ NOT MADE (the `2026-08-21-144` precedent). ⛔ Do not record it
            as Panel-ratified until it is.
          scope: >-
            Exactly this field on exactly this surface. ⛔ It does NOT reach Sahyog
            Vivran (11b.3) or In Memoriam (11b.6), which keep first-name + last-initial
            and must each seek their OWN Panel ruling — and ⛔ when they do, cite grounds
            (1) and (3) above, ⛔ never (2): ground (2) reasons FROM the /members
            baseline, and the same pass that ruled D10 found that baseline non-compliant
            with Trust Deed cl.15(c) (which prevails, cl.28, and requires explicit,
            revocable, purpose-specific consent and never default opt-in). ⇒ if cl.15(c)
            is enforced, /members moves TO consent-gating — which is what THIS surface
            already does. ⭐ 11b.1 is the compliant shape and the DIRECTORY is the
            outlier, the ⛔ OPPOSITE of how ground (2) frames the pair.
            ⛔ IT ALSO DOES NOT REACH THE NOMINEE / FAMILY IDENTIFIER, which is ⛔ not
            rendered on this surface at all: a nominee never joined the Trust, so no
            membership term reaches them, Deed cl.15(c) names "nominee" expressly, and
            counsel's `-157` cl.3(b) third-party objection stands intact.
            ⛔ AND IT SETTLES NOTHING ABOUT CONTRIBUTOR OR DONOR NAME FORMS on this or
            any surface — those remain UNRULED, and `-135`/`-136` does not reach them.
        presentation_policy_ref: pariwar_public_name_presentation.mode
        description: >-
          ⭐⛔ RESOLVED THROUGH `resolvePublicMemberName(mode, storedName)`, ⛔ NEVER
          THROUGH `resolvePoolIdentity()` AND ⛔ NEVER AS A LITERAL. This is the sharpest
          build consequence of D10 and the easiest to get wrong: `resolvePoolIdentity()`
          — the resolver 8.6/8.7/8.8 share, and the obvious thing to reach for on a POOL
          surface — HARD-CODES `splitFirstNameLastInitial`, so it can ⛔ only ever return
          the form D10 rejected.
          The FORM is per-Pariwar configurable (`full_name` | `shielded_name`) and
          `full_name` is the DEFAULT, ⛔ not a constant: `-136` cl.1 states that a build
          in which the public name form cannot be changed without a code change FAILS
          that clause. A Pariwar that shields still shields, in both directions.
          ⭐⛔ THE BASIS DECIDES WHETHER A ROW IS *NAMED*, ⛔ NEVER WHETHER IT *EXISTS*.
          It renders only where the DECEASED member holds a VALID `tc_acceptance` whose
          accepted T&C version PINS the post-death publication clause — the member's own
          act, ⛔ never the family's. A MISSING acceptance, a REVOKED one, and one against
          a version that does ⛔ not pin the clause are the SAME verdict. An unnamed pool
          still renders in full: letter code, canonical identifier, district, close date,
          confirmed count and close-of-cycle framing. ⇒ the index degrades PER-POOL,
          ⛔ never per-page, and an absent basis removes a NAME, ⛔ never a DRIVE from the
          public record.
          ⚠⛔ THE BASIS MOVED, THE PROPERTIES DID ⛔ NOT (Story 11b.9). Until
          `2026-08-28-160` this read `consentExists(…, 'sahyog_drive_publication')` — the
          tick-box the FAMILY ticked at claim time. That mechanism is DE-AUTHORISED
          (cl.3-5) and the box retired by `-162`; the family has ⛔ no veto over the
          member's own name (cl.6), and its decline path is removed ON PURPOSE. ⛔ A later
          reader must ⛔ not restore it as a missing feature.
          ⚠ An unresolvable name or a failed decrypt omits the NAME, ⛔ never the ROW —
          the DELIBERATE INVERSE of /members, where a row with no name has no purpose;
          here it still carries the drive. ⛔ And the omission never announces itself:
          no placeholder, no empty span, no comment — an omission that announces itself
          is an enumeration signal.
      - id: pool_letter_code
        tier: public
        pii_tier: 3
        description: >-
          The pool's human-facing letter code (Story 7.2's dual identifier). Non-PII by
          construction — it names a COLLECTION, ⛔ never a person — and one of the three
          dimensions this surface is searchable by, precisely because it costs ⛔ no
          decrypt to filter on.
      - id: pool_canonical_identifier
        tier: public
        pii_tier: 3
        description: >-
          The pool's canonical identifier (7.2). ⛔ NOT `pools.id` and ⛔ not any member
          or claim id: the response carries ⛔ no `member_id`, ⛔ no `deceased_member_id`,
          ⛔ no `claim_id` and ⛔ no ciphertext. A per-entity permalink is an enumeration
          primitive in its own right (11a.3, control 5), so there is ⛔ no per-pool detail
          route here — a detail surface is 11b.3's.
      - id: district
        tier: public
        pii_tier: 3
        description: >-
          The raw latest-posting district string, already classified `pii_tier: 3` and
          public on /members — declared here for THIS surface because the tier-leak leg
          is per-surface and an undeclared rendered field is a leak. One of the three
          searchable dimensions (no decrypt required).
          ⚠ `school` / `block` are ⛔ NOT declared and ⛔ must not be added: `school` and
          `designation` are PERMANENTLY INELIGIBLE (`-133` cl.1, `-132` cl.3) and `block`
          is gated on `2026-08-19-137` cl.7(a)+(b) — a member-aware publish path AND a
          member choice surface, ⛔ neither of which exists.
      - id: drive_closed_at
        tier: public
        pii_tier: 3
        description: >-
          The pool's close (Active) or settle (Archive) instant — the sort key and the
          third searchable dimension. ⛔ A date about a COLLECTION, ⛔ never a date about
          a person: this is ⛔ not a date of death and ⛔ must never be sourced from one.
          Rendered in Latin numerals + Gregorian dates (operational register, UX-DR73).
      - id: drive_status
        tier: public
        pii_tier: 3
        description: >-
          Exactly `active` | `archive` — the two-label public vocabulary, derived from
          `pools.current_state` (`closed` → active, `settled` → archive). ⛔ THE WIRE
          TOKEN IS THE PUBLIC VOCABULARY, ⛔ NEVER THE INTERNAL ONE: the raw lifecycle
          value ⛔ never reaches the wire (the `member_status` / `lock-in` lesson at
          `2026-08-21-144` cl.8, which this surface is built to ⛔ not repeat).
          Derived, ⛔ never a column.
      - id: confirmed_contribution_count
        tier: public
        pii_tier: 3
        description: >-
          A COUNT of contributions confirmed as money actually received — derived ONLY
          from live `contribution.confirmed` events with their
          `reconciliation.confirmation-reversed` compensations applied (Story 9.5's
          canonical financial truth). ⛔ NEVER yellow / attested / pending / projected,
          and ⛔ never a SUM of per-event amounts.
          ⚠ A reversal is a `reconciliation.*` event, deliberately off the 8.10
          `contribution.*` fence — ⛔ do not filter reversals out by prefix.
          ⛔ It is a count, ⛔ not a score: ⛔ no ordering by it, ⛔ no "most-supported"
          view at any tier, and ⛔ no contributor identity at any grain (D9(a) binds
          11b.2/11b.3, which own contributor lists; this surface satisfies it vacuously).
      - id: close_of_cycle_framing
        tier: public
        pii_tier: 3
        description: >-
          Pool-Reality #2 framing, from `selectCloseOfCycleFraming()` — ⛔ never a locally
          authored outcome branch and ⛔ never a re-implementation.
          ⭐⛔ NO TARGET, EXPECTED-TOTAL, PERCENTAGE, SHORTFALL OR COMPARISON FIGURE
          ENTERS ANY RENDER MODEL ON THIS SURFACE, in any field, under any name.
          `classifyCycleOutcome` QUARANTINES the target by construction — totals flow in,
          only the `CycleFundingOutcome` enum flows out — so a shortfall figure physically
          cannot reach the copy path. ⛔ Do not pass a target into any render model here,
          and note the microcopy `pool-reality-comparison` tone rule bites a
          comparison-to-target frame at PR time anyway.


  # ── Story 11b.3 — the PER-CLAIM Sahyog Vivran. ⭐ ZERO Tier-1 FIELDS AT `public` ────────────
  #
  # ⭐⭐ THAT EMPTINESS IS THE SPLIT'S LOAD-BEARING PROPERTY, ⛔ NOT AN OVERSIGHT
  # (`2026-09-02-182` cl.2, D6(b)). Story 11b.3 was split three ways precisely so THIS surface
  # could be declared with ⛔ no `pii_tier: 1` field at `tier: public` — ⇒ it needs ⛔ no
  # `tier1_public_exception`, ⛔ no `RULED_TIER1_PUBLIC_EXCEPTIONS` entry and ⛔ no Panel ruling,
  # so ⛔ nothing outside this repository can block it.
  # ⚠ ⛔ IT IS ⛔ NOT A PERMANENT CEILING. **11b.3a** adds the four ruled nominee-bank pairs
  # (`2026-08-28-165` cl.1/cl.3) and **11b.3b** adds the deceased member's name + the contributor's
  # (`2026-09-02-173` / `-174`). ⭐ Each adds its entry IN THE COMMIT THAT DECLARES ITS FIELD, and
  # each owes `tests/surface-fields.test.ts`'s Tier-1-count-is-zero assertion an update in the SAME
  # commit. ⛔ Adding an allowlist entry EARLIER is a standing permission with ⛔ no subject
  # (routing note §11) — and ⛔ a masked or shielded value is STILL Tier-1 (`-165` cl.2: `pii_tier`
  # is a FACT about the data, ⛔ never changed to permit a render).
  #
  # ⭐⛔ THE VISIBLE-POOL PREDICATE IS **WIDER** THAN THE INDEX'S, DELIBERATELY (D4(b),
  # `2026-09-02-176`): `live` + `closed` + `settled`, declared explicitly on this surface and
  # ⛔ NEVER imported from `SAHYOG_DRIVE_VISIBLE_POOL_STATES` (`['closed','settled']`). Two
  # surfaces, two predicates. ⭐ The reason is ORDERING: Story 11b.3a's whole subject is the
  # ACTIVE campaign, and widening the predicate in the story that ADDS the Tier-1 bank fields
  # would have been the worse ordering.
  # ⚠ `D4-linkage` IS OPEN: a `live` drive's page has ⛔ NO INBOUND LINK today (`/sahyog` lists
  # only `closed` + `settled`), so it is reachable only by constructing the SEQUENTIAL
  # `P-YYYY-MM-###`. ⛔ Do not add a link to a `live` drive without reading that rider, and note
  # its MIRROR lands on 11b.3a, where the same sequential identifier fronts four decrypted Tier-1
  # fields (routed to 11b.3a's AC2 by name).
  - id: sahyog-vivran
    route: /sahyog-vivran/[poolCanonicalIdentifier]
    # ⭐ DECLARED EXPLICITLY, ⛔ not left to the schema default — the 11b.1 review finding:
    # *"a key an AC names is not optional just because a default happens to supply it."*
    renders: true
    description: >-
      ONE drive's own page: which pool it is, how it closed, how many contributions were
      CONFIRMED as money received, and — when the claim reached it by appeal — the
      "Reversed by appeal" lineage.
      ⭐ IT NAMES ⛔ NOBODY. ⛔ Not the deceased member, ⛔ not a contributor, ⛔ not a verifier,
      ⛔ not a nominee. A page that names nobody is the CORRECT state here (11a.5's posture when
      it deleted five invented deceased-member names), ⛔ not a broken one — the named-identity
      render layer is 11b.3b's and the nominee bank presentation is 11b.3a's.
      ⛔ AND IT RENDERS NO RUPEE FIGURE. `amountRaisedInr = confirmedCount × fixedAmount` is the
      SHIPPED canonical definition (`packages/ui/src/pool-progress/presenter.ts`, Story 9.12 D3)
      and D1(b) ruled it CONSUMED — ⛔ but behind the `@twt/ui` fence this story does not lift, so
      the amount lands at 11b.3b. ⛔ Re-deriving the multiplication here is D1(c), REFUSED.
      ⛔ REMEMBRANCE, NOT ANALYTICS — inherited from `/sahyog` unchanged: no leaderboards, no
      rankings, no gamification, no social-performance or popularity metrics.
    # ⭐ MIRRORS `/sahyog` AND `/members`, and it is the right posture for a surface fronted by a
    # SEQUENTIAL identifier: `noindex` plus the global `X-Robots-Tag` hook is control 3 of the
    # THREE this route states (D11(a)).
    search_indexing_policy: noindex
    # ⭐ DECLARED, ⛔ NEVER INFERRED FROM FIELD TIERS — a rendering surface with no `Cache-Control`
    # FAILS CI (11a.2's fail-closed leg).
    # ⚠ AND THE ACCEPTED COST IS THE SAME ONE `/sahyog` CARRIES: at `s-maxage=300` a pulled Pariwar
    # keeps being served from every warm PoP for up to five minutes, and the origin-side abuse
    # counter is EDGE-BLIND (a cached hit never reaches the origin). ⛔ Direct SQL is NOT the
    # operational fallback, and ⛔ do not "fix" the blindness by making this `private_no_store` —
    # that discards the edge for a public surface and was already REJECTED at 11a.3.
    cache_policy: edge_cacheable   # public, max-age=60, s-maxage=300
    # ⭐⭐ STATED, ⛔ NOT OMITTED, AND ⛔ NOT COPIED FROM `sahyog-drive`. This surface renders ONE
    # drive and ⛔ no list, so there is nothing to page and `parsePageParams()` is ⛔ not called.
    # ⚠⛔ IT IS A VALUE THAT MUST FLIP: **11b.3b** adds the contributor list and flips it to `true`
    # — ⛔ not a free edit, because it also changes what `routes.ts`'s written defence and the
    # `login-wall.spec.ts` allowlist entry must claim (D11(a) recorded controls 2 and 3 as
    # structurally N/A *because* there is no `page` and no `limit`).
    paginated: false
    fields:
      - id: pool_letter_code
        tier: public
        pii_tier: 3
        description: >-
          The drive's letter code (Story 7.2's dual identifier). Non-PII by construction — it
          names a COLLECTION, ⛔ never a person.
          ⚠⛔ THE CURATED REGISTRY NAME IS DELIBERATELY NOT RESOLVED, mirroring `/sahyog`:
          `resolveCuratedPoolName` re-derives it via `reserveNames`, which RESERVES rows — ⛔ a
          write path an unauthenticated public GET may not trigger. TWT-Bihar's registry is EMPTY
          BY DESIGN, so the letter code is the committed launch behaviour.
      - id: pool_canonical_identifier
        tier: public
        pii_tier: 3
        description: >-
          `P-YYYY-MM-###` (Story 7.2) — and on THIS surface it is also the ROUTE PARAMETER.
          ⛔ NOT `pools.id`, ⛔ not `claim_case_id`, ⛔ not `deceased_member_id`: the response
          carries ⛔ no member, claim or pool uuid and ⛔ no ciphertext.
          ⚠⛔ IT IS SEQUENTIAL AND THEREFORE ENUMERABLE, and that is recorded rather than glossed:
          `D4-linkage` is OPEN, D11(a) left `limits.search` the only (unstated) bound on walking it,
          and 11b.3a puts four decrypted Tier-1 fields behind this same identifier. ⛔ Routed to
          11b.3a's AC2 by name — ⛔ not left as a shared worry.
      - id: drive_status
        tier: public
        pii_tier: 3
        description: >-
          Exactly `collecting` | `active` | `archive` — ⭐ THREE labels here, ⛔ not the index's
          two, because D4(b) admits `live`. Derived from `pools.current_state`
          (`live` → collecting, `closed` → active, `settled` → archive).
          ⛔ THE WIRE TOKEN IS THE PUBLIC VOCABULARY, ⛔ NEVER THE INTERNAL ONE: `spawned`, `live`,
          `closed` and `settled` must never cross this boundary (`2026-08-21-144` cl.8 — the
          `lock-in` leak `/members` had). Derived, ⛔ never a column.
      - id: drive_closed_at
        tier: public
        pii_tier: 3
        description: >-
          The drive's close (active) or settle (archive) instant, from the `pool.closed` /
          `pool.settled` event stream — AC3's settlement-state source. `null` while the drive is
          still collecting, and the page renders NOTHING for it rather than estimating.
          ⛔ A date about a COLLECTION, ⛔ never a date about a person: this is ⛔ not a date of
          death and must ⛔ never be sourced from one. Latin numerals + Gregorian dates (UX-DR73).
      - id: district
        tier: public
        pii_tier: 3
        description: >-
          The deceased member's latest posting district, RAW — already `pii_tier: 3` and public on
          `/members` and `/sahyog`, declared here because the tier-leak leg is PER-SURFACE and an
          undeclared rendered field is a leak.
          ⚠ `school` / `designation` are PERMANENTLY INELIGIBLE (`-133` cl.1, `-132` cl.3) and
          `block` is gated on `2026-08-19-137` cl.7(a)+(b). ⛔ Do not add them.
      - id: confirmed_contribution_count
        tier: public
        pii_tier: 3
        description: >-
          A COUNT of contributions confirmed as money actually received — from live
          `contribution.confirmed` events with their `reconciliation.confirmation-reversed`
          compensations applied (Story 9.5's canonical financial truth), and ⛔ NOTHING ELSE.
          ⛔ NEVER yellow / attested / pending / projected / estimated, and ⛔ never a SUM.
          ⚠ A reversal is a `reconciliation.*` event, deliberately off the 8.10 `contribution.*`
          fence — ⛔ do not filter reversals out by prefix.
          ⭐⛔ IT IS THE **EVENT** COUNT, ⛔ NEVER A ROW COUNT, AND THE TWO ARE DESIGNED TO
          DISAGREE: an RTBF invocation removes a contributor from any rendered list ENTIRELY
          (⛔ no anonymized row, ⛔ no marker, ⛔ no placeholder) while the omitted contributor
          STILL COUNTS toward every confirmed aggregate (`2026-08-30-169`). ⇒ ⛔ never derive this
          from the length of a contributor list — here or at 11b.3b, where the page will read
          "N confirmed" beside FEWER than N named rows BY DESIGN.
          ⛔ It is a count, ⛔ not a score: ⛔ no ordering by it and ⛔ no "most-supported" view.
      - id: close_of_cycle_framing
        tier: public
        pii_tier: 3
        description: >-
          Pool-Reality #2 framing, from `classifyCycleOutcome` + `selectCloseOfCycleFraming` —
          ⛔ never a locally authored outcome branch and ⛔ never a re-implementation (the
          classifier is SHARED with the Panchayat Noticeboard and `/sahyog`, and its union's
          ordering is provenance-stable).
          ⭐⛔ NO TARGET, EXPECTED-TOTAL, PERCENTAGE, SHORTFALL OR COMPARISON FIGURE ENTERS ANY
          RENDER MODEL ON THIS SURFACE, in any field, under any name. The classifier QUARANTINES
          the target by construction — totals flow in, only the opaque enum flows out.
          ⚠ `null` in TWO cases, and the page then says NOTHING: (a) the drive is still
          COLLECTING, so there is no close to frame; (b) ZERO members were assigned, so ⛔ no
          expectation was ever set — `0 >= 0` is VACUOUSLY TRUE and returned `fully_funded` for a
          drive that collected nothing (the 11b.1 review finding). ⛔ `partial` was considered and
          REJECTED: *"Reconciliation is still in progress"* is not true of a drive nobody was
          assigned to.
      - id: appeal_reversal_stage
        tier: public
        pii_tier: 3
        description: >-
          `1` | `2` | `3` — which appeal stage reversed a previously-denied claim, from Story
          6.16's `claim.reversed` payload. ⭐ DERIVED AT REQUEST TIME (D12(a), `2026-09-02-176`):
          ⛔ no queue, ⛔ no consumer, ⛔ no publication record — this surface holds ⛔ no
          publication STATE for a queue to advance, so a queue here would be a consumer with no
          effect. `null` when the claim was never reversed, and the whole lineage then renders
          NOTHING.
          ⛔ NON-PII BY CONSTRUCTION and ⛔ never widened: `claim.reversed` is the PUBLISH SIGNAL,
          ⛔ not the decision. The rationale TEXT and the REVIEWER IDENTITY live on the
          `claim.appeal_stageN_reviewed` decision event's Tier-1 metadata row and are ⛔ NEVER
          public.
      - id: appeal_disposition_category
        tier: public
        pii_tier: 3
        description: >-
          The BOUNDED, NON-PII disposition tag from `claim.reversed` —
          `new_evidence_presented` | `procedural_correction` | `reconsideration_on_merits`.
          ⛔ NEVER free text, ⛔ never rationale, ⛔ never a reviewer's name or role.
      - id: appeal_reversal_at
        tier: public
        pii_tier: 3
        description: >-
          The reversal instant, from the `claim.reversed` event's own `occurred_at`. Completes
          AC5's visible lineage — deny → appeal stage → reversal. `null` when there was no
          reversal. Latin numerals + Gregorian dates (UX-DR73).

# ── The escalation ledger (AC8) ──────────────────────────────────────────────
# One entry per visibility ESCALATION (a field moving toward `public`), each
# naming the `.decision-log.md` entry that authorised it. `escalation_count` must
# equal the entry total — the gate checks both directions, and the parser also
# rejects an entry naming a surface or field this file does not declare.
#
# ⚠ Declaring a surface for the first time is NOT an escalation — the seven
# already-shipping routes above are classifications of what they already render,
# and recording them here would inflate the ledger with entries that prove
# nothing. The ONE entry below is a real escalation: the Panel moved the public
# name form, and this is the record of it.
escalations:
  - surface: member-directory
    field: member_name
    from: authenticated_member
    to: public
    decision: '2026-08-19-136'
    rationale: >-
      The Trustee Panel ruled that members' full legal names are published on the
      unauthenticated Member Directory, superseding the first-name + last-initial
      form. ⚠ CARRIED WITH ITS OPEN FINDINGS, ⛔ not as a settled matter:
      (a) `-136` cl.5 records DPDPA exposure taken while legal counsel had NOT
      REVIEWED this publication — ⚠ CORRECTED 2026-08-24 (`2026-08-24-158`), and
      the correction is to the REASON, ⛔ never to the finding: this rationale used
      to say counsel was "NOT engaged", which is ⛔ FALSE and has been since
      2026-06-21 (Adv. Mohit Agrawal). ⭐ The DPDPA exposure it records is ⛔ STILL
      OPEN — counsel's review of the public surfaces is HELD (`2026-08-24-157`
      cl.3), returning 2026-09-07 — so ⛔ nothing here is discharged by the
      correction. ⚠ This file is a LIVE machine-read governance artifact asserting
      the PRESENT tense, which is why it is corrected in place while the historical
      decision-log entries correctly keep their original wording; and
      (b) Decision `2026-08-20-140` cl.7 found that the Niyamavali — the
      member-facing rulebook — does not record this publication anywhere, so a
      member reading it cannot learn that their full legal name will be public.
      That finding is raised for the Panel and is NOT closed by this entry.
escalation_count: 1

# ── Per-Pariwar directory attributes: a RULE, ⛔ never a list (AC6) ──────────
per_pariwar_attribute_rule:
  default_tier: operator_restricted
  ceiling_tier: public
  declaration_site: >-
    Registry DATA — `pariwar_custom_field_definitions` rows, per Pariwar. ⛔ NOT
    this file, and ⛔ not any committed file. CI cannot read tenant database rows
    and must not be widened to: "a CI gate that needed a live tenant database
    would not be a CI gate" (scripts/custom-field-governance/README.md).
  note: >-
    A Pariwar-selected directory attribute defaults to `operator_restricted` —
    fail-closed, so an attribute nobody has classified is not visible to members
    or to the internet. `public` is the CEILING it may reach, never a default,
    and reaching it is a governed act requiring an escalation entry above.
    THE THREE-LAYER AUTHORITY MODEL (architecture §2.13.2), which the tier alone
    does not express: CREATE (Super Admin / Trustee Panel only) → ENABLE
    (per-Pariwar scope, governed authority) → GRANT (Trustee, over a named node).
    ⛔ NO LAYER IMPLIES THE NEXT. An attribute that exists is not thereby enabled;
    one that is enabled is not thereby granted over any node.
    Directory attributes are DISPLAY-ONLY by default, enforced by signature
    (§2.13.2) — ⛔ a matrix value must never reach an eligibility path.

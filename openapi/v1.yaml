openapi: 3.1.0
info:
  title: TWT API v1
  version: 0.0.0-substrate
  description: TWT API contract surface — generated from Zod schemas in packages/contracts/. Story 1.4 substrate; substantive routes land at apps/api/ Stories 1.9+.
servers:
  - url: https://twt.local/api/v1
    description: placeholder
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - timestamp
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
              pattern: \S
            message:
              type: string
            details: {}
            request_id:
              type: string
              format: uuid
          required:
            - code
            - message
            - request_id
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    BrandingBundle:
      type: object
      properties:
        logo_url:
          type: string
          format: uri
        logo_url_dark:
          type: string
          format: uri
        primary_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        secondary_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        accent_color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
      required:
        - logo_url
        - primary_color
        - secondary_color
      additionalProperties: false
    PariwarPassportResponse:
      type: object
      properties:
        pariwarId:
          type: string
          format: uuid
        displayNameEn:
          type: string
          minLength: 1
        displayNameHi:
          type: string
          minLength: 1
        legalName:
          type: string
          minLength: 1
        trustRegistrationId:
          type:
            - string
            - "null"
        brandingBundle:
          type: object
          properties:
            logo_url:
              type: string
              format: uri
            logo_url_dark:
              type: string
              format: uri
            primary_color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
            secondary_color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
            accent_color:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
          required:
            - logo_url
            - primary_color
            - secondary_color
          additionalProperties: false
        localeDefault:
          type: string
          enum:
            - hi
            - en
        createdAt:
          type: string
          format: date-time
        createdBy:
          type:
            - string
            - "null"
          format: uuid
        updatedAt:
          type: string
          format: date-time
      required:
        - pariwarId
        - displayNameEn
        - displayNameHi
        - legalName
        - trustRegistrationId
        - brandingBundle
        - localeDefault
        - createdAt
        - createdBy
        - updatedAt
      additionalProperties: false
    ScopeDimension:
      type: string
      enum: &a1
        - global
        - pariwar
        - state
        - district
        - block
        - self
    PermissionKey:
      type: string
      pattern: ^[a-z_]+\.[a-z_]+$
    PermissionCatalog:
      type: object
      properties:
        catalogVersion:
          type: integer
          exclusiveMinimum: 0
        keys:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+\.[a-z_]+$
      required:
        - catalogVersion
        - keys
      additionalProperties: false
    RoleBundle:
      type: object
      properties:
        role:
          type: string
          enum: &a2
            - super_admin
            - pariwar_admin
            - state_trustee
            - district_admin
            - block_admin
            - finance_officer
            - it_cell
            - media_comms
            - field_worker
            - verifier
            - auditor
            - helpline_operator
        permissions:
          type: array
          items:
            type: string
            pattern: ^[a-z_]+\.[a-z_]+$
        scopeCeiling:
          type: string
          enum: *a1
      required:
        - role
        - permissions
        - scopeCeiling
      additionalProperties: false
    RoleGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        pariwarId:
          type: string
          format: uuid
        role:
          type: string
          enum: *a2
        scopeDimension:
          type: string
          enum: *a1
        scopeValue:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type:
            - string
            - "null"
          format: uuid
      required:
        - id
        - userId
        - pariwarId
        - role
        - scopeDimension
        - scopeValue
        - createdAt
        - createdBy
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 512
        turnstileToken:
          type: string
      required:
        - email
        - password
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - mfa_required
        methods:
          type: array
          items:
            type: string
            enum:
              - webauthn
              - recovery_code
      required:
        - status
        - methods
      additionalProperties: false
    PasskeyRegisterOptionsRequest:
      type: object
      properties:
        enrollmentToken:
          type: string
        deviceLabel:
          type: string
          maxLength: 64
      additionalProperties: false
    PasskeyRegisterVerifyRequest:
      type: object
      properties:
        response:
          type: object
          additionalProperties: {}
        enrollmentToken:
          type: string
        deviceLabel:
          type: string
          maxLength: 64
      required:
        - response
      additionalProperties: false
    PasskeyRegisterVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
        recoveryCodes:
          type: array
          items:
            type: string
      required:
        - verified
      additionalProperties: false
    PasskeyAuthOptionsRequest:
      type: object
      properties: {}
      additionalProperties: false
    PasskeyAuthVerifyRequest:
      type: object
      properties:
        response:
          type: object
          additionalProperties: {}
      required:
        - response
      additionalProperties: false
    PasskeyAuthVerifyResponse:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
      additionalProperties: false
    RecoveryConsumeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - code
      additionalProperties: false
    RecoveryConsumeResponse:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
      additionalProperties: false
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        turnstileToken:
          type: string
      required:
        - email
      additionalProperties: false
    PasswordResetRequestResponse:
      type: object
      properties:
        sent:
          type: boolean
          enum:
            - true
      required:
        - sent
      additionalProperties: false
    PasswordResetConsumeRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 12
          maxLength: 512
      required:
        - token
        - newPassword
      additionalProperties: false
    PasswordResetConsumeResponse:
      type: object
      properties:
        reset:
          type: boolean
          enum:
            - true
        webauthnReenrollmentRequired:
          type: boolean
          enum:
            - true
      required:
        - reset
        - webauthnReenrollmentRequired
      additionalProperties: false
    StepUpRequestRequest:
      type: object
      properties:
        actionContext:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - actionContext
      additionalProperties: false
    StepUpRequestResponse:
      type: object
      properties:
        sent:
          type: boolean
          enum:
            - true
        expiresInSeconds:
          type: integer
          exclusiveMinimum: 0
      required:
        - sent
        - expiresInSeconds
      additionalProperties: false
    StepUpVerifyRequest:
      type: object
      properties:
        otp:
          type: string
          minLength: 1
          maxLength: 16
      required:
        - otp
      additionalProperties: false
    StepUpVerifyResponse:
      type: object
      properties:
        elevated:
          type: boolean
          enum:
            - true
        elevatedUntil:
          type: string
          format: date-time
      required:
        - elevated
        - elevatedUntil
      additionalProperties: false
  parameters: {}
paths:
  /api/v1/_meta/health:
    get:
      summary: Service health probe
      description: Substrate-proof endpoint authored at Story 1.4. Production /_meta/health lives at apps/api/ per Story 1.9+.
      tags:
        - _meta
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      summary: Admin login — first factor (email + password)
      tags:
        - admin-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/passkey/register/options:
    post:
      summary: WebAuthn enrollment — generate registration options
      tags:
        - admin-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterOptionsRequest"
      responses:
        "200":
          description: WebAuthn PublicKeyCredentialCreationOptionsJSON (provider-controlled)
        "403":
          description: Enrollment not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Device cap reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/passkey/register/verify:
    post:
      summary: WebAuthn enrollment — verify + persist the credential
      tags:
        - admin-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegisterVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegisterVerifyResponse"
        "403":
          description: Enrollment denied/failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/passkey/authenticate/options:
    post:
      summary: WebAuthn second factor — generate authentication options
      tags:
        - admin-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthOptionsRequest"
      responses:
        "200":
          description: WebAuthn PublicKeyCredentialRequestOptionsJSON (provider-controlled)
        "401":
          description: No login in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/passkey/authenticate/verify:
    post:
      summary: WebAuthn second factor — verify the assertion
      tags:
        - admin-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyAuthVerifyResponse"
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/recovery/consume:
    post:
      summary: Recovery code second factor — consume + burn
      tags:
        - admin-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryConsumeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryConsumeResponse"
        "401":
          description: Invalid recovery code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password-reset/request:
    post:
      summary: Request a password-reset link (anti-enumeration)
      tags:
        - admin-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
  /api/v1/auth/password-reset/consume:
    post:
      summary: Consume a password-reset link (forces WebAuthn re-enrollment)
      tags:
        - admin-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConsumeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetConsumeResponse"
        "403":
          description: Invalid or expired link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/step-up/request:
    post:
      summary: Request a step-up OTP for a gated action
      tags:
        - admin-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpRequestRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepUpRequestResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/step-up/verify:
    post:
      summary: Verify a step-up OTP — elevate the session
      tags:
        - admin-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepUpVerifyResponse"
        "401":
          description: Step-up verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
webhooks: {}

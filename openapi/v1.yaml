  /api/v1/member/terms/accept:
    post:
      summary: Signup T&C — accept the current effective T&C (records a tc_acceptance consent)
      description: Records a tc_acceptance consent_records entry (consent_artifact_ref = the resolved tcVersionId, granted_via_actor = member_self) via the audit-or-throw chain (write the audit line FIRST, thread its id into recordConsent, all inside one member scope-tx; a compensating audit line is emitted on rollback). The effective version is resolved SERVER-SIDE (the client tcVersionId is an advisory staleness signal); if no effective T&C is resolvable the accept fails atomically (409, no orphan consent/audit). Requires a member session.
      tags: *a28
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberTermsAcceptRequest"
      responses:
        "200":
          description: T&C accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberTermsAcceptResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Member not found / terminal, or no effective T&C is resolvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/vyawastha-shulk/intent:
    post:
      summary: Signup fee — build the ₹110 Vyawastha Shulk UPI Intent URL
      description: Returns a SERVER-constructed UPI Intent URL (upi://pay?pa={trust VPA}&am={110}&cu=INR&tn=signup-shulk-{memberId}&tr=signup-{memberId}-{nonce}) — the VPA + amount are resolved server-side from config (never client-supplied). Echoes the `tr` idempotency nonce for the confirm step. 503 when the trust VPA is unconfigured (a server gap). Requires a member session.
      tags: &a29
        - member-vyawastha-shulk
      responses:
        "200":
          description: UPI Intent URL + tr
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VyawasthaShulkIntentResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The trust VPA is not configured (vyawastha_shulk.unconfigured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/vyawastha-shulk/confirm:
    post:
      summary: Signup fee — self-attest the UTR → persist the receipt + the GATED lock-in transition
      description: Persists a vyawastha_shulk_receipts row ALWAYS (AR-67 indefinite retention; idempotent on the `tr` — a re-confirm returns the existing receipt without a second insert or re-emit). Captures the optional 6-digit Reference Code (D2 port seam — stored, NOT validated). Then evaluates the 5-condition lock-in gate (KYC + nominees + medical + T&C + the receipt); emits member.vyawastha_shulk_paid (pending-fee → lock-in) + member.lock_in_entered (with the FR-8 lock_in_days_at_join snapshot) ONLY when all five hold — otherwise the receipt persists, no event fires, and `outstanding` names the incomplete step(s). 503 lock_in.policy_unavailable when the gate passes but niy.lock-in.policy is unprovisioned (receipt kept; idempotent re-confirm completes once provisioned). Requires a member session.
      tags: *a29
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VyawasthaShulkConfirmRequest"
      responses:
        "200":
          description: Receipt persisted (lock-in entered, or outstanding steps listed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VyawasthaShulkConfirmResponse"
        "400":
          description: Validation failed (bad UTR format or Reference Code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Member not found / terminal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The lock-in policy is not provisioned for this Pariwar (lock_in.policy_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/vyawastha-shulk/status:
    get:
      summary: Signup fee — the member’s paid / lock-in status
      description: Returns whether the member has paid (a receipt exists), the latest receipt’s validThrough, whether lock-in has been entered, and any still-outstanding pre-payment steps. Requires a member session.
      tags: *a29
      responses:
        "200":
          description: Paid / lock-in status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VyawasthaShulkStatusResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/vyawastha-shulk/renewal-status:
    get:
      summary: Renewal — the canonical FR-12A vyawastha_shulk_status payload
      description: "Returns the renewal/validity status Epic 4’s Validity Service (FR-12A) consumes: paid_through (latest receipt valid_through), days_until_lapse (ceil-clamped days to the valid_through + 91d grace-end/lapse boundary), in_renewal_grace (true iff the member’s state is active-in-grace), and grace_remaining_days. Computed live per request → within the ≤60s freshness invariant. Requires a member session."
      tags: *a29
      responses:
        "200":
          description: Renewal/validity status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VyawasthaShulkRenewalStatusResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/vyawastha-shulk/renew/intent:
    post:
      summary: Renewal — build the annual ₹ Vyawastha Shulk UPI Intent URL
      description: Identical to the signup intent (server-authoritative VPA + amount from config; `tr` idempotency nonce) but with a renewal `tn` grammar (renewal-shulk-{memberId}-{year}). Requires a member session. 503 when the trust VPA is unconfigured.
      tags: *a29
      responses:
        "200":
          description: UPI Intent URL + tr
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VyawasthaShulkIntentResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The trust VPA is not configured (vyawastha_shulk.unconfigured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/vyawastha-shulk/renew/confirm:
    post:
      summary: Renewal — self-attest the UTR → persist the receipt + emit the renewal event
      description: "Persists a vyawastha_shulk_receipts row (server-stamped valid_through = now + 365d; idempotent on the `tr`) and emits member.vyawastha_shulk_paid (kind: renewal) in the same scope-tx. A renewing member is already post-lock-in, so there is NO lock-in gate and renewal NEVER re-applies lock-in (the reducer routes active-in-grace/lapsed-unpaid → active, and is identity from active). 409 when the member is in a terminal/pre-active state (renewal requires a post-lock-in member). Requires a member session."
      tags: *a29
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VyawasthaShulkConfirmRequest"
      responses:
        "200":
          description: Receipt persisted + renewal event emitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VyawasthaShulkRenewalConfirmResponse"
        "400":
          description: Validation failed (bad UTR format)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Member not found / not in a renewable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
webhooks: {}

          type: string
        deviceLabel:
          type: string
          maxLength: 64
      additionalProperties: false
    PasskeyRegisterVerifyRequest:
      type: object
      properties:
        response:
          type: object
          additionalProperties: {}
        enrollmentToken:
          type: string
        deviceLabel:
          type: string
          maxLength: 64
      required:
        - response
      additionalProperties: false
    PasskeyRegisterVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
        recoveryCodes:
          type: array
          items:
            type: string
            minLength: 1
      required:

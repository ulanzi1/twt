              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/device-tokens:
    post:
      summary: Register the member device push token (FCM/APNs) on app open
      description: Registers the current device's FCM (Android) / APNs (iOS) push token for the authenticated member (the Story 3.2 app-open consumer). The token is Tier-1-encrypted at rest + blind-indexed; the upsert is idempotent and marks the member’s OTHER same-platform tokens stale (app-open rebuild). Requires a member session. The token is NEVER echoed back (Tier-1 discipline).
      tags: &a22

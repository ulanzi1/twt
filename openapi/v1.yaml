  /api/v1/p/{pariwarId}/member-data-rights/delivery/member-direct:
    post:
      summary: PRIMARY delivery — issue a one-time OTP grant to the member (AC-R1)
      description: "The ruled primary route (Decision 2026-08-14-109 clause 1): a one-time grant the MEMBER redeems themselves with a code sent to their registered mobile. No session is ever issued. Refuses when the member has no registered mobile on file (409 member_data_rights.no_mobile_on_file). Requires an admin session, the `member.data_rights` permission (pariwar dimension) and a fresh `member_data_rights` step-up elevation. `Idempotency-Key` is REQUIRED: a replay of the same key is refused with a typed 409 rather than silently re-executed."

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Edit a survey (a published survey may only have its valid_until EXTENDED)
      description: "On a DRAFT every field applies, re-validated. On a PUBLISHED survey the questionnaire, the response_threshold, the audience and the copy are FROZEN — a request touching any of them is a 409 naming the frozen field. The reason is that a response is an answer TO A QUESTION: change the question and every stored answer silently becomes an answer to something nobody asked. To ask something different, close this survey and publish a new one. The ONLY permitted post-publish mutation is EXTENDING valid_until; a shortening is a 422 pointing at `close`, which is the transition that exists for stopping collection. A closed survey is terminal and rejects every edit (409)."

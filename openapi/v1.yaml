    post:
      summary: File an appeal against a moderation act (member, in-portal)
      description: "The MEMBER's own act under Niyamavali §8.8. Member-session gated; Turnstile (`x-turnstile-token`) and `Idempotency-Key` ride HEADERS, not the body. The member is the SESSION — there is no `member_id` field, deliberately. Appealable from suspension OR termination, with NO deadline (§8.8: \"no time limit runs against a member's right to appeal\"). Only ONE appeal against a given moderation act may be open at a time, but the right is NOT exhausted: once an appeal is determined a further appeal against the same act may be filed. Filing has NO SUSPENSIVE EFFECT — a suspended member remains suspended and a terminated member's access does not return. The grounds are stored Tier-1 encrypted and never appear on this response, on any event payload, or on any audit line."

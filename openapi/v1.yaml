      description: Admin-session-gated + `helpdesk.respond` (pariwar-dimension). The Pariwar's tickets newest-first, filterable by lifecycle state + routed-to role ("my queue"), paginated (clampLimit-bounded). Each row carries the two derived SLA timers (running/breached/ms_remaining), the derived severity (breached ≻ due_soon ≻ on_track), and the cross-link ref presence.

            - "null"
          minimum: 1
        startAuditId:
          type:
            - string
            - "null"
          format: uuid
        endSeq:
          type:
            - integer
            - "null"
          minimum: 1
        endAuditId:
          type:
            - string
            - "null"
          format: uuid
        firstBrokenSeq:
          type:
            - integer
            - "null"
          minimum: 1
        firstBrokenAuditId:
          type:
            - string
            - "null"
          format: uuid
        rowsVerified:
          type: integer
          minimum: 0
        verifierActor:
          type: string
          minLength: 1
        triggerSource:
          type: string
          minLength: 1
        acknowledgement:

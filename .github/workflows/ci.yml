name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  push:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [install, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

  db-check:
    name: db-check
    runs-on: ubuntu-latest
    needs: install
    # Pure static analysis over packages/domain/src/schema/*.ts +
    # packages/domain/migrations/meta/*.json. No DB connection required.
    # Story 1.2 commits the integrity primitive; Story 1.16c commits the
    # substantive v1-baseline forbidden-pattern asserts.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run db:check

  contracts-check:
    name: contracts-check (OpenAPI generator determinism)
    runs-on: ubuntu-latest
    needs: install
    # Pure static analysis: re-emit openapi/v1.yaml from packages/contracts/
    # Zod schemas and assert byte-identical to the committed file. Architecture
    # §3.2 line 1862-1865 generator-determinism CI gate. No DB / network.
    # Story 1.4 commits the integrity primitive on a substrate-proof toy
    # endpoint; substantive endpoints land at apps/api/ Stories 1.9+. The
    # OpenAPI breaking-change semantic-diff CI gate (architecture §3.2 line
    # 1856-1860) is deferred to Story 1.9+ when route surfaces substantively
    # populate (deferred-work D1-1.4).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run contracts:check-openapi-determinism

  crypto-check:
    name: crypto-check (encryption substrate)
    runs-on: ubuntu-latest
    needs: install
    # Encryption substrate unit tests for @twt/domain/src/encryption: Tier-1
    # envelope round-trip + AAD binding; Tier-2 blind-index determinism +
    # cross-Pariwar separation; fake-KMS provider correctness. No DB; no live
    # KMS; KMS_TEST_MODE=fake. Architecture §2.7 + AR-12 + AR-13. Story 1.5
    # commits the substrate; live Cloud KMS provisioning + integration-test
    # live-DB substrate deferred per D1-1.5 + D2-1.3 (Story 1.6).
    env:
      KMS_TEST_MODE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run crypto:check

  pii-scrape:
    name: pii-scrape (FR-74 Public-vs-Private matrix gate)
    runs-on: ubuntu-latest
    needs: install
    # FR-74 PII scrape gate (Story 1.16b): consumes the Public-vs-Private
    # visibility matrix (packages/contracts/public-pages/public-vs-private-matrix.yaml)
    # and runs the 4 tier-leak rules + naked-PII detector against available render
    # snapshots. Architecture §2.7 L1522-1524 + Principle #7 + the planned ci.yml
    # "scrape-test" step (architecture L4159); deferred-work D8-1.5 routes the gate
    # here. A packages/contracts/ turbo task (config is a contracts artifact, NO
    # git-diff) — NOT a repo-root script, and NO fetch-depth: 0 (unlike
    # friction-budget, this gate validates the current matrix + current renders; it
    # does not diff against a PR base ref). Green by construction at v1: the matrix
    # is an empty scaffold and no public render exists yet (apps/public is a tsc stub
    # until Story 2.5; apps/api/src/modules/public-pages empty until Epic 11b), so
    # every surface is a no-op; teeth grow surface-by-surface as Epic 11a populates
    # the matrix and Story 2.5/11a.2 render public surfaces (data-driven, no code
    # change). The engine's unit tests ride the `test` job (contracts is a workspace).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run contracts:check-pii-scrape

  friction-budget:
    name: friction-budget (UX-DR3 friction-as-budget gate)
    runs-on: ubuntu-latest
    needs: install
    # Repo-global friction-budget gate (Story 1.16a): friction-budget.yaml metric
    # ceilings (bundle bytes + page-weight, baseline-of-record) + friction-budget.md
    # named-payer declaration ledger. Architecture Principle #8 (line 294) + §4.11.1
    # (lines 2785-2799) + UX Stance #2 / AR-60 / UX-DR3. Repo-global (root config +
    # cross-app build scan + PR git-diff) → a repo-root tsx script, not a per-package
    # turbo task. fetch-depth: 0 because the declaration facet diffs against the PR
    # base ref (GITHUB_BASE_REF) — every other job uses the default shallow clone;
    # this one can't. Green by construction at v1 (seed ledger + no-op-on-absent-
    # build-output); grows teeth surface-by-surface as member build outputs land
    # (Epic 2 public Astro, later member web/native bundles). Live critical-render-
    # path timing on the canonical 3GB-Android device is explicitly deferred (AC-6).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm friction:test
      - run: pnpm friction:check

  integration-tests:
    name: integration-tests (RLS + multi-tenant + events_log)
    runs-on: ubuntu-latest
    needs: install
    # Live-DB integration tests: events_log RLS policy regression +
    # cross-Pariwar adversarial leak test (Story 1.6) + events_log
    # append/replay/append-only (Story 1.3). Story 1.6 commits this Postgres 16
    # service-container substrate; deferred-work D2-1.3 cross-reference. Runs in
    # parallel with test / db-check / contracts-check / crypto-check (no
    # downstream job depends on it). The unit `test` job stays DB-free; this job
    # adds the live-DB surface without coupling.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twt_dev_app
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: twt_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U twt_dev_app -d twt_dev"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://twt_dev_app:devpass@127.0.0.1:5432/twt_dev?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Run integration tests
        # Filter to the workspaces with live-DB tests. @twt/jobs joined at Story
        # 1.11a (the audit-integrity walk's synthetic-tamper suite); @twt/api
        # joined at Story 1.11b (the trustee-UI endpoint suite: session
        # introspection + integrity-check history + acknowledge, plus the
        # pre-existing admin-auth / scope-tx / step-up live-DB specs); @twt/queue
        # joined at Story 1.12 (the pg-boss queue-client smoke suite). The Story
        # 1.12 keyed-store concurrency + RLS specs ride @twt/domain. Downstream
        # Stories (7.x Pool Engine, 9.x reconciliation) extend this filter when
        # their integration suites land. With DATABASE_URL set the
        # `describe.skipIf(!hasDatabase)` guards run instead of skipping.
        run: pnpm turbo run test --filter=@twt/domain --filter=@twt/events --filter=@twt/jobs --filter=@twt/api --filter=@twt/queue

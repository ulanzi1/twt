      responses:
        "200":
          description: KYC flow initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycInitiateResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Member is not pending-kyc (KYC already completed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: KYC provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/kyc/callback:
    post:
      summary: DigiLocker OAuth callback (PUBLIC; state-correlated) — verify + pull the profile
      description: The OAuth redirect target DigiLocker sends the browser to with ?state&code. PUBLIC (no member JWT) — correlated by the unguessable state, which resolves the kyc_transaction (member_id + pariwar_id). Verifies the eAadhaar signature, pulls the profile, and persists it awaiting member confirmation. On provider failure returns the normalized KYC error so the client can branch to the manual fallback (AC2).
      tags: *a20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycCallbackRequest"
      responses:
        "200":
          description: Profile verified + persisted (awaiting confirm)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycProfileSummaryResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No transaction for the supplied state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Verification failed / signature invalid / certificate stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: DigiLocker provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/kyc/confirm:
    post:
      summary: Signup KYC — confirm the verified DigiLocker profile (emits member.kyc_completed)
      description: "Confirms a verified DigiLocker profile: emits member.kyc_completed via the projector (pending-kyc → pending-fee) + an audit line. Idempotent (a re-confirm emits no second event). Requires a member session."
      tags: *a20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycConfirmRequest"
      responses:
        "200":
          description: KYC confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatusResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No verified transaction / stored profile to confirm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transaction not verified, or member not pending-kyc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/kyc/manual:
    post:
      summary: Signup KYC — manual fallback (emits member.kyc_manual_fallback)
      description: Stores a self-declared KYC record (name/dob/optional photo, Tier-1 encrypted; verification_strength=self_declared, trustee_verified=false) and emits member.kyc_manual_fallback (pending-kyc → pending-fee). The AC2 fallback target. Requires a member session.

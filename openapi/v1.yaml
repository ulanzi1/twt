    ClauseVersionResponse:
      type: object
      properties:
        clauseVersionId:
          type: string
          format: uuid
        clauseId:
          type: string
          pattern: ^niy\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*(?:\.[a-z0-9]+(?:-[a-z0-9]+)*)?$
        pariwarId:

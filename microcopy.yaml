# microcopy.yaml — the versioned config for the `scripts/microcopy/` CI gate
# (Story 1.17, AC3 — deliverables (b) FM-14 magic-number + (c) vocabulary + (d) numeral).
#
# The forensic-microcopy / vocabulary / numeral-discipline gate enforces UX-DR71
# (vocabulary register) + UX-DR73 (numeral discipline) + the §8 amendment-A2 numeral
# split + the FM-14 token-governance subset. Every finding names file + line + the
# canonical replacement (the benefit-mechanism "name the offender" contract).
#
# v1 ENFORCEMENT FOOTPRINT [Decision 2, LOCKED]: forward-compat is the primary goal,
# but the gate is NOT entirely no-op — it scans a bounded, allow-listed `apps/admin`
# slice now (scope.code_globs), so the FM-14 magic-number check + admin vocabulary/tone
# checks have real teeth on day one. The broad member-surface vocabulary/numeral checks
# stay forward-compat until member surfaces land (scope.copy_globs is empty until Epic
# 2+). Land green-with-teeth: real admin findings are fixed in-story; only
# genuinely-not-applicable cases sit on the allow-list (each with a reason).
#
# Parser: strict (unknown keys throw) — a malformed config must fail the gate loudly,
# never silently disable enforcement (the 1.16d benefit-mechanism rigor).

version: 1

# (c) Vocabulary register — prohibited member-visible term → canonical replacement.
#   member_only: true  → forward-compat: scanned ONLY in scope.copy_globs (empty at
#                        v1) so it bites Epic 2+ member surfaces, NOT admin code where
#                        e.g. "user" is a ubiquitous identifier (false-positive storm).
#   member_only: false (default) → active now: scanned in code_globs AND copy_globs.
#                        These four nouns are unambiguous in copy and are NOT code
#                        identifiers in the admin slice (verified green on introduction).
vocabulary:
  - term: passbook
    canonical: Yogdaan Bahi
  - term: receipt
    canonical: Contribution Note (Yogdaan Pratigya)
  - term: invoice
    canonical: Contribution Note (Yogdaan Pratigya)
  - term: report
    canonical: Sahyog Vivran
  # Member-address + deceased-member terminology (UX-DR71) — forward-compat (member copy).
  - term: customer
    canonical: colleague / सम्मानित साथी
    member_only: true
  - term: donor
    canonical: colleague / सम्मानित साथी
    member_only: true
  - term: user
    canonical: colleague / सम्मानित साथी
    member_only: true
  - term: Late Teacher
    canonical: Deceased Member
    member_only: true

# Tone prohibitions — member-visible copy must not pressure (scarcity / panic) or frame
# the pool against a target (Pool-Reality comparison). Each pattern is a case-insensitive
# regex; the label classifies the finding. (epics L2782 / L2883 / L2984.)
tone:
  - label: scarcity
    pattern: 'only\s+\d+\s+days?\s+left'
  - label: panic
    pattern: '\bURGENT\b'
  - label: pool-reality-comparison
    # Story 7.8 (D3) STRENGTHENED for the close-of-cycle celebration surface: beyond the
    # four original phrasings (fell short / target missed / N% achieved / needed more
    # contributions), add the close-of-cycle-specific variants a naïve celebration author
    # might reach for (shortfall / short of the target|goal / N% of the target|goal / N%
    # short / target|goal (was/is) (not) met|achieved / present-and-past-tense couldn't|
    # didn't|doesn't reach) + one high-signal Hindi phrase (लक्ष्य से कम = "less than
    # target"). `\b` anchors on `target`/`goal` avoid false-triggering on prefix words
    # (e.g. "targeted", "goalless") now that copy_globs scope is growing (7.8 code review).
    # The paraphrased / spelled-out tail is caught by the HUMAN tone-review (tone-guide §5)
    # — the regex is deliberately NOT exhaustive over natural language. Single valid
    # case-insensitive regex (assertValidRegex-validated).
    pattern: 'fell\s+short|shortfall|short\s+of\s+(the\s+)?\b(target|goal)\b|\b(target|goal)\b\s+missed|\d+\s*%\s+achieved|\d+\s*%\s+of\s+(the\s+)?\b(target|goal)\b|\d+\s*%\s+short\b|\b(target|goal)\b\s+(was\s+|is\s+)?(not\s+)?(met|achieved)|needed\s+more\s+contributions|(could|did|does)n.?t\s+reach|(could|did|does)\s+not\s+reach|लक्ष्य\s*से\s*कम'
  - label: out-of-band-blame
    # Story 8.10 (AC4) — the UX-DR76 out-of-band contribution policy, mechanized.
    # A member who sends money directly to a bereaved family (the cadre's chanda
    # tradition) did something HONOURABLE that the Pool Engine structurally cannot
    # capture. epics.md:3038 forbids any "you should have gone through the app"
    # framing; UX spec L1046-1058: "The trust does not characterize it as wrong,
    # failure, or rule-violation." This rule catches the four blame families a
    # well-meaning author reaches for:
    #   (1) RETROSPECTIVE CORRECTION — "you should have gone/paid/sent/given …
    #       through the app", Hindi "…करना चाहिए था". Narrowed to should-have + an
    #       ACTION verb on purpose: bare "should have" also carries innocent uses
    #       ("you should have received an SMS"), which are not this frame.
    #   (2) MISTAKE FRAMING — accidental(ly) / by mistake / mistakenly / गलती से.
    #       Note: bare गलत is NOT matched — a wrong UPI PIN and a wrong-pool
    #       payment ARE genuine mistakes and are correctly framed as such
    #       (contribution.json upi_failure.body.wrong_pin / wrong_pool.body).
    #       Only the "by mistake" construction, which names an intentional gift an
    #       error, is prohibited. NARROWED on introduction (recorded reason): bare
    #       `accidental(ly)` also fires on ordinary DEVELOPER COMMENTS in the
    #       code_globs slice ("an accidental double-click" —
    #       ConcealmentAssessmentControl.tsx:52), which is not this frame at all, so
    #       the arm is bound to a giving/paying verb or noun. That is where the
    #       prohibited frame actually lives ("you accidentally PAID"), and it keeps
    #       the teeth on the real pre-8.10 string while avoiding a standing
    #       false-positive tax on 76 admin files. Narrowing the PATTERN, not an
    #       `allow` entry over a live surface (AC4).
    #       The Hindi गलती से / चाहिए था arms are bound the SAME way, but via
    #       PROXIMITY rather than adjacency — Hindi's flexible (often SOV) word
    #       order means the giving/payment word is rarely immediately next to the
    #       adverb (the real pre-8.10 string is "गलती से सिस्टम के बाहर भुगतान", with
    #       "सिस्टम के बाहर" sitting between them), so an adjacency bind would miss
    #       the very fixture this rule exists to catch. Instead both arms require a
    #       भुगतान/पैसे/राशि/योगदान/दान/उपहार word within 60 chars on either side
    #       (lookahead OR lookbehind). Narrowed on code-review (2026-07-24, recorded
    #       reason): bare गलती से / चाहिए था would otherwise fire on unrelated
    #       Hindi sentences with no giving/payment context at all (e.g. "आपको एक
    #       SMS मिलना चाहिए था" — the Hindi analogue of the already-permitted "you
    #       should have received an SMS"). Verified against every existing +
    #       new fixture in scripts/microcopy/out-of-band.test.ts.
    #   (3) DEFINED-BY-THE-CHANNEL — "outside the system / our app", "सिस्टम के
    #       बाहर". A member's personal act of mutual aid is not defined by its
    #       relation to TWT's software.
    #   (4) DOESN'T-COUNT / IRREGULAR / INCOMPLETE (epics.md:3039(c)) — the
    #       counting arm is matched outright; irregular/incomplete are matched only
    #       when they QUALIFY a contribution/gift/payment noun, since both words
    #       have innocent uses elsewhere in member copy. Deliberate narrowing. The
    #       Hindi doesn't-count arm matches BOTH word orders — negation-before-verb
    #       (नहीं गिन…, e.g. "नहीं गिनी जाएगी") AND the more natural Hindi SOV order
    #       verb-before-negation (गिन…नहीं, e.g. "गिनी नहीं जाएगी") — added on
    #       code-review (2026-07-24): the original only covered the first, which
    #       under-served Hindi-first parity (tone-guide §3) by missing the more
    #       natural construction.
    # Green on introduction is NOT the deliverable: this pattern FIRES on the
    # pre-8.10 committed Screen-3 strings (7.10 shipped "If you accidentally pay
    # outside the system" / "अगर आप गलती से सिस्टम के बाहर भुगतान कर दें"), which is
    # what proves it has teeth ([[feedback_gate_scope_semantic_coverage]] — a green
    # scan over newly-scanned files proves nothing). See
    # scripts/microcopy/out-of-band.test.ts + docs/policies/out-of-band-contributions.md.
    # The paraphrased / spelled-out tail remains the HUMAN tone-review's job
    # (tone-guide §5) — the regex is deliberately NOT exhaustive over natural
    # language. Single valid case-insensitive regex (assertValidRegex-validated).
    pattern: 'should\s*(have|[''’]ve)\s+(gone|paid|sent|used|routed|done|contributed|given)|\baccidental(ly)?\s+(pay|pays|paid|paying|send|sends|sent|sending|give|gives|gave|giving|make|makes|made|making|transfer\w*|contribut\w*|donat\w*)\b|\baccidental\s+(payment|gift|contribution|transfer|donation)\b|\bby\s+mistake\b|\bmistakenly\b|outside\s+(the|our)\s+(system|app|platform)|(does|did|will|would)\s+not\s+count\b|(does|do|did|will|wo|would)\s?n.?t\s+count\b|not\s+counted\b|\b(irregular|incomplete)\s+(contribution|gift|payment|donation)|\b(contribution|gift|payment|donation)\s+(is|was|are|were)\s+(irregular|incomplete)\b|(?:(?<=(?:भुगतान|पैसे|राशि|योगदान|दान|उपहार).{0,60})|(?=.{0,60}(?:भुगतान|पैसे|राशि|योगदान|दान|उपहार)))(?:गलती\s*से|चाहिए\s*था)|(सिस्टम|ऐप|एप)\s*के\s*बाहर|नहीं\s*गिन|गिन[ऀ-ॿ]{0,4}\s*नहीं|(योगदान|भुगतान|दान|उपहार)\s*(अधूरा|अधूरी|अनियमित)|(अधूरा|अधूरी|अनियमित)\s*(योगदान|भुगतान|दान|उपहार)'
  - label: fursat-pressure
    # Story 9.1 (AC2) — the "fursat" cadence operational-posture invariant, mechanized.
    # Sunita reconciles bank statements while grieving; the Nominee Console must respect
    # "fursat" (grief-paced, unhurried) cadence. epics.md:3156-3162 + UX spec L121/L129:
    # throughput optimization must NEVER erode nominee dignity or grief-paced pacing.
    # This rule catches the pressure families a well-meaning "engagement"-minded author
    # reaches for — the register the console must NOT adopt:
    #   (1) GAMIFICATION — streaks, badges, achievements, points, leaderboards, "N%
    #       complete" completion-percentage framing. A grief task is not a game.
    #   (2) URGENCY / FALLING-BEHIND — "you're behind", "falling behind", "act now",
    #       "please act", "hurry up", "don't delay", "last chance", "final reminder/
    #       notice". Note: bare "hurry" is NOT matched — the fursat register's OWN
    #       reassurance is "there is no hurry" (the shipped intro), so the arm binds to
    #       the imperative "hurry up" construction, never the negated reassurance. Same
    #       for Hindi जल्दी: bound to जल्दी कर/कीजिए (the imperative), so "कोई जल्दी नहीं
    #       है" (no hurry — the shipped copy) is correctly NOT flagged.
    #   (3) PRE-THRESHOLD ESCALATION PRESSURE — "last chance"/"final notice"-style
    #       pressure BEFORE the staff-takeover threshold (the takeover is neutral "on
    #       record", never a countdown the nominee is racing).
    # The Hindi arms mirror (2)/(3) with high-signal phrases: आप पीछे / पीछे रह (you're
    # behind), जल्दी कर/कीज (hurry-imperative), तुरंत कर / अभी कर (do it now), देर न कर
    # (don't delay). Bound to imperatives so the reassuring negations the console ships
    # ("कोई जल्दी नहीं") stay usable.
    # Green on introduction is NOT the deliverable: the teeth are proven by
    # scripts/microcopy/fursat.test.ts, which plants prohibited frames in BOTH locales
    # and asserts this rule FIRES on them ([[feedback_gate_scope_semantic_coverage]] — a
    # green scan over the newly-scanned nominee-console files proves nothing). The
    # regex is DELIBERATELY non-exhaustive — the paraphrased / spelled-out tail (e.g. a
    # subtly gamified "keep it up!" or an implicit throughput-over-pace optimization) is
    # the HUMAN Story 2.2 tone-review's job (tone-guide §5 + tone-review-checklist.md).
    # Single valid case-insensitive regex (assertValidRegex-validated).
    pattern: '(earn(ed|ing)?|unlock\w*|keep|kept|los[et]|win|won|your|another)\s+(a\s+|an\s+|the\s+|your\s+)?(streaks?|badges?|achievements?)\b|\b(streaks?|badges?|achievements?)\s+(earned|unlocked|awarded|complete)\b|\d+[- ]?day\s+streaks?|\bleaderboards?\b|\d+\s*%\s+complete\b|completion\s+percentage|you\s*[''’]?re\s+behind|falling\s+behind|fall\s+behind|\bact\s+now\b|please\s+act\b|hurry\s+up|don\s*[''’]?t\s+delay|last\s+chance|final\s+(reminder|notice)|आप\s*पीछे|पीछे\s*रह|जल्दी\s*(कर|कीज)|तुरंत\s*कर|अभी\s*कर|देर\s*न\s*कर'
  - label: moderation-advice
    # Story 10.11 (AC5) — the detection-only governance invariant, mechanized.
    # epics.md:3582-3587 + prd.md:879: the Trustee-Lite worklist surfaces members for whom
    # a contribution-discipline (R7) clause applies, and the trustee decides what — if
    # anything — follows. The system must NEVER make, imply, or nudge toward that decision.
    # The epic names the prohibition exactly: no "should be suspended", no "action
    # required", no "overdue for review", and equivalents. It also gives the reason a
    # SEVERITY is forbidden on a moderation row: "a severity score on a moderation row
    # would itself be a recommendation."
    #
    # Copy is where this erodes SILENTLY. The structural half (a frozen DTO key set that
    # rejects any recommend/suggest/severity-shaped key name, plus a null-pinned severity)
    # is enforced by tests, which catch a shape change loudly. But an author softening
    # "Members with an R7 clause on record" into "Members who should be suspended" changes
    # no type and breaks no test — so THAT is the family worth mechanizing here
    # ([[feedback_mechanization_split_commitment]]: mechanize the cheapest and most
    # corrosive family, test the rest).
    #
    # NO new gate script is written: `apps/admin/src/**/*.{ts,tsx}` is ALREADY in
    # scope.code_globs below, so this one entry binds the Trustee-Lite module AND every
    # future admin surface with zero gate-code change. Writing a per-story AST gate here
    # would be a standing tax for a surface two tests already cover better
    # ([[project_access_wrapper_gate_pending_scope]] — know when NOT to extend).
    #
    # The six arms, each a phrasing a well-meaning author actually reaches for:
    #   (1) VERDICT-BY-COPY — "should be suspended/terminated/removed/expelled", and the
    #       stronger "must be …". Bound to the moderation OUTCOME verbs on purpose: a bare
    #       "should be" has innocent uses ("the deadline should be visible in the row").
    #   (2) IMPERATIVE DEMAND — "action required", "requires/needs your action", "needs
    #       action". NARROWED on introduction to exclude the NEGATED form, in both
    #       languages, and the reason is a real finding rather than a hypothetical: this
    #       rule as first written fired on the SHIPPED Story 9.1 nominee-console string
    #       "आपकी ओर से कोई कार्रवाई ज़रूरी नहीं है।" ("No action is needed from you.") —
    #       which is the fursat register's own reassurance to a grieving nominee, not a
    #       demand. That is the identical narrowing the `fursat-pressure` rule above
    #       already applies to जल्दी (bound to the imperative so "कोई जल्दी नहीं है" stays
    #       usable). The English arm is guarded symmetrically (`no action required` does
    #       not fire) so the same sentence cannot pass in one language and fail in the
    #       other — a parity bug the original asymmetric pattern would have introduced.
    #       An INVERTED verdict ("no action required" about a MEMBER) is still a
    #       conclusion this surface should not reach, but catching it needs the context a
    #       regex does not have; it is left to the HUMAN tone-review (tone-guide §5).
    #   (3) LATENESS AS JUDGEMENT — "overdue for review", "overdue for action". Note the
    #       narrow bind: a reconciliation row genuinely PAST a real deadline is a fact and
    #       the shipped copy says "Past deadline"; it is the "overdue FOR <a decision>"
    #       construction that smuggles in a verdict.
    #   (4) EXPLICIT RECOMMENDATION — "recommend(ed/s) suspension/termination/removal",
    #       and the noun form "recommended action".
    #   (5) CANDIDACY FRAMING — "candidate(s) for suspension/termination/removal",
    #       "eligible for suspension". Naming a member a candidate IS the recommendation.
    #   (6) HINDI mirrors of (1)/(2)/(4) — निलंबित/समाप्त/निष्कासित followed by चाहिए
    #       ("should be suspended / terminated"), कार्रवाई आवश्यक/ज़रूरी ("action required"),
    #       and सिफारिश ("recommend") within 40 chars of a moderation noun so ordinary uses
    #       elsewhere do not fire. The चाहिए arm binds by PROXIMITY (≤20 Devanagari chars)
    #       rather than adjacency — Hindi's flexible, often SOV order puts a case marker or
    #       auxiliary between the verb and चाहिए ("समाप्त की जाना चाहिए"), so an adjacency
    #       bind would miss the very construction the arm exists to catch. Same technique the
    #       `out-of-band-blame` rule uses for its गलती से / चाहिए था arms.
    #
    # Green on introduction is NOT the deliverable ([[feedback_gate_scope_semantic_coverage]]
    # — a green scan over a newly-scanned surface proves nothing). The teeth are proven by
    # scripts/microcopy/moderation-advice.test.ts: it plants each prohibited frame in a
    # Trustee-Lite-shaped fixture and asserts this rule FIRES, asserts the REAL authored
    # module is clean, and records the revert-sanity (delete this entry → the planted
    # fixtures go unflagged). The paraphrased tail stays the HUMAN tone-review's job
    # (tone-guide §5) — the regex is deliberately NOT exhaustive over natural language.
    # Single valid case-insensitive regex (assertValidRegex-validated).
    # ── Negation-guard widening (review finding, 2026-08-05) ──────────────────────────────────
    # The (2) IMPERATIVE DEMAND negation guards above originally checked only IMMEDIATELY
    # adjacent "no" ((?<!\bno\s) / (?!\s*नहीं)), so a legitimate reassurance with one intervening
    # qualifier — "No further action is required from you.", "कार्रवाई ज़रूरी बिलकुल नहीं है" —
    # still tripped the rule as a false positive; the only test guarding this arm exercised the
    # bare adjacent case. Both guards now tolerate up to 3 intervening words/tokens between "no"/
    # "नहीं" and the trigger, same reassurance-stays-usable intent, wider berth.
    pattern: '\b(should|must|ought\s+to)\s+be\s+(suspend|terminat|remov|expel|ban)\w*|(?<!\bno\b(?:\s+\S+){0,3}\s)\baction\s+(is\s+)?required\b|(?<!\bno\b(?:\s+\S+){0,3}\s)\b(requires?|needs?|need)\s+(your\s+|immediate\s+|trustee\s+)?action\b|\boverdue\s+for\s+(review|action|a\s+decision|moderation)\b|\brecommend(ed|s|ing)?\s+(a\s+|the\s+)?(suspension|termination|removal|expulsion|moderation)\b|\brecommended\s+action\b|\bcandidates?\s+for\s+(suspension|termination|removal|expulsion)\b|\beligible\s+for\s+(suspension|termination|expulsion)\b|(निलंबित|समाप्त|निष्कासित)(?=[ऀ-ॿ\s]{0,20}चाहिए)|कार्रवाई\s*(आवश्यक|ज़रूरी|जरूरी)(?!(?:\s+\S+){0,3}\s*नहीं)|(?:(?<=(?:निलंबन|समाप्ति|निष्कासन|कार्रवाई).{0,40})|(?=.{0,40}(?:निलंबन|समाप्ति|निष्कासन|कार्रवाई)))सिफारिश'

# (d) Numeral discipline — amendment A2 (UX spec L1119-1127 / L1303). Operational
# surfaces = Gregorian dates + Latin numerals; Hindi/Devanagari numerals (०-९) are
# reserved EXCLUSIVELY for memorial Devanagari prose on the Shradhanjali surface.
numerals:
  # Flag Devanagari digits on operational (non-ceremonial) surfaces.
  flag_devanagari_digits: true
  # Flag inline Hindi/Devanagari numeral formatting (must route through the future
  # packages/i18n utility, Story 2.1 — NOT inline). Forward-compat at v1 (no member
  # surface formats numerals yet); flags-by-policy now and tightens once 2.1 lands.
  flag_inline_locale_formatting: true
  # Surfaces where Devanagari digits ARE permitted in narrative prose (the Shradhanjali
  # memorial). Empty at v1 — that surface lands Epic 11/12.
  ceremonial_globs: []

# (b) FM-14 #2 token-governance — flag hardcoded color literals in component code.
#   Color is the token facet with COMMITTED values at v1 (the subsumed admin status
#   palette), so its magic-number check is actionable now. The spacing/border/font
#   px-literal facet is forward-compat: those token values are PLACEHOLDER until P0-2,
#   so demanding their replacement now would be incoherent — it tightens when P0-2
#   commits real px (documented in the gate README's teeth table).
magic_number:
  flag_color_literals: true

# Scan scope (precision-scoped, like pii-scrape / benefit-mechanism — the gate reads
# ONLY these globs; never docs / _bmad-output / *.md / its own scripts dir / this config).
scope:
  # Token-consuming component / source files — the live admin slice (real teeth now).
  code_globs:
    - apps/admin/src/**/*.tsx
    - apps/admin/src/**/*.ts
    # Story 8.7 — the Yogdaan Pratigya (Contribution Note) PDF TEMPLATE + its facts resolver. These are
    # the first non-admin files in code_globs, and they are here for a specific reason: the Contribution
    # Note's whole identity is that it is NOT a transactional document (FR-33), and the vocabulary
    # register's prohibition binds the artifact's TEMPLATE SOURCE — its headings, its document title,
    # its filename and its Content-Disposition — not only the locale strings it interpolates. The
    # `contribution` copy globs below already cover the strings; without this entry the one file that
    # could hardcode a prohibited noun into the document was unscanned.
    #
    # These files also carry the sheet's CSS, so the FM-14 #2 magic-number-colour check bites them: the
    # template takes every non-tenant colour from `@twt/tokens` semantic roles rather than hex literals
    # (a genuine fix, NOT an allow-list entry). Teeth proven — planted-violation fixture + revert-sanity
    # — in scripts/microcopy/contribution-note.test.ts + the Dev Agent Record
    # ([[feedback_gate_scope_semantic_coverage]]: a green scan over newly-scanned files proves nothing).
    - apps/api/src/modules/member-pool/note-template.ts
    - apps/api/src/modules/member-pool/contribution-note.ts
  # Member-visible copy (locale strings) — POPULATED at Story 2.5 (AC6c) for the first
  # member surface: the public Niyamavali (apps/public). These globs scan the PURE
  # member copy (the `niyamavali` i18n namespace strings), so the member-register
  # vocabulary (user/customer/donor → canonical) + Devanagari-numeral discipline now
  # have TEETH on real member text. Mixed code+template files (`.astro`, like admin
  # `.tsx`) stay OUT of copy_globs — `member_only` terms are ubiquitous code
  # identifiers there (false-positive storm); they belong in code_globs with
  # member_only OFF. The register grows surface-by-surface as Epic 11a/11b land.
  copy_globs:
    - packages/i18n/locales/hi/niyamavali.json
    - packages/i18n/locales/en/niyamavali.json
    # Story 2.6 — the `terms` namespace strings (the public /terms surface).
    - packages/i18n/locales/hi/terms.json
    - packages/i18n/locales/en/terms.json

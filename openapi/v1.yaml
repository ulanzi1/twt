  /api/v1/member/vyawastha-shulk/renew/intent:
    post:
      summary: Renewal — build the annual ₹ Vyawastha Shulk UPI Intent URL
      description: Identical to the signup intent (server-authoritative VPA + amount from config; `tr` idempotency nonce) but with a renewal `tn` grammar (renewal-shulk-{memberId}-{year}). Requires a member session. 503 when the trust VPA is unconfigured.
      tags: *a68
      responses:
        "200":
          description: UPI Intent URL + tr
          content:

        "404":
          description: Survey not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Illegal transition for the survey's current status; OR the survey's status changed concurrently before close could be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/p/{pariwarId}/surveys/{surveyId}/aggregate:
    get:
      summary: The survey's aggregate results (counts only — never who answered)
      description: 'Returns per-option selection counts for every choice question (every declared option appears, including at zero, so "nobody chose this" is distinguishable from "this option does not exist"), the total response count, and `threshold_met`. NO field in this response can carry a member identifier. `threshold_met` is INFORMATIONAL and tri-state: null when no threshold was authored (which must not render as "not met"), and even when set it gates nothing — a survey informs a decision and never makes one.'
      tags: *a72
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: surveyId
          in: path
      responses:
        "200":
          description: The aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyAggregate"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (survey.manage) for this Pariwar
          content:

      description: Returns EVERY registered flag resolved against the CROSS-TENANT tier — the global row if one is in force, else the code default. The listing is registry-driven, not row-driven, so a flag that has never been flipped still appears. Requires feature_flag.view, satisfied by holding it in ANY of the actor's own Pariwars (pariwar_admin+) or by a global grant (super_admin) — the catalog's data does not vary by tenant, so this is prd.md:892's "visible to Pariwar Admin role and above" read literally. GET /api/v1/p/{pariwarId}/feature-flags additionally shows each flag's effective resolution for one specific tenant, including any governing global row.

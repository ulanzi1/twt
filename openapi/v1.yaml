      summary: Signup T&C — the current effective Terms & Conditions for the member’s Pariwar
      description: "Returns the current effective T&C version for the member’s Pariwar: the tcVersionId, the effective-from instant, the PRECOMPUTED sanitized HTML body (rendered once at write time — the screen emits it verbatim, no markdown render at read), and the echoed locale. Returns 503 when no effective T&C is provisioned for the Pariwar (a server-side gap, not a client error — the screen renders a graceful unavailable state). Requires a member session."

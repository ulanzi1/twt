  /api/v1/p/{pariwarId}/moderation/appeals/off-portal:
    post:
      summary: Record a member's appeal taken by helpline (operator, off-portal)
      description: "THE ARM THAT SURVIVES THE END OF AUTHENTICATED ACCESS. §8.8: \"the right to appeal does not depend on the access that termination removes.\" With `termination_access_block` enabled a terminated member holds no session at all, and this is the only route left to them. Gated on `helpdesk.create` — ⛔ NOT on `member.data_rights` (filing an appeal is not executing a DPDPA right) and ⛔ NOT on `member.moderate` (which would let the authority that sanctions a member also file their appeal). `helpdesk_ticket_id` is REQUIRED here and enforced by a DB CHECK: the ruling places the off-portal process ON a helpdesk ticket. The operator RECORDS the act; the event attributes it to the MEMBER, because the appeal is the member's own."

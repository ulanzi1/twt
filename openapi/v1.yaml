  /api/v1/p/{pariwarId}/admin/reports/{id}/download:
    get:
      summary: Download a ready report export (one-time, 24h, authenticated stream)
      description: "Streams the envelope-decrypted artifact as text/csv or application/json (the format is the export's own). One-time: guards in order owned → not-consumed (410) → not-expired-status (410) → failed (409 `reports.build_failed`) → ready (409 `reports.not_ready`) → not-expired-window (410); consumed_at is stamped before streaming (a concurrent double-download loses → 410). The two 409 cases carry DISTINCT error codes so a client can tell a permanent build failure from a transient still-building state. NO response schema — the artifact bytes are streamed, never JSON-embedded (the R1 rule)."
      tags: *a69
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:

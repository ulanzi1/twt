  /api/v1/p/{pariwarId}/member/banners:
    get:
      summary: The member's currently visible banner + popup (RESOLVED server-side)
      description: "Returns AT MOST ONE banner and AT MOST ONE popup. Both may be present at once — the two display modes are independent lanes, so a popup never suppresses the strip. When several banners of one mode are simultaneously visible, the winner is chosen by a total, replayable order: severity (critical > warning > info), then valid_from descending, then banner_id ascending. Resolution happens on the server so every client agrees. Member-session-gated (no RBAC key); a `pariwarId` that does not match the member's own JWT is a 404, not a 403."

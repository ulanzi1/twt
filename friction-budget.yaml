# friction-budget.yaml — metric-threshold registry (UX-DR3, metric facet)
# Story 1.16a. Architecture Principle #8 (line 294) + §4.11.1 page-weight budget
# (lines 2785-2799). The named-payer DECLARATION ledger is the sibling file
# friction-budget.md; one CI job (scripts/friction-budget/check.ts) runs both.
#
# ┌─ CHANGING A CEILING REQUIRES A SEPARATE PR WITH WRITTEN RATIONALE ──────────┐
# │ Loosening a ceiling (raising the budget) must land in its OWN PR with a     │
# │ written rationale — never bundled with a measurement/code change. The gate  │
# │ (AC-1) detects a same-PR ceiling raise + measurement change and fails with  │
# │ "split into a rationale PR".                                                │
# └────────────────────────────────────────────────────────────────────────────┘
#
# baseline-of-record (AC-3): `baseline` is the committed current value the gate
# compares against. It is `null` until a surface produces measurable build
# output. On an improvement the author commits the lowered baseline IN THIS PR;
# the gate asserts committed === measured (it never auto-pushes commits).
#
# BOOTSTRAPPING / no-op (AC-2): no member-facing build output exists in
# `pnpm turbo run build` yet (apps/public is a tsc stub until the Story 2.5 Astro
# shell; apps/mobile `build` is an intentional EAS no-op). Each surface is a
# graceful no-op (passes) until its `manifest` path exists, then grows teeth
# surface-by-surface. See friction-budget.md + scripts/friction-budget/README.md.

version: 1

surfaces:
  # The member mobile app JS bundle. Canonical device = 3GB Android
  # (architecture line 34). `build` is an EAS no-op today → no-op until a
  # bundle manifest lands.
  - id: member-app-native
    description: Member mobile app JS bundle (apps/mobile, Expo / EAS)
    manifest: apps/mobile/dist/bundle-manifest.json
    metrics:
      - id: js_bundle_bytes
        ceiling: 2621440 # 2.5 MiB
        baseline: null
      - id: page_weight_bytes
        ceiling: 3145728 # 3 MiB total transferred
        baseline: null

  # The public member-facing web surface. LANDED at Story 2.5 (AR-48): apps/public is
  # now a real Astro 6 SSR app emitting dist/page-weight.json, so this surface has
  # TEETH (was a no-op while it was a tsc stub). Web budgets are tighter than native
  # per architecture §4.11.1. baselines-of-record committed at the first measurable
  # build: zero client JS (no hydrated islands) + the extracted CSS transfer.
  #
  # ⭐ PER-ROUTE ATTRIBUTION DISCHARGED AT STORY 11a.2 (ruling D5(a)). The deferral
  # CR-D0-1.16a asked to "restructure to `routes: { '/niyamavali': <bytes> }`" and
  # named "Epic 11a (second public route)" as its trigger. ⚠ THAT TRIGGER HAD ALREADY
  # FIRED TWICE AND WAS MISSED — /terms (2.6) and /blog (10.5) both shipped while this
  # manifest stayed an aggregate. It did not fail; it was NOT NOTICED. `page-weight.mjs`
  # now emits a `routes: {…}` block covering every shipped route.
  #
  # ⛔ READ WHAT THE PER-ROUTE NUMBERS ARE, AND ARE NOT:
  #   · ATTRIBUTION of STATIC CLIENT ASSETS per route — ⛔ NOT a measurement of each
  #     route's DYNAMIC HTML response, which on an SSR surface is the larger part of
  #     what a visitor downloads. That remains unmeasured; capturing it is the
  #     separately-deferred `critical_render_path_ms` harness below.
  #   · Shared chunks (PublicShell.css) are attributed to EVERY route, so ⛔ the
  #     per-route figures DO NOT SUM to page_weight_bytes. `shared_bytes` is emitted
  #     separately so the overlap is visible.
  #   · ⛔ THE ROUTES BLOCK IS EMITTED, NOT ENFORCED. `evaluateMetric` reads flat
  #     top-level `manifest[metric.id]`, so the two metrics below remain the gated
  #     numbers and the per-route block is for REVIEW. ⚠ Stated because a per-route
  #     block that merely looked enforced would be a vacuous green — the exact defect
  #     class this epic keeps finding.
  - id: member-public-web
    description: Public member-facing web (apps/public Astro SSR — Story 2.5)
    manifest: apps/public/dist/page-weight.json
    metrics:
      - id: js_bundle_bytes
        ceiling: 153600 # 150 KiB
        baseline: 0 # no client islands ⇒ zero hydrated JS at Story 2.5
      - id: page_weight_bytes
        ceiling: 512000 # 500 KiB static client assets (CSS/JS under dist/client/ — excludes the dynamic SSR HTML response)
        # ⛔ STAYS 3942 — the best-ever extracted-CSS record from Story 2.5. A
        # baseline-of-record only DECREASES in-PR (the AC-1 ratchet), and
        # `detectRaisedBaselines` forbids an in-PR raise. Measured history, for
        # readers who would otherwise wonder why it drifts upward and the number
        # does not: /terms (2.6) → 5219; Story 11a.2 (+/members CSS) → 6327. Both
        # are far under the 512000 ceiling, so both PASS with the delta reported.
        # ⚠ A RISE IS NEVER RATCHETED. Do not "update the baseline to match".
        baseline: 3942

# Live critical-render-path TIMING on the canonical device (3GB Android,
# architecture line 34) is EXPLICITLY DEFERRED (AC-6): no device-farm /
# CPU-throttled-Lighthouse harness exists in CI. The statically measurable
# proxies (js_bundle_bytes + page_weight_bytes above) ship now; live timing is
# recorded as "Resolved via explicit deferral" in deferred-work.md with a trigger.
#
# Story 2.5 disposition (Decision 2026-06-20-055(b), which PERMITS deferral so long
# as it is WRITTEN): the Astro shell landed WITHOUT a throttled-Lighthouse-CI harness.
# The static byte proxies above acquired teeth instead (member-public-web baselines
# committed). The live-timing harness is RE-TARGETED to the first Epic 11a public
# surface (Member Directory), where a second public route makes a device-throttled
# render budget worth standing up. Not silently dropped — carried with a gate.
deferred_metrics:
  - id: critical_render_path_ms
    canonical_device: 3GB Android
    status: deferred
    # ⚠ RE-DEFERRED AT STORY 11a.2 WITH A NEW WRITTEN TRIGGER AND A REASON (ruling
    # D5(a), Decision 2026-08-20-141). ⛔ NOT silently carried: the previous trigger
    # ("Epic 11a, first additional public surface") FIRED when /members shipped in
    # this story, and a trigger that fires must be answered in writing — discharged or
    # re-deferred — never passed over. Per [[feedback_closure_language_precision]]
    # this is "Resolved via explicit deferral", ⛔ not "closed".
    #
    # REASON FOR RE-DEFERRAL: a device-throttled Lighthouse-CI harness is a genuinely
    # separate piece of INFRASTRUCTURE (a CI runner profile, a throttling config, a
    # results store, a flake policy), not a change to a script this story already
    # touches. ⛔ Smuggling it into a shell story would either rush the harness or
    # stall the shell. The per-route restructure — which WAS a small change to a
    # script this story touches — is discharged here instead.
    #
    # ⚠ WHAT REMAINS UNMEASURED IN THE MEANTIME, stated plainly: the dynamic SSR HTML
    # weight and real render timing on the canonical device. The static byte proxies
    # above measure client ASSETS only, and the new per-route block attributes those
    # same assets — ⛔ neither is a critical-render-path measurement, and ⛔ neither may
    # be cited as one.
    previous_trigger: throttled-Lighthouse-CI harness lands at Epic 11a (first additional public surface) — FIRED at Story 11a.2 when /members shipped; answered here by re-deferral, not by silence
    trigger: >-
      Story 11a.3 (the Member Directory RENDER — the first public surface whose
      response weight actually varies with data, and therefore the first one where a
      throttled critical-render-path budget measures something a byte count cannot)
      OR the first client island shipping on apps/public (js_bundle_bytes leaving 0),
      whichever comes first.

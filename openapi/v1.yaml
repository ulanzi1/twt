              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/p/{pariwarId}/members/{memberId}/moderation/suspend:
    post:
      summary: "Suspend a member (moderation overlay: none → suspended)"
      description: "Records a suspension against the member with a registry reason code and a MANDATORY free-text rationale (stored Tier-1 encrypted; it never appears on any response, event payload or audit line). Moderation is an event-derived OVERLAY orthogonal to the member lifecycle — `members.state` is NOT touched. The member stops being covered for support (`is_valid` becomes false, which is the entire enforcement surface: pool assignment and claim eligibility inherit it), every session is revoked, and the member is notified. The member can STILL sign in — deliberately, so they can read the explanation and reach the appeal path. Step-up required (`member_moderation_suspend`)."
      tags: &a73
        - member-moderation
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: memberId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerateMemberRequest"
      responses:
        "200":
          description: The recorded moderation action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAction"
        "400":
          description: Request validation failed (e.g. an empty or whitespace-only rationale)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (member.moderate) for this Pariwar; OR step-up required / the elevation was minted for a DIFFERENT moderation action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Illegal from the member's current standing (e.g. already suspended) — rejected BEFORE any write; OR the acting admin has no display name on record (`admin.display_name_missing`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The reason code is undeclared, or cannot justify a suspension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/p/{pariwarId}/members/{memberId}/moderation/terminate:
    post:
      summary: "Terminate a member (moderation overlay: suspended → terminated)"
      description: "Legal ONLY from `suspended` — FR-56 routes termination THROUGH suspension, so the harshest, rejoin-locking action can never be a single click; terminating an unmoderated member is a 409. Sets a 12-month rejoin lock (FR-6): a signup under the same identity is refused until `rejoin_permitted_at`. Revokes every session and notifies the member, who can still sign in. Step-up required (`member_moderation_terminate`) — an elevation minted for suspend or restore does NOT satisfy it."
      tags: *a73
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: memberId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerateMemberRequest"
      responses:
        "200":
          description: The recorded termination (carries rejoin_permitted_at)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationAction"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (member.moderate) for this Pariwar; OR step-up required / the elevation was minted for a DIFFERENT moderation action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The member is not currently suspended — termination is legal only from `suspended`; OR the acting admin has no display name on record (`admin.display_name_missing`)
          content:

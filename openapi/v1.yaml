          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Member not found / not in a renewable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/p/{pariwarId}/helpdesk/tickets:
    post:
      summary: Create + route a helpdesk ticket (the Epic-10 primitive)
      description: "Resolves member_scope_context from the subject, snapshots the in-force per-Pariwar routing-policy version, deterministically routes the ticket (category × scope → target role + scope + SLA budgets), persists the ticket + genesis event + projected state in one transaction, and audits the routing decision (withCompensatingAudit). Tenant-scoped; today only an authenticated admin/operator session may call this route (the FR-88 protected-surface write rate-limit applies) — the request shape also supports created_via: member_app for forward-compatibility with Story 10.2, which reuses this same schema for the member-authenticated route. Returns the created, routed ticket."
      tags:
        - helpdesk
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path

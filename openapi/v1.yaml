      required:
        - authenticated
      additionalProperties: false
    RecoveryConsumeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - code
      additionalProperties: false
    RecoveryConsumeResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          enum:
            - true
      required:
        - authenticated
      additionalProperties: false
    PasswordResetRequestRequest:
      type: object
      properties:
        email:

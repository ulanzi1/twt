  /api/v1/p/{pariwarId}/member-data-rights/export:
    post:
      summary: BUILD a member's data export off-portal (AC5)
      description: "Assembles the subject member's export without a member session, for a member whose portal access has ended. Refuses a closed membership (409 data_export.member_terminal) and reuses an existing active off-portal export rather than assembling a second dossier. Requires an admin session, the `member.data_rights` permission (pariwar dimension) and a fresh `member_data_rights` step-up elevation. `Idempotency-Key` is REQUIRED: a replay of the same key is refused with a typed 409 rather than silently re-executed."
      tags:
        - member-data-rights
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OffPortalExportRequest"
      responses:
        "200":
          description: Export requested (or the existing off-portal one reused)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OffPortalExportResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing member.data_rights, or step-up required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member or helpdesk ticket not found in this Pariwar
          content:
            application/json:

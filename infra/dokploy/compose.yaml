# Dokploy application stack — Story 1.15 (AC-5). The four TWT services as Dokploy
# applications. Imported by the operator into the staging + prod Dokploy projects
# (twt-dokploy-staging / twt-dokploy-prod, distinct IAM per §5.3). Images are built
# + pushed by .github/workflows/deploy-{staging,prod}.yml; ${IMAGE_TAG} + ${ENV} +
# ${AR_BASE} are substituted by Dokploy from the deploy API POST payload / project env.
#
# This is the AS-BUILT shape the deploy-config reader (AC-3) targets; it is NOT
# applied by the dev agent (operator activation leg). Secrets (DATABASE_URL,
# DOKPLOY_API_*, SESSION_SECRET, ARGON2_PEPPER, KMS resource names) are injected by
# Dokploy from Secret Manager-sourced project secrets, NEVER committed here.

services:
  api:
    image: ${AR_BASE}/api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Story 1.15: live deploy seam in staging/prod (fake in dev/CI).
      DEPLOY_TRIGGER_MODE: live
      # Secret refs are resolved by Dokploy from project secrets (Secret Manager).
      DATABASE_URL: ${DATABASE_URL}
      SERVICE_DATABASE_URL: ${SERVICE_DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ARGON2_PEPPER_SECRET_NAME: twt-${ENV}-argon2-pepper
      DOKPLOY_API_URL: ${DOKPLOY_API_URL}
      DOKPLOY_API_TOKEN: ${DOKPLOY_API_TOKEN}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_EXPECTED_ORIGIN: ${WEBAUTHN_EXPECTED_ORIGIN}
      # Story 6.37 (`2026-10-17-345` MG10 / MG17; ADR-0041) — the MSG91 authkey's Secret Manager NAME (⛔ the key). The origin
      # defaults to https://control.msg91.com in code (SMS_GATEWAY_API_URL unset); the sender id lives ON each MSG91 template.
      # The OPTIONAL template-read-only key (MG17 (b)) — unset ⇒ the send key reads the templates. Values: roster Row 32 (b).
      SMS_GATEWAY_API_KEY_SECRET_NAME: ${SMS_GATEWAY_API_KEY_SECRET_NAME}
      SMS_GATEWAY_PREFLIGHT_KEY_SECRET_NAME: ${SMS_GATEWAY_PREFLIGHT_KEY_SECRET_NAME}
    labels:
      # Dokploy/Traefik path routing — the API surface.
      - "traefik.http.routers.twt-api.rule=PathPrefix(`/api/v1`)"

  admin:
    image: ${AR_BASE}/admin:${IMAGE_TAG}
    restart: unless-stopped
    labels:
      - "traefik.http.routers.twt-admin.rule=PathPrefix(`/admin`)"

  jobs:
    image: ${AR_BASE}/jobs:${IMAGE_TAG}
    restart: unless-stopped
    # Worker — no ingress route. Runs the pg-boss queue (audit-integrity cron,
    # off-site mirror, idempotency vacuum).
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      SERVICE_DATABASE_URL: ${SERVICE_DATABASE_URL}
      # Story 6.30 (`2026-10-10-312` AL5) — the base of every app link a text carries: the Trust's domain as an
      # https ORIGIN (roster Row 29 (b)). Validated by `resolveHttpsOrigin`; READ by Story 6.27c's sweep (until
      # then nothing reads it). ⛔ No code default.
      APP_LINKS_BASE_URL: ${APP_LINKS_BASE_URL}
      # Story 6.37 (`2026-10-17-345` MG10 / MG17; ADR-0041) — the MSG91 authkey's Secret Manager NAME (⛔ the key). The origin
      # defaults to https://control.msg91.com in code (SMS_GATEWAY_API_URL unset); the sender id lives ON each MSG91 template.
      # The OPTIONAL template-read-only key (MG17 (b)) — unset ⇒ the send key reads the templates. Values: roster Row 32 (b).
      SMS_GATEWAY_API_KEY_SECRET_NAME: ${SMS_GATEWAY_API_KEY_SECRET_NAME}
      SMS_GATEWAY_PREFLIGHT_KEY_SECRET_NAME: ${SMS_GATEWAY_PREFLIGHT_KEY_SECRET_NAME}

  public:
    image: ${AR_BASE}/public:${IMAGE_TAG}
    restart: unless-stopped
    # Story 6.30 (`2026-10-10-312` AL9) — ONLY the app-link variables; every value is PUBLIC and unset is safe
    # (the two verification files answer 404, the fallback page says "the app" and shows ⛔ no store button).
    # ⚠ This service's own DATABASE_URL / PUBLIC_API_ORIGIN are still ⛔ not wired here — a deferred-work item,
    # outside 6.30. Values: roster Row 29 (a) / (c).
    environment:
      APP_LINKS_IOS_APP_IDS: ${APP_LINKS_IOS_APP_IDS}
      APP_LINKS_ANDROID_APPS: ${APP_LINKS_ANDROID_APPS}
      APP_STORE_URL_ANDROID: ${APP_STORE_URL_ANDROID}
      APP_STORE_URL_IOS: ${APP_STORE_URL_IOS}
      APP_DISPLAY_NAME: ${APP_DISPLAY_NAME}
    labels:
      # Per-Pariwar path-scope (architecture §2.5 + AR-25): every Pariwar served
      # under /p/<pariwar_id>/ on this single multi-tenant deployment. Branding is
      # resolved at request time from the Pariwar-Passport (no per-Pariwar rebuild).
      - "traefik.http.routers.twt-public.rule=PathPrefix(`/p/`)"
      # Story 6.30 (`2026-10-10-312` AL9, `-315` C4) — the app-link surfaces, scoped to EXACT paths: the two
      # verification files, one Path(...) per APP_LINK_PATHS entry (`packages/contracts/src/app-links/
      # app-link-paths.json` — a new path needs a new Path(...) here), and the site's hashed static assets
      # (PathPrefix(`/_astro/`) — public, data-free, ⛔ never a page; without it the fallback page is unstyled).
      # ⛔ Never PathPrefix(`/.well-known/`) (ACME and future well-known paths would reach Astro); ⛔ never
      # PathPrefix(`/peer-request`) (a plain string prefix — `/peer-requests` would match). Traefik Path()
      # matches the path only, ⛔ not the query. ⚠ The as-built `/p/` rule vs the root-level Astro pages mismatch is
      # RECORDED (6.30 F5), ⛔ not re-architected here. Dev wires, operator applies (ADR-0011 §5; Row 29 (g)).
      - "traefik.http.routers.twt-public-app-links.rule=Path(`/.well-known/apple-app-site-association`) || Path(`/.well-known/assetlinks.json`) || Path(`/peer-request`) || PathPrefix(`/_astro/`)"

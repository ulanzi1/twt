          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Member is in a terminal state (withdrawn / anonymized)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Signup nominees — the current effective declaration (NO PII echo-back)
      description: "Returns the member's current nominee declaration as NON-PII summaries: rank, relationship, the server-stamped splitPct, and presence flags for the encrypted fields. NEVER the raw name/mobile/address bytes (Tier-1 echo-back discipline). Requires a member session."

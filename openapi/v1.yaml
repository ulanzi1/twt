  /api/v1/p/{pariwarId}/member-data-rights/delivery/staff-mediated:
    post:
      summary: NARROW EXCEPTION — staff-mediated delivery behind the ratified three-part gate (AC-R1)
      description: "Decision 2026-08-14-113 clause 1: all three elements are required and none substitutes — (1) the member's own explicit request, (2) the SERVER-OBSERVED `primary_delivery_not_completed` for THIS export, and (3) the staff attestation (Tier-1, withheld from the member's export). Enforced again as a database CHECK. Requires an admin session, the `member.data_rights` permission (pariwar dimension) and a fresh `member_data_rights` step-up elevation. `Idempotency-Key` is REQUIRED: a replay of the same key is refused with a typed 409 rather than silently re-executed."

  /api/v1/p/{pariwarId}/member/helpdesk/tickets:
    post:
      summary: File a helpdesk ticket from the member app (single-shot multipart)
      description: "Member-session-gated + Turnstile-gated (FR-88) + Idempotency-Key-gated (review-hardening). Requires the `x-turnstile-token` and `Idempotency-Key` HEADERS (verified/claimed before the multipart body is parsed at all — never multipart fields). Accepts multipart/form-data: the non-file fields (category, sub_category, subject, body) plus up to 5 attachment files (JPEG/PNG/PDF, 10 MiB each, 25 MiB combined). Forces created_via=member_app and subject_member_id=the session member; reuses the 10.1 domain routing + genesis orchestration verbatim. Returns the created ticket detail (status + routing target + SLA + the read-only opening thread entry) — 201 on a fresh create, or 200 if the Idempotency-Key replays an already-completed create (the ORIGINAL ticket, never a duplicate)."
      tags:
        - helpdesk
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/MemberCreateTicketFields"
      responses:
        "200":
          description: Replayed — an identical create with this Idempotency-Key already succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberTicketDetail"
        "201":
          description: Ticket created + routed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberTicketDetail"
        "400":
          description: Request validation failed, or a required header is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Turnstile verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Routing policy misconfigured / create conflict / a matching Idempotency-Key claim is still in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: An attachment (or the combined attachment set) exceeds the size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported attachment media type
          content:

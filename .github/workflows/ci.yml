name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  push:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [install, build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

  db-check:
    name: db-check
    runs-on: ubuntu-latest
    needs: install
    # Pure static analysis over packages/domain/src/schema/*.ts +
    # packages/domain/migrations/meta/*.json. No DB connection required.
    # Story 1.2 commits the integrity primitive; Story 1.16c commits the
    # substantive v1-baseline forbidden-pattern asserts.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run db:check

  contracts-check:
    name: contracts-check (OpenAPI generator determinism)
    runs-on: ubuntu-latest
    needs: install
    # Pure static analysis: re-emit openapi/v1.yaml from packages/contracts/
    # Zod schemas and assert byte-identical to the committed file. Architecture
    # §3.2 line 1862-1865 generator-determinism CI gate. No DB / network.
    # Story 1.4 commits the integrity primitive on a substrate-proof toy
    # endpoint; substantive endpoints land at apps/api/ Stories 1.9+. The
    # OpenAPI breaking-change semantic-diff CI gate (architecture §3.2 line
    # 1856-1860) is deferred to Story 1.9+ when route surfaces substantively
    # populate (deferred-work D1-1.4).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run contracts:check-openapi-determinism

  crypto-check:
    name: crypto-check (encryption substrate)
    runs-on: ubuntu-latest
    needs: install
    # Encryption substrate unit tests for @twt/domain/src/encryption: Tier-1
    # envelope round-trip + AAD binding; Tier-2 blind-index determinism +
    # cross-Pariwar separation; fake-KMS provider correctness. No DB; no live
    # KMS; KMS_TEST_MODE=fake. Architecture §2.7 + AR-12 + AR-13. Story 1.5
    # commits the substrate; live Cloud KMS provisioning + integration-test
    # live-DB substrate deferred per D1-1.5 + D2-1.3 (Story 1.6).
    env:
      KMS_TEST_MODE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run crypto:check

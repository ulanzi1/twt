      description: 'Records the authenticated member’s SELF-CLASSIFIED UPI failure mode as a member-level audit line for analytics tuning. "Anonymous" refers to the failure DETAIL, not the audit subject: the audit action is keyed on the mode alone (no free-text, no UTR / amount / payee / reference). Diagnostic only — it emits no contribution attestation and creates no yellow pill. The app calls this best-effort / fire-and-forget — a failed call never blocks the member’s ability to retry or attest. Returns 204 (no body).'

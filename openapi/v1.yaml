                  type: string
                  enum:
                    - past_lockin
              required:
                - kind
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - rule_subclause
                clause_id:
                  type: string
                  pattern: ^niy\.[a-z0-9]+(?:-[a-z0-9]+)*\.[a-z0-9]+(?:-[a-z0-9]+)*(?:\.[a-z0-9]+(?:-[a-z0-9]+)*)?$
                subclause:
                  type: string
                  minLength: 1
              required:
                - kind
                - clause_id
                - subclause
              additionalProperties: false
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - named_cohort
                definition:
                  type: string
                  minLength: 1
              required:
                - kind
                - definition
              additionalProperties: false
            - type: "null"
        status:
          type: string
          enum: &a56
            - draft
            - in_review
            - signed_off
            - published
            - discarded
        authoredByActor:
          type: string
          format: uuid
        toneReviewedBy:
          type:
            - string
            - "null"
          format: uuid
        toneReviewedAt:
          type:
            - string
            - "null"
          format: date-time
        toneReviewContentHash:
          type:
            - string
            - "null"
        publishedClauseVersionId:
          type:
            - string
            - "null"
          format: uuid
        createdAt:
          type: string
          format: date-time

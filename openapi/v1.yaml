      description: "What the member's appeal screen needs to render itself honestly, in one read: which moderation acts they may appeal RIGHT NOW (already filtered to acts with no open appeal, so the screen can show the one-open-at-a-time state without first earning a 409), plus their own appeals newest-first. ⚠ This read exists because the validity payload derives moderation standing from `specialFlags` and carries NO moderation-action id, while §8.8 identifies an appeal BY the act's §8.6 record. ⛔ The alternative — letting the server infer the act from the member's current standing — was rejected: an inferred subject on a governance write is the shape that lets a member appeal something other than what they were shown. ⛔ Carries no Tier-1 text."

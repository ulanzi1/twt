name: deploy-staging

# GitHub Actions → Dokploy API deploy (Story 1.15, AC-5; architecture §5.4).
# Release-branch push → WIF-keyless build + push to Artifact Registry → POST the
# Dokploy deploy API. STAGING is the dev→staging→prod promotion gate's first live
# rung; prod (deploy-prod.yml) runs after staging is confirmed green.
#
# No long-lived key: `id-token: write` lets google-github-actions/auth exchange the
# GitHub OIDC token for a short-lived GCP credential (WIF, infra/gcp/wif.tf). The
# WIF provider + deployer SA are env-scoped repository variables (terraform outputs
# `wif_provider_name` / `deployer_service_account_email`).

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  GCP_PROJECT: twt-staging
  GCP_REGION: asia-south1
  AR_REPO: twt-images

jobs:
  build-and-push:
    name: build + push (${{ matrix.app }})
    runs-on: ubuntu-latest
    environment: staging
    # Per-app image build. The per-Pariwar dimension (§5.4) is resolved at RUNTIME
    # via the Pariwar-Passport branding-bundle swap (infra/dokploy/) — one image set
    # serves every Pariwar under its /p/<id>/ path-scope; a bespoke per-Pariwar build
    # is only needed at the §5.3 migration trigger, when this matrix gains a `pariwar`
    # dimension.
    strategy:
      fail-fast: false
      matrix:
        app:
          - api
          - admin
          - jobs
          - public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace artifacts
        run: pnpm turbo run build --filter=@twt/${{ matrix.app }}
      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - name: Build + push image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/${{ matrix.app }}:${GITHUB_SHA}"
          docker build -f "apps/${{ matrix.app }}/Dockerfile" -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: trigger Dokploy deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Resolve Dokploy creds + POST the deploy API
        run: |
          DOKPLOY_API_URL="$(gcloud secrets versions access latest --secret=twt-staging-dokploy-api-url --project="$GCP_PROJECT")"
          DOKPLOY_API_TOKEN="$(gcloud secrets versions access latest --secret=twt-staging-dokploy-api-token --project="$GCP_PROJECT")"
          echo "::add-mask::${DOKPLOY_API_TOKEN}"
          curl --fail --silent --show-error -X POST "$DOKPLOY_API_URL" \
            -H "Authorization: Bearer ${DOKPLOY_API_TOKEN}" \
            -H 'content-type: application/json' \
            -d "$(jq -n --arg env staging --arg tag "${GITHUB_SHA}" '{environment: $env, imageTag: $tag}')"

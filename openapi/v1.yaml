        startSeq:
          type:
            - integer
            - "null"
          minimum: 1
        startAuditId:
          type:
            - string
            - "null"
          format: uuid
        endSeq:
          type:
            - integer
            - "null"
          minimum: 1
        endAuditId:
          type:
            - string
            - "null"
          format: uuid
        firstBrokenSeq:
          type:
            - integer
            - "null"
          minimum: 1
        firstBrokenAuditId:
          type:
            - string
            - "null"
          format: uuid
        rowsVerified:
          type: integer
          minimum: 0
        verifierActor:
          type: string
          minLength: 1
        triggerSource:
          type: string
          minLength: 1
        acknowledgement:
          type:
            - object
            - "null"
          properties:
            acknowledgementId:
              type: string
              format: uuid
            checkId:
              type: string
              format: uuid
            acknowledgedAt:
              type: string
              format: date-time
            acknowledgedBy:
              type: string
              format: uuid
            ticketRef:
              type: string
              minLength: 1
              maxLength: 512
          required:
            - acknowledgementId
            - checkId
            - acknowledgedAt
            - acknowledgedBy
            - ticketRef
          additionalProperties: false
      required:
        - checkId
        - verifiedAt
        - chainValid
        - startSeq
        - startAuditId
        - endSeq
        - endAuditId
        - firstBrokenSeq
        - firstBrokenAuditId
        - rowsVerified
        - verifierActor
        - triggerSource
        - acknowledgement
      additionalProperties: false
    AuditIntegrityCheckList:
      type: array
      items:
        type: object
        properties:
          checkId:
            type: string
            format: uuid
          verifiedAt:
            type: string
            format: date-time
          chainValid:
            type: boolean
          startSeq:
            type:
              - integer
              - "null"
            minimum: 1
          startAuditId:
            type:
              - string
              - "null"
            format: uuid
          endSeq:
            type:
              - integer
              - "null"
            minimum: 1
          endAuditId:
            type:
              - string
              - "null"
            format: uuid
          firstBrokenSeq:
            type:
              - integer
              - "null"
            minimum: 1
          firstBrokenAuditId:
            type:
              - string
              - "null"
            format: uuid
          rowsVerified:
            type: integer
            minimum: 0
          verifierActor:
            type: string
            minLength: 1
          triggerSource:
            type: string
            minLength: 1
          acknowledgement:
            type:
              - object
              - "null"
            properties:
              acknowledgementId:
                type: string
                format: uuid
              checkId:
                type: string
                format: uuid
              acknowledgedAt:
                type: string
                format: date-time
              acknowledgedBy:
                type: string
                format: uuid
              ticketRef:
                type: string
                minLength: 1
                maxLength: 512
            required:
              - acknowledgementId
              - checkId
              - acknowledgedAt
              - acknowledgedBy
              - ticketRef
            additionalProperties: false
        required:
          - checkId
          - verifiedAt
          - chainValid
          - startSeq
          - startAuditId
          - endSeq
          - endAuditId
          - firstBrokenSeq
          - firstBrokenAuditId

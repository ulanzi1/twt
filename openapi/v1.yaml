  /api/v1/member/kyc/initiate:
    post:
      summary: Signup KYC — begin a DigiLocker pull (returns the authorization redirect)
      description: Resolves the active KYC provider and begins a DigiLocker authorization-code flow for the authenticated member (must be pending-kyc), returning the authorizationUrl the client opens + the transactionId the callback correlates. Requires a member session.
      tags: &a20

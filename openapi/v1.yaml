  /api/v1/member-data-rights/delivery/{grantId}/redeem:
    post:
      summary: MEMBER redeems a delivery grant — UNAUTHENTICATED by necessity (AC-R1)
      description: "⛔ The one unauthenticated route on this surface, and deliberately so: the subject is a member whose portal access has ended, and issuing them a session is precisely what Niyamavali §8.4 forecloses. It is NOT an open surface — redemption needs TWO secrets (the unguessable grantId in the path AND the OTP delivered to the registered mobile), the grant is one-time and short-lived, and EVERY failure mode (unknown / spent / expired / wrong code / staff-mediated channel) returns the SAME 404, so it is not an existence oracle. Carries the named WRITE rate-limit tier. Responds with the export ZIP on success."
      tags:
        - member-data-rights
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: grantId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRedeemRequest"
      responses:
        "200":
          description: The export archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Grant unknown, spent, expired, wrong code, or not member-direct
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

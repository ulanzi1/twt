          in: path
      responses:
        "200":
          description: The banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (banner.manage) for this Pariwar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Banner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Edit a banner (one unified edit; the server content hash decides whether a re-review is required)
      description: The server recomputes a content hash over the four member-visible copy fields. If the hash is UNCHANGED (e.g. extending valid_until, flipping display_once_per_member) the edit applies with no re-review and no revision bump, and every existing member dismissal stands. If the hash CHANGED on a PUBLISHED banner, a fresh NON-AUTHOR tone-review sign-off is required (409 otherwise), `revision` is bumped, and every prior dismissal stops suppressing — so the banner re-appears for members who had dismissed the earlier copy. On a draft, copy edits are free. A retracted banner is terminal and rejects every edit (409).
      tags: *a71
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: bannerId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBannerRequest"
      responses:
        "200":
          description: The updated banner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Banner"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (banner.manage) for this Pariwar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Banner not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The banner is retracted (terminal); OR a copy revision on a published banner without a fresh non-author tone-review sign-off; OR the banner's status changed concurrently before this edit could be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The merged row would be an undismissable popup, an empty window, or a published banner missing a required copy field
          content:

        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Telegram unavailable for this Pariwar, or already opted in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Read the member’s current Telegram opt-in status
      description: Returns the member’s current opt-in state (null when never opted in) + whether the toggle is available (Telegram enabled + bot) + the `/start` deep-link (PENDING only).

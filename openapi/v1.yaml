      description: "Publishes the next version row for this flag with `pariwar_id: null` — the cross-tenant tier that governs every Pariwar without its own override at once. Strictly higher-privilege than the catalog read (Decision 7's read/write key split), so this is super_admin-only regardless of who can view the catalog. Same immutability, rationale, and 409-on-race semantics as the per-Pariwar flip. Send an optional `Idempotency-Key` header to make a retried flip safe. NOTE: `effective_from` may not be in the future — scheduled flips are not supported."
      tags: *a70
      parameters:
        - schema:
            type: string
          required: true
          name: flagKey

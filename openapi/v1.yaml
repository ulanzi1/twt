              schema:
                $ref: "#/components/schemas/DeviceTokenRegisterResponse"
        "400":
          description: Request validation failed (bad platform or token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/device-tokens:
    post:
      summary: Register the admin device push token (FCM/APNs) on admin auth
      description: Registers the current device's FCM (Android) / APNs (iOS) push token for the authenticated admin (the Story 1.9 admin-auth consumer). Admin identity is global — the token keys on the admin-global namespace. Same idempotent upsert + app-open rebuild as the member endpoint. Requires an admin session. The token is NEVER echoed back (Tier-1 discipline).
      tags: *a22
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRegisterRequest"
      responses:

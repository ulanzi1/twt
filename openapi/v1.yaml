  /api/v1/p/{pariwarId}/surveys/{surveyId}/questions/{questionId}/free-text:
    get:
      summary: The free-text answers to one question, UNATTRIBUTED
      description: "Returns `{answer_text, submitted_at}` and nothing else: no member id, no row id, no question echo and no ordinal — a stable per-respondent ordinal would let two reads of two different questions be aligned row-for-row, reconstructing one member's whole submission. Ordered by submitted_at with no identifying tie-break, so answers submitted in the same instant have an unstable relative order across reads; that is the correct trade. Reading this writes an audit line carrying the survey id and a COUNT, never the answer content. Free-text answers are member-authored personal data and have no export path in v1."
      tags: *a72
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: surveyId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: questionId
          in: path
      responses:
        "200":
          description: The paginated unattributed answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurveyFreeTextList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (survey.manage) for this Pariwar
          content:

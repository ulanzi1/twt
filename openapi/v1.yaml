                - primary_color
                - secondary_color
              additionalProperties: false
            localeDefault:
              type: string
              enum: *a3
            createdAt:
              type: string
              format: date-time
            createdBy:
              type:
                - string
                - "null"
              format: uuid
            updatedAt:
              type: string
              format: date-time
          required:

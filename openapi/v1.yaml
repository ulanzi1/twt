            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An appeal against this moderation act is already OPEN (`member_moderation.appeal_already_open`). ⛔ NOT an exhaustion — a further appeal may be filed once the open one is determined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The member is under no moderation, so there is no act to appeal (`member_moderation.appeal_not_appealable`)

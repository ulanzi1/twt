version: 1
# ─────────────────────────────────────────────────────────────────────────────
# THE CAPABILITY BAR — feature-flag governance boundary (Story 10.8, FR-58C).
#
# The closed allowlist of behaviours a feature flag is permitted to toggle, plus
# the prohibitions that make the governance boundary structurally enforceable.
# Read by the repo-global `governance-boundary` CI gate (scripts/governance-boundary/).
# Mirrors fr-100-non-add.yaml + bank-allowlist.yaml (the versioned-config +
# conformance-gate precedent).
#
# ── WHY THIS FILE EXISTS ─────────────────────────────────────────────────────
# A feature flag is, by construction, a mechanism for changing production
# behaviour without a code review. That is exactly what makes it useful for the
# FR-2 DigiLocker cutover — and exactly what makes it the most attractive
# available route around every governance control this system has. The bar's job
# is to make "what a flag may change" a CLOSED, attested set, so that route does
# not exist. A flag key that is not listed below cannot be created (the domain
# registry and the gate both reject it).
#
# ── THE TWO GATE LEGS, AND WHICH ONE IS LOAD-BEARING ─────────────────────────
# Leg (a) CONFORMANCE — every key in the domain flag registry resolves to exactly
#   one `allow` entry here, and `count` agrees with the entry total. This is
#   BOOKKEEPING. It is green the moment it lands and stays green while someone
#   adds a flag read inside the RBAC module.
# Leg (b) SOURCE SCAN — no feature-flag import reaches inside a governance module
#   (see `prohibited` below). THIS is the invariant, and the only load-bearing
#   half. A green leg (a) proves nothing on its own. If you are ever tempted to
#   weaken leg (b) to make a build pass, you are removing the whole point.
#
# ── WHAT LEG (b) ACTUALLY GUARANTEES — stated honestly (Review Pass 2) ────────
# Leg (b) is a PER-FILE AST scan. It parses each file under a prohibited root and
# reports any import, re-export, destructuring, or namespace access that names
# the feature-flags module or its evaluation symbols. What that gives you:
#
#   GUARANTEED: no DIRECT flag read inside a governance module, and no
#   single-hop NAMED one — including aliased imports, namespace imports and
#   re-exports, dynamic import()/require() (literal or non-literal specifier),
#   destructured bindings, and computed/bracket property access.
#
#   NOT GUARANTEED: TRANSITIVE reachability. The scanner resolves no module
#   specifiers and follows no edges, so a governance module importing an
#   innocent-looking helper that itself imports the evaluator is not detected.
#   Catching that needs full module-graph resolution, which this gate does not do.
#
# This file previously described the prohibitions as "structurally impossible".
# That overstated a per-file scanner. The accurate claim is that the DIRECT and
# NAMED routes are mechanically closed and a violation cannot be committed by
# accident or by a casual edit — a determined author with an indirection file can
# still get around it, and no static per-file check changes that. Documented
# rather than papered over: a gate whose advertised guarantee exceeds its real
# coverage is how a green run comes to mean less than a reader assumes.
#
# ── ADMISSION WORKFLOW (Story 7.5-style trustee attestation) — AC6 ───────────
# Adding a flag-toggleable behaviour is a SINGLE reviewed change that MUST carry
# ALL of:
#   1. Trustee attestation (recorded in .decision-log.md) — the capability-bar bump.
#   2. A new `allow` entry below: { kind, artifact, rationale, adr }. The
#      `rationale` states what the flag toggles AND why that behaviour is safe to
#      toggle without a code review; `adr` cites the attesting ADR.
#   3. A bump of `count` in the SAME commit (revert-sanity teeth: silently
#      dropping an entry, or adding one without attesting it, fails the gate).
#   4. A matching key in `FLAG_DEFAULTS` (packages/domain/src/feature-flags/
#      registry.ts) with a named owner + a dead-by date.
# The bar cannot be silently expanded: the gate asserts registry ≡ allowlist in
# BOTH directions, so neither half can move alone.
#
# ── WHAT MAY NEVER BE ADMITTED ───────────────────────────────────────────────
# An entry naming a behaviour frozen by the Architectural Freeze Boundaries table
# (epics.md:510-543) is REJECTED BY THE PARSER, with the freeze row cited. A
# frozen architectural property is not a feature-flag-toggleable behaviour; it
# changes by ADR or trustee-ratified Sprint Change Proposal, never by a flip.
# ─────────────────────────────────────────────────────────────────────────────

# The exact number of allowlisted behaviours. The gate asserts the registry and
# this list both equal this count (revert-sanity teeth — flipping it fails CI).
count: 6

# The permitted behaviour kinds. A new kind is itself a bar expansion and needs
# the same attestation as a new entry (the parser rejects an unknown kind).
kinds:
  - member_flow # changes a member-facing flow's shape (a CTA appears/disappears)
  - provider_selection # picks between already-abstracted, already-reviewed providers
  - channel_routing # changes which delivery channel/route a notification takes

allow:
  - kind: member_flow
    artifact: kyc_manual_fallback
    rationale: >-
      Toggles the FR-2 DigiLocker hard-mandatory cutover per cohort: when enabled the
      manual-fallback CTA is hidden and the hard-mandatory copy block is shown. Safe to
      toggle without a code review because BOTH branches are fully-reviewed shipped code
      paths — the flag selects between them, it does not introduce behaviour. The flag's
      `fallback_default` is `false`, meaning "the CUTOVER is not active" — the seam then
      inverts that into "the manual fallback IS available", so an unevaluable cohort rule
      degrades toward members still being able to join, never toward locking them out.
      (Corrected in Review Pass 2: this rationale previously read `true` as "fallback
      AVAILABLE" and the registry constant was `true`, which traced through
      `!decision.enabled` to the CTA being HIDDEN — the exact opposite of what this
      attestation claimed. The flag is named for the cutover, not for the fallback.)
    adr: ADR-0036
  - kind: provider_selection
    artifact: kyc_provider_selection
    rationale: >-
      Selects the active KYC provider per cohort from the AR-43 provider-interface
      abstraction. Safe to toggle because the abstraction ITSELF is frozen (freeze row
      13) — the flag may only choose among registered providers behind it, never alter
      the interface. Freeze row 13 explicitly contemplates this: "provider implementation
      is fluid via feature flag (FR-2 + FR-58C); abstraction itself is frozen."
      DECLARED, NOT PRODUCTION-ACTIVE (Trustee condition, 2026-08-01): the read is gated
      behind `alternateProviderKey`, which no construction site sets today — the only
      other registered builder is the FIXTURE provider, so this admission has no live
      consumer. Re-trigger: the story that registers a real second AR-43 vendor.
    adr: ADR-0036
  - kind: channel_routing
    artifact: wa_cost_optimization
    rationale: >-
      Enables WhatsApp cost-optimization routing per cohort (AR-18). Safe to toggle
      because it selects among delivery routes WITHIN the frozen three-tier hierarchy
      (freeze row 4) and cannot reorder or remove a tier. NOT WIRED as of Story 10.8 —
      admitted here so the behaviour is attested before its consumer story lands; the
      consumer still returns its fail-safe default.
      DECLARED, NOT PRODUCTION-ACTIVE (Trustee condition, 2026-08-01): admitted capability,
      not live production behaviour, until the per-Pariwar cost-optimization admin surface
      ships and the consumer read replaces the hardcoded fail-safe.
    adr: ADR-0036
  - kind: member_flow
    artifact: restoration_discipline_imposition
    rationale: >-
      ⛔ NOT AN ORDINARY ROLLOUT TOGGLE. Gates whether the apps/jobs restoration-discipline
      job WRITES the automatic §3.1 R7 lock-in imposition added by Story 10.23 — i.e.
      whether an automatic process removes a member's COVERAGE with no human in the loop.
      Classified `member_flow` as the closest fit of the three declared kinds, and that
      classification is itself a small governance act: it is named explicitly here so a
      future auditor of this file does not have to reverse-engineer why a BACKGROUND JOB
      carries a member-flow flag. Disabled (the default), the job performs its existing
      read-only scan and skips the imposition step entirely; enabled, every candidate the
      scan's own `imposesRestorationObligation` predicate selects is written.
      ⛔ ENABLEMENT IS TRUSTEE-PANEL-EXCLUSIVE per Decision 2026-08-07-089, exercised
      through a formal .decision-log.md entry. Operations owns HOW a flip executes, never
      WHETHER it may occur; a ticket, config-PR approval, deployment sign-off or verbal
      go-ahead is NOT an authorization. Authorization is tied to — and may NOT precede —
      the decision that discharges Story 10.23's Escalation 6 discharge invariant ("the
      completion condition of every restoration package it imposes must be satisfiable
      through a ratified system workflow"), which is UNDISCHARGED: R7(D)/(E)/(F) define
      their packages in terms of paying a CLOSED cycle and no authorized catch-up process
      exists. Non-production enablement confers NO production authority. FLIPPING IT
      WITHOUT THAT DECISION IS A GOVERNANCE VIOLATION, NOT A CONFIGURATION CHANGE.
      Safe to ADMIT (as distinct from enable) because `fallbackDefault` is `false` and
      every degraded path — no version in force, malformed cohort rule, lookup error —
      lands on "the writer does nothing", so the flag's mere existence changes nothing.
    adr: Story 10.23 / Decision 2026-08-07-088 (clauses 4-5) + Decision 2026-08-07-089
  - kind: member_flow
    artifact: termination_access_block
    rationale: >-
      ⛔ THE FIRST FLAG THAT CONDITIONS AUTHENTICATION. Gates whether a member carrying a
      `terminated` MODERATION OVERLAY is denied issuance of a member session, on the login
      and refresh-rotation paths (Story 10.19, FR-56 / Niyamavali §8.4). Enabled, OTP
      verification still SUCCEEDS and identity is verified; what is denied is authorization
      to ESTABLISH A MEMBER SESSION, and a structured termination response is returned
      instead. Disabled (the default), both paths behave exactly as they do today.
      ⛔ NOT to be described as "login fails" or "login succeeds but returns 403" — Decision
      2026-08-10-098 clause 3 rules that vocabulary out, because it collapses identity
      verification (which succeeds) with authorization to establish a session (which is
      denied). The HTTP status is a transport detail; the domain semantics are not.
      Classified `member_flow` as the closest fit of the three declared kinds, and that
      classification is itself a small governance act: named here so a future auditor does
      not have to reverse-engineer why an AUTHENTICATION gate carries a member-flow flag.
      ⚠ ADMISSION INTO AUTHENTICATION WAS ITSELF THE RULING, NOT A SIDE EFFECT OF A GREEN
      GATE. `apps/api/src/modules/auth/` is not among the `prohibited` roots below — not
      because it was cleared, but because no story had proposed a flag there — so leg (b)
      passes on this flag, and a passing scan proves the root is UNLISTED, not that the
      behaviour is admissible. The bar was extended into authentication by Decision
      2026-08-10-097 clause 7(i), ratified-as-written by 2026-08-10-098 clause 2. Do not
      cite the gate as the authority for this entry; cite the Decisions.
      ⚠ POLARITY, TRACED RATHER THAN ASSERTED (Decision 097 clause 7(ii)). `fallback_default`
      is `false`, meaning "DO NOT deny session issuance". Traced through: a degraded path —
      no version in force, a malformed cohort rule, a lookup error — yields `false`; the
      consumer reads `false` as "the block is not active"; THE MEMBER RECEIVES A NORMAL
      SESSION. ⇒ THIS SAFEGUARD FAILS OPEN. That is the opposite of what "fail-safe" usually
      means at an auth gate, and it is deliberate and ratified: default-OFF must be the
      behaviour of the ABSENT configuration (Q6 sub-choice (b-i)), so a terminated member
      retaining access is the correct degraded outcome until the Panel authorises the flip —
      and it is the status quo, so no degraded path is a regression. The tracing is required,
      not decorative: the `kyc_manual_fallback` entry above asserted the opposite of its own
      code through three review passes because a polarity was stated instead of followed
      through to its outcome.
      Safe to ADMIT (as distinct from enable) because `fallback_default` is `false` and every
      degraded path lands on today's behaviour, so the flag's mere existence changes nothing.
      ⛔ ENABLEMENT IS TRUSTEE-PANEL-EXCLUSIVE and is additionally gated on STORY 10.21 (the
      off-portal DPDPA route) having landed — Decision 2026-08-10-097 clause 6, sub-choice
      (b-i). Until 10.21 exists, enabling this leaves a terminated member with NO route to
      their statutory rights, and §8.4's promise that those rights are exercised "through an
      identity-verified administrative process" would have no process behind it. Operations
      owns HOW a flip executes, never WHETHER it may occur; non-production enablement confers
      NO production authority. FLIPPING IT BEFORE 10.21 LANDS IS A GOVERNANCE VIOLATION, NOT
      A CONFIGURATION CHANGE.
      ⚠ WHAT ENABLING IT DOES NOT ACHIEVE, recorded so no future reader overstates it: the
      flip ends ONE ACCOUNT'S access. A terminated member who obtains a second mobile number
      re-registers unimpeded — signup dedup keys on the mobile blind index alone, and neither
      KYC path detects the collision (see deferred-work.md, "identity collision at signup is
      unenforced"). Sub-choice (b-ii), which would have gated the flip on that control, was
      NOT ratified; the Panel ruled (b-i) knowing this.
    adr: Story 10.19 / Decision 2026-08-10-097 (clauses 6-8) + Decision 2026-08-10-098
  - kind: channel_routing
    artifact: telegram_mirror
    rationale: >-
      Enables the FR-73 Telegram mirror per cohort. Safe to toggle because the mirror is
      fire-and-forget by architectural definition (freeze row 4) — no member-facing
      guarantee depends on it, so neither state can degrade a delivery commitment. NOT
      WIRED as of Story 10.8; the consumer still returns its fail-safe default.
      DECLARED, NOT PRODUCTION-ACTIVE (Trustee condition, 2026-08-01): admitted capability,
      not live production behaviour, until the first live Telegram mirror dispatch story
      reads this flag.
    adr: ADR-0036

# ── PROHIBITED: the governance modules a flag read may never reach inside ────
# Leg (b) scans these roots for any import of the feature-flags namespace or of
# `evaluateFlag`. A hit is a gate FAILURE. Each entry names the prohibition from
# epics.md:3516-3522 that it mechanically closes against DIRECT and single-hop
# NAMED reads — see the "WHAT LEG (b) ACTUALLY GUARANTEES" block above for the
# precise claim, and note that transitive reachability is NOT covered.
# (This line said "structurally impossible" until Review Pass 4 caught that the
# Pass-2 retraction had corrected the header and left this sentence standing —
# one file asserting both the honest and the overstated claim.)
#
# ⚠ These are the ENFORCEMENT ROOTS — the production modules that actually decide
# things — never the test files that assert about them. Scanning a test file would
# be a vacuous gate: a test has no enforcement logic to bypass. (The 9.5
# canonical-financial-truth fence is enforced by the contribution module's
# confirmed-truth reads, so `packages/domain/src/contribution/` is the root, not
# `tests/contribution/canonical-financial-truth.test.ts`.)
prohibited:
  - root: packages/domain/src/audit
    prohibition: >-
      (a) A flag must never disable or condition audit logging. The §1.5 hash chain is
      tamper-evident precisely because it is unconditional; a flag-conditioned audit line
      is an audit line an attacker can turn off.
  - root: packages/domain/src/rbac
    prohibition: >-
      (d) A flag must never escalate RBAC. Permission keys, scope dimensions, and grant
      containment are freeze row 9; a flag-conditioned permission check is a privilege
      escalation with a config-shaped switch on it.
  - root: packages/domain/src/consent
    prohibition: >-
      (b) A flag must never bypass Story 2.7 / DPDPA consent. Consent is a legal
      obligation, not a product behaviour, and cannot be subject to a rollout cohort.
  - root: packages/validity-service/src
    prohibition: >-
      (c) A flag must never override Validity Service eligibility. The ≤60s freshness
      invariant is freeze row 11 and validity is the single eligibility authority; a
      flag-conditioned validity answer forks that authority.
  - root: packages/domain/src/contribution
    prohibition: >-
      (g) A flag must never bypass the canonical-financial-truth fence (Story 9.5). Money
      facts have exactly one source; a flag that could re-route which reads count as
      confirmed truth would make the ledger conditional on config.
  - root: scripts
    prohibition: >-
      (f) A flag must never disable a CI gate (Story 1.16a-d and every gate since). A gate
      that a flag can switch off is not a gate. This root also covers (e) — the gates are
      what enforce the Architectural Freeze Boundaries table (epics.md:510-543), and an
      `allow` entry naming a frozen-table behaviour is additionally rejected by the parser.
  # ── Added in Review Pass 2 ──────────────────────────────────────────────────
  # The original six roots left two classes of governance surface unscanned: the
  # deterministic-assignment and money modules inside the domain, and the request
  # path in apps/api where RBAC is actually ENFORCED (prohibition (d) is about
  # escalation, which happens at the check site, not in the key catalog).
  #
  # ⚠ NOT `apps/` wholesale — that would fail immediately and correctly: the
  # LEGITIMATE flag consumers live there (kyc/manual-fallback-seam.ts,
  # kyc/provider-registry.ts, channel-config/composition.ts, and the
  # feature-flags module itself). Only the enforcement subtrees are prohibited.
  - root: packages/domain/src/pool
    prohibition: >-
      (e) A flag must never alter pool assignment. The deterministic assignment model is
      freeze row 1 and its version pin covers the WHOLE algorithm (hash + truncation +
      delimiter + balancing); a flag-conditioned branch anywhere inside it breaks replay
      identity, which is the property the snapshot-is-truth design rests on.
  - root: packages/domain/src/claim
    prohibition: >-
      (e/g) A flag must never condition claim lifecycle or disbursement routing. Claim
      state transitions and the nominee-account model are frozen; money movement that
      depends on a rollout cohort cannot be reconciled or replayed.
  - root: apps/api/src/middleware
    prohibition: >-
      (d) A flag must never condition request-path authorization. This is where RBAC is
      actually ENFORCED — the domain rbac module only defines the catalog — so it is the
      site where a flag-conditioned check would be a real privilege escalation.
  - root: apps/api/src/modules/rbac
    prohibition: >-
      (d) A flag must never condition the permission-gate composition. The
      require*Permission wrappers are the enforcement seam every admin route depends on.
  - root: apps/api/src/audit
    prohibition: >-
      (a) A flag must never condition audit writing at the app boundary — the same
      prohibition as the domain audit module, at the layer that actually calls it.
  - root: apps/api/src/plugins
    prohibition: >-
      (a/d) A flag must never condition a server-wide plugin (auth, scope, audit context).
      A plugin runs before every route, so a flag-conditioned one silently re-shapes the
      guarantees every downstream handler assumes.

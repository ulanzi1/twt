  /api/v1/member/nominees:
    post:
      summary: Signup nominees — declare 1–2 nominees (emits member.nominees_declared)
      description: Declares 1 or 2 nominees (name/relationship/mobile + optional address; Tier-1 encrypted) with a SERVER-derived 75/25 split when two are declared (100% for one) — the client cannot override the split. Replaces any prior declaration (latest-wins) and emits member.nominees_declared (a non-PII audit marker; count + split only) on the member stream. NO nominee Aadhaar/KYC and NO nominee bank/IFSC are collected at signup (claim-time only, Epic 6). Requires a member session (no step-up at signup — Life Events adds it in 3.9).

  /api/v1/member/medical-disclosure:
    post:
      summary: Signup medical disclosure — submit IMA disclosures + concealment-denial ack
      description: Submits 0..N IMA-listed conditions (zero is valid — most members disclose nothing) + the optional free-text additional context (both Tier-1 encrypted) with a MANDATORY concealment-denial acknowledgment (server rejects acknowledged !== true). Records a consent (medical_disclosure_ack, referencing niy.concealment.r14) via the audit-or-throw chain, APPENDS a disclosure row (append-only history — Epic 4 walks the full history), and emits member.medical_disclosed (a non-PII marker; count + ima_list_version + ack only). Requires a member session (no step-up at signup — Life Events adds it in 3.9).
      tags: &a27
        - member-medical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicalDiscloseRequest"
      responses:
        "200":
          description: Disclosure recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalDisclosureStatusResponse"
        "400":
          description: Validation failed (ack not true, or an unknown IMA condition code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Member not found / terminal state, or a required clause (IMA list / concealment) is unresolvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Signup medical disclosure — the latest disclosure status (NO PII echo-back)
      description: Returns the member's latest medical disclosure as a NON-PII summary (disclosedAt, imaListVersion, conditionCount, a presence flag for the free-text, ackLocale) + the total history count. NEVER the raw condition codes / free-text bytes (Tier-1 echo-back discipline). Requires a member session.
      tags: *a27
      responses:
        "200":
          description: Latest disclosure + history count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalDisclosureStatusResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/member/medical-disclosure/ima-list:
    get:
      summary: Signup medical disclosure — the IMA catalog + concealment-ack copy
      description: Returns the resolved IMA condition catalog (version = the niy.medical.ima-list clause_version_id + bilingual conditions) plus the concealment-ack copy (ackText.en / ackText.hi from niy.concealment.r14) the screen renders. Returns 503 when the registry is unprovisioned for the Pariwar (either clause absent). Requires a member session.

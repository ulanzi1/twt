          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Forbidden — feature_flag.flip at dimension: global is required (super_admin only)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown feature flag key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A concurrent flip won the race; OR an illegal state transition under the staged-rollout ladder (off → canary → rollout → full, rollback from any serving state); OR a flag key not admitted to the capability bar; OR the acting admin has no display_name recorded; OR a flip with this Idempotency-Key is already in progress
          content:

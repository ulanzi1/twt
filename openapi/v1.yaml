              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The survey is closed (terminal); OR the edit touches a field frozen by publish (the error names it); OR the survey's status changed concurrently before this edit could be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An empty/inverted window, a SHORTENED valid_until on a published survey, an unusable audience scope, or a questionnaire violating a declared bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/p/{pariwarId}/surveys/{surveyId}/publish:
    post:
      summary: Publish a survey draft (draft → published)
      description: "Publishing does NOT open the survey by itself — openness is the read-time window. A published survey whose valid_from is in the future reads as `scheduled` and opens when the clock passes it, with nothing running. Requires all four copy fields and at least one question (422 otherwise) and a NON-AUTHOR tone-review sign-off: the publishing actor becomes the reviewer, so the survey's own author cannot publish it (409). The sign-off's content hash covers the copy AND the questionnaire, and since both are frozen from this moment it is a ONE-SHOT binding. Publishing also enqueues a member notification fan-out; a fan-out failure never rolls back the publish — the survey is published and the notification is retried."
      tags: *a72
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: pariwarId
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: surveyId
          in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishSurveyRequest"
      responses:
        "200":
          description: The published survey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Survey"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized (survey.manage) for this Pariwar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Survey not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Illegal transition for the survey's current status; OR the tone-review gate denied (author is the publisher / no sign-off); OR the survey's status changed concurrently before publish could be applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: A copy field (title, body, title_hi, body_hi) is missing — Hindi and English are both required; OR the survey has no questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/p/{pariwarId}/surveys/{surveyId}/close:
    post:
      summary: Close a survey (draft → closed as a discard, or published → closed to stop collecting)
      description: "TERMINAL — there is no reopen, deliberately: reopening would resume collecting answers into an aggregate an admin has already read and may have already quoted. To ask again, publish a new survey. Closing does not delete responses; a closed survey's aggregate stays readable."

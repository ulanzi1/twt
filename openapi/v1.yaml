            - amend
        payload:
          type: object
          additionalProperties: {}
        effectiveDate:
          type: string
          format: date-time
        benefitMechanism:
          type: string
          enum: *a5
        affectedMemberScope:
          oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                    - all_members
              required:
                - kind
              additionalProperties: false
            - type: object
              properties:

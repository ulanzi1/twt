      description: "Irreversible. Requires the originating `helpdesk_ticket_id` and fails closed without it; serializes against concurrent erasure/delivery via an advisory lock; appends `member.rtbf_anonymized` with actor `trustee` and trigger `member_data_rights.rtbf_fulfilled`. Requires an admin session, the `member.data_rights` permission (pariwar dimension) and a fresh `member_data_rights` step-up elevation. `Idempotency-Key` is REQUIRED: a replay of the same key is refused with a typed 409 rather than silently re-executed."

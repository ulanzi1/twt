# Allow-list — a finding is suppressed when an entry's `pattern` (regex, case-insensitive)
# matches the finding's line AND (if `file` is set) the file path ends with it. GENUINE
# non-applicables ONLY; each carries a reason. The #1 false-positive risk is the internal
# `passbook row` CSS pattern name + the `Yogdaan Bahi (passbook)` documentation gloss.
allow:
  - file: apps/admin/src/modules/pariwar-provisioning/AddPariwarForm.tsx
    pattern: 'primary_color|secondary_color|accent_color'
    reason: >-
      Pariwar brand-color form DEFAULTS (brandingBundle.*_color) — tenant DATA submitted
      to the API, not design-system styling. FM-14 #2 governs styling literals, not the
      values a Pariwar chooses for its own brand.
  - pattern: 'passbook[ -]row'
    reason: >-
      Internal CSS pattern name "passbook row" (UX spec L1156) — a code identifier, not
      member-visible copy.
  - pattern: '\(passbook\)'
    reason: >-
      Documentation gloss "Yogdaan Bahi (passbook)" pairing the canonical term with its
      English referent — not member-visible copy that uses the prohibited word.
  # Story 10.7 reports-&-exports library — the FIRST admin surface to contain the word
  # "report". The `report → Sahyog Vivran` vocabulary term is the MEMBER-visible register
  # (UX-DR71; it "bites Epic 2+ member surfaces, NOT admin code" — see the vocabulary
  # header). apps/admin is the STAFF/admin console (the member app is apps/mobile), and
  # "report"/"Report" here is the FR-58A "Reports & Exports Library" feature name plus code
  # identifiers (report_type, the report-export(s) query keys, the report- filename prefix)
  # and JSDoc — not member-facing copy. Scoped per-file (teeth preserved everywhere else).
  - file: apps/admin/src/modules/reports/ReportsPage.tsx
    pattern: '\breport'
    reason: >-
      Story 10.7 reports console (staff/admin surface, apps/admin). "report"/"Report" is
      the FR-58A feature name + code identifiers, not the member-visible register
      (Sahyog Vivran governs apps/mobile / Epic 2+ member copy).
  - file: apps/admin/src/routes/ReportsRoute.tsx
    pattern: '\breport'
    reason: >-
      Story 10.7 reports console route (staff/admin surface). "report" is the FR-58A
      feature name, not member-visible copy.
  - file: apps/admin/src/api/client.ts
    pattern: '\breport'
    reason: >-
      Story 10.7 admin API client reports methods (request/poll/download a report export).
      "report" is the FR-58A feature name + JSDoc/identifiers on a staff/admin surface,
      not the member-visible register.

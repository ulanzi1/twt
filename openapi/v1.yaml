          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: tone-review-required, or the draft is not signed off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

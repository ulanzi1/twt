    post:
      summary: Publish a clause draft (audit-logged, tone-review-gated)
      description: Mints the immutable clause_versions row + a single audit line carrying the diff hash + reviewer + clause_id + clause_version_id (AC2), then fires the member-notification hook (AC3 placeholder). Gated on a recorded non-author, content-current tone-review sign-off — without one, 409 tone-review-required (AC4). Requires niyamavali.amend.
